# Configuration for bob_token_contract example

# Contract artifacts to import for codegen (names without .json extension)
# These must already be compiled to docs/target/ directory
contracts:
  - bob_token_contract-BobToken

# Dependencies:
#   - @aztec-labs/* and @aztec-foundation/* packages install at the versions docs/aztec-node.json pins
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec-labs/aztec.js"
  - "@aztec-labs/accounts"
  - "@aztec-labs/wallets"
  - "@aztec-labs/kv-store"
  # Example external package (uncomment if needed):
  # - "npm:viem"
