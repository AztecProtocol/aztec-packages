# Configuration for recursive_verification example

# Setup script to run before index.ts (generates proof data)
setup: "node --preserve-symlinks --preserve-symlinks-main --import tsx/esm scripts/generate_data.ts"

# Contract artifacts to import for codegen (names without .json extension)
# These must already be compiled to docs/target/ directory
contracts:
  - recursive_verification_contract-ValueNotEqual

# Dependencies:
#   - @aztec-labs/* and @aztec-foundation/* packages install at the versions docs/aztec-node.json pins
#   - Use npm:package-name or npm:package-name@range for external npm packages
dependencies:
  - "@aztec-labs/aztec.js"
  - "@aztec-labs/accounts"
  - "@aztec-labs/wallets"
  - "@aztec-labs/kv-store"
  - "@aztec-labs/pxe"
  - "@aztec-labs/noir-contracts.js"
  - "@aztec-foundation/bb.js"
  - "@aztec-foundation/noir-noir_js"
