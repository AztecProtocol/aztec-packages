# A reader's clone of this example leaves out docs/, so it carries the settings docs/.yarnrc.yml gives it in
# this repository: the node-modules linker, and the 7-day gate with the first-party scopes pre-approved.
nodeLinker: node-modules

npmMinimalAgeGate: 7d

npmPreapprovedPackages: ['@aztec/*', '@aztec-labs/*', '@aztec-foundation/*']
