# Sparse tutorial clones omit docs/.yarnrc.yml, so this repeats the install settings this project needs from it.
nodeLinker: node-modules

npmMinimalAgeGate: 7d

# setup.sh writes in the versions it installs, so only those skip the age gate.
npmPreapprovedPackages: ['@aztec-labs/*@#include_aztec_version', '@aztec-foundation/*@#include_foundation_version']
