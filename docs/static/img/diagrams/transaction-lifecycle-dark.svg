<rect x="950" y="135" width="204" height="120" rx="10" class="card"/>
<text x="966" y="162" class="card-title">Ethereum L1</text>
<rect x="966" y="180" width="150" height="28" rx="6" class="badge-eth"/>
<text x="1041" y="198" class="badge-text badge-eth-text mid">ROLLUP CONTRACT</text>
<text x="966" y="234" class="tiny faint">Verifies rollup proofs</text>
</svg>
