<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Aztec transaction lifecycle</title>
<desc id="d">A user calls aztec.js, which talks to the Private Execution Environment holding a database, the ACIR simulator and the private kernel circuit. The PXE sends the transaction to an Aztec node, whose sequencer orders it; the prover network proves epochs, and the rollup contract on Ethereum verifies proofs and stores block data.</desc>
<style>
svg { font-family: Geist, Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
text { fill: #fff9f2; }
.muted { fill: #b6b8b0; }
.faint { fill: #93958a; }
.title { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.heading { font-size: 22px; font-weight: 600; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
.card-title { font-size: 14px; font-weight: 600; }
.body { font-size: 12.5px; }
.small { font-size: 11.5px; }
.tiny { font-size: 11px; }
.quote { font-size: 14px; }
.badge-text { font-size: 11px; font-weight: 700; letter-spacing: 1px; }
.private-title { fill: #c9caff; }
.public-title { fill: #9ccbff; }
.eth-title { fill: #d9ff66; }
.panel-private { fill: #231b38; stroke: #4a3d6e; stroke-width: 1.5; }
.panel-public { fill: #162a3e; stroke: #2f4f6e; stroke-width: 1.5; }
.panel-eth { fill: #282d16; stroke: #626554; stroke-width: 1.5; }
.card { fill: #1f240c; stroke: #626554; stroke-width: 1.5; }
.inner { fill: #141900; stroke: #626554; stroke-width: 1; }
.badge-private { fill: #a5a7fe; }
.badge-private-text { fill: #2a1240; }
.badge-public { fill: #5babff; }
.badge-public-text { fill: #0f2a44; }
.badge-eth { fill: #c8fa00; }
.badge-eth-text { fill: #141900; }
.node-public { fill: #20405f; stroke: #376799; stroke-width: 1.5; }
.node-private { fill: #332a5c; stroke: #6f6fd1; stroke-width: 1.5; }
.line { stroke: #fff9f2; stroke-width: 1.5; fill: none; }
.arrow { stroke: #fff9f2; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.arrowhead { fill: #fff9f2; }
.connector { stroke: #626554; stroke-width: 1.5; fill: none; }
.divider { stroke: #626554; stroke-width: 1.5; stroke-dasharray: 6 6; }
.burst { fill: #c8fa00; opacity: 0.55; }
.spent { opacity: 0.45; }
.cross { stroke: #fff9f2; stroke-width: 2; }
.mid { text-anchor: middle; }
</style>
<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
  </marker>
</defs>
<text x="40" y="52" class="heading">Transaction lifecycle (client side)</text>
<text x="612" y="52" class="heading">Public execution (network side)</text>
