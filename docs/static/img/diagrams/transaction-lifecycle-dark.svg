<text x="698" y="198" class="badge-text badge-public-text mid">SEQUENCER</text>
<text x="646" y="230" class="tiny faint">Orders transactions into blocks</text>
<line x1="740" y1="245" x2="740" y2="296" class="arrow"/>
<line x1="756" y1="302" x2="756" y2="251" class="arrow"/>
<rect x="630" y="302" width="234" height="150" rx="10" class="card"/>
<text x="646" y="329" class="card-title">Prover network</text>
