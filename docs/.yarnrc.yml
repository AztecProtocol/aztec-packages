nodeLinker: node-modules

npmMinimalAgeGate: 7d

# Docs and its examples install first-party packages (and their dependencies) exact-pinned to the 
# toolchain's BB_VERSION (see labs/labs-aztec-toolchain/bootstrap.sh) or to yarn-project's pinned resolutions,
# nightlies that are always younger than the age gate. All three scopes are owned by our release CI:
# @aztec-labs is what this repo publishes, @aztec-foundation holds the foundation packages it pins,
# and @aztec holds the viem fork.
npmPreapprovedPackages: ['@aztec/*', '@aztec-labs/*', '@aztec-foundation/*']

# Settles the peer requirements yarn reports unmet (YN0086). The optional ones are peers that no
# package loads in the contexts where they go unprovided. Each entry names the version it was
# checked against, so an upgrade brings the warning back for a fresh look.
packageExtensions:
  # Imported only from .d.ts files; the insights plugin loads search-insights from a CDN itself.
  '@algolia/autocomplete-shared@1.19.2 || 1.19.8':
    peerDependenciesMeta:
      '@algolia/client-search': { optional: true }
      algoliasearch: { optional: true }
  '@algolia/autocomplete-plugin-algolia-insights@1.19.2 || 1.19.8':
    peerDependenciesMeta:
      search-insights: { optional: true }
  # A types-only package (no JS entry point). Helmet does load react, but only core runs it, and
  # core requires react; the copies under @docusaurus/types and module-type-aliases are for types.
  '@docusaurus/types@3.10.2':
    peerDependenciesMeta:
      react: { optional: true }
      react-dom: { optional: true }
  '@slorber/react-helmet-async@1.3.0':
    peerDependenciesMeta:
      react: { optional: true }
      react-dom: { optional: true }
  # Core needs @mdx-js/react at build time and resolves it from the site directory
  # (resolveSitePkg), which declares it; the plugins whose core copy lacks it never run that copy.
  '@docusaurus/core@3.10.2':
    peerDependenciesMeta:
      '@mdx-js/react': { optional: true }
  # A loader run by the host bundler; it never requires webpack.
  'file-loader@6.2.0':
    peerDependenciesMeta:
      webpack: { optional: true }
  # ts-node type-checks and transpiles TypeScript Netlify build plugins only, and docs has none.
  'ts-node@10.9.2':
    peerDependenciesMeta:
      '@types/node': { optional: true }
  # These depend on a package whose peer is real (theme-common bundles requires of
  # plugin-content-docs/client; core needs react), so they pass it through from their parent.
  '@docusaurus/theme-mermaid@3.10.2':
    peerDependencies:
      '@docusaurus/plugin-content-docs': '*'
  '@docusaurus/plugin-css-cascade-layers@3.10.2':
    peerDependencies:
      react: '^18.0.0 || ^19.0.0'
      react-dom: '^18.0.0 || ^19.0.0'
