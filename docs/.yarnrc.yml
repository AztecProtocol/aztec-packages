nodeLinker: node-modules

npmMinimalAgeGate: 7d

# Docs and its examples install first-party packages (and their dependencies) exact-pinned to the 
# toolchain's BB_VERSION (see labs-aztec-toolchain/bootstrap.sh) or to yarn-project's pinned resolutions,
# nightlies that are always younger than the age gate. All three scopes are owned by our release CI:
# @aztec-labs is what this repo publishes, @aztec-foundation holds the foundation packages it pins,
# and @aztec holds the viem fork.
npmPreapprovedPackages: ['@aztec/*', '@aztec-labs/*', '@aztec-foundation/*']
