nodeLinker: node-modules

npmMinimalAgeGate: 7d

# The examples install first-party packages (and their dependencies) exact-pinned to the toolchain's
# BB_VERSION (see labs-aztec-toolchain/bootstrap.sh) or to yarn-project's pinned resolutions, nightlies
# that are always younger than the age gate. The @aztec npm scope is owned by our release CI.
npmPreapprovedPackages: ['@aztec/*']
