    from = "/developers/docs/reference/considerations/*"
    to = "/developers/docs/resources/considerations/:splat"

[[redirects]]
    from = "/developers/docs/reference/glossary"
    to = "/developers/docs/resources/glossary"

[[redirects]]
    from = "/developers/docs/reference/api"
    to = "/developers/docs/aztec-nr/api"

# reference/environment_reference → aztec-cli or wallet-cli
[[redirects]]
    from = "/developers/docs/reference/environment_reference/cli_wallet*"
    to = "/developers/docs/cli/aztec_wallet_cli_reference"

[[redirects]]
    from = "/developers/docs/reference/environment_reference/sandbox-reference"
    to = "/developers/getting_started_on_local_network"

[[redirects]]
    from = "/developers/docs/reference/environment_reference/*"
    to = "/developers/docs/cli/aztec_cli_reference"

# reference/smart_contract_reference → aztec-nr
[[redirects]]
    from = "/developers/docs/reference/smart_contract_reference/portals/*"
    to = "/developers/docs/aztec-nr/framework-description/ethereum-aztec-messaging/:splat"

[[redirects]]
    from = "/developers/docs/reference/smart_contract_reference/*"
    to = "/developers/docs/aztec-nr/framework-description/:splat"

# reference/* catch-all → resources
[[redirects]]
    from = "/developers/docs/reference/*"
    to = "/developers/docs/resources/:splat"

# =============================================================================
# ACTIVE REDIRECTS: Version Path Redirects
# Redirect old version paths to new split-docs structure
# =============================================================================
[[redirects]]
    from = "/devnet/*"
    to = "/developers/:splat"

[[redirects]]
    from = "/nightly/*"
    to = "/developers/:splat"

# =============================================================================
# ACTIVE REDIRECTS: Catch-All Path Migrations
# These handle broad path changes and legacy paths
# =============================================================================
[[redirects]]
    from = "/tutorials/*"
    to = "/developers/docs/tutorials/:splat"

[[redirects]]
    from = "/guides/*"
    to = "/developers/docs/aztec-nr/:splat"

[[redirects]]
    from = "/reference/*"
    to = "/developers/docs/resources/:splat"

[[redirects]]
    from = "/how-aztec-works/*"
    to = "/"

[[redirects]]
    from = "/sdk/*"
    to = "/"

[[redirects]]
    from = "/spec/*"
    to = "/"

[[redirects]]
    from = "/developers/sandbox/*"
    to = "/developers/getting_started_on_local_network"

[[redirects]]
    from = "/dev_docs/*"
    to = "/developers/getting_started_on_local_network"

# Tutorial → Getting Started redirect (local_network.md content moved)
[[redirects]]
    from = "/developers/docs/tutorials/local_network"
    to = "/developers/getting_started_on_local_network"
    status = 301


# =============================================================================
# ERROR CODES
# Sequential error code redirects for user-friendly error references.
# Each error code maps to a relevant documentation page.
# Add new error codes sequentially (1, 2, 3, ...).
# =============================================================================

[[redirects]]
    from = "/errors/1"
    # A warning that is shown when `aztec compile` is run and the contract crate contains tests
    to = "/developers/docs/aztec-nr/testing_contracts#keep-tests-in-the-test-crate"

[[redirects]]
    # Aztec-nr: custom message was received but no handler was configured
    from = "/errors/2"
    to = "/aztec-nr-api/mainnet/noir_aztec/macros/struct.AztecConfig.html"

[[redirects]]
    # Aztec-nr: message received with message type ID in the range reserved for future aztec.nr built-in message types
    from = "/errors/3"
    to = "/aztec-nr-api/mainnet/noir_aztec/messages/msg_type/index.html"

[[redirects]]
    # Aztec-nr: note packed length exceeds MAX_NOTE_PACKED_LEN
    from = "/errors/4"
    to = "/aztec-nr-api/mainnet/noir_aztec/macros/notes/fn.note.html"

[[redirects]]
    # Aztec-nr: event serialized length exceeds MAX_EVENT_SERIALIZED_LEN
    from = "/errors/5"
    to = "/aztec-nr-api/mainnet/noir_aztec/macros/events/fn.event.html"

[[redirects]]
    # Aztec-nr: direct invocation of contract functions is not supported
    from = "/errors/6"
    to = "/developers/docs/aztec-nr/framework-description/calling_contracts"

[[redirects]]
    # Aztec-nr: user-defined 'offchain_receive' is not allowed
    from = "/errors/7"
    to = "/aztec-nr-api/mainnet/noir_aztec/messages/processing/offchain/fn.receive.html"

[[redirects]]
    # PXE: incompatible oracle version between contract and PXE
    from = "/errors/8"
    to = "/developers/docs/foundational-topics/pxe#oracle-versioning"

[[redirects]]
    # CLI: aztec dep version in Nargo.toml does not match the CLI version
    from = "/errors/9"
    to = "/developers/docs/aztec-nr/framework-description/dependencies#updating-your-aztec-dependencies"

[[redirects]]
    # PXE: capsule operation attempted with a scope not in the allowed scopes list
    from = "/errors/10"
    to = "/developers/docs/aztec-nr/framework-description/advanced/how_to_use_capsules"

[[redirects]]
    # PXE: cross-contract utility call denied by execution hook
    from = "/errors/11"
    to = "/developers/docs/aztec-nr/framework-description/calling_contracts#cross-contract-authorization"

[[redirects]]
    # Incompatible oracle version between test and test environment
    from = "/errors/12"
    to = "/developers/docs/aztec-nr/testing_contracts#test-environment-oracle-versioning"

[[redirects]]
    # Unexpected error: how to report issues
    from = "/errors/13"
    to = "/developers/docs/aztec-nr/debugging#reporting-issues"

[[redirects]]
    # Aztec-nr: contract errors
    from = "/errors/14"
    to = "/developers/docs/aztec-nr/debugging#contract-errors"

[[redirects]]
    # Aztec-nr: auto-generated note properties require the derived Packable layout
    from = "/errors/15"
    to = "/aztec-nr-api/mainnet/noir_aztec/note/note_interface/trait.NoteProperties.html"
