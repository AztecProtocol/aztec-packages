# =============================================================================
# BUILD CONFIGURATION
# =============================================================================
[build]
  # Only build if docs-related files changed (docs/, aztec-nr/, or #include_code references)
  ignore = "./scripts/netlify-ignore-build.sh"
  command = "yarn build"
  functions = "netlify/functions"

# Install nargo only for preview deploys (not needed for production)
[context.deploy-preview]
  command = "./scripts/netlify-preview-build.sh"

[context.branch-deploy]
  command = "./scripts/netlify-preview-build.sh"

