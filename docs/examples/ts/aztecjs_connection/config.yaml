# Configuration for aztecjs_connection example
# Demonstrates connecting to network, creating wallets, and basic operations

# No custom contracts needed - using pre-built contracts from @aztec-labs/noir-contracts.js
contracts: []

# Dependencies:
#   - @aztec-labs/* packages are auto-linked from yarn-project/
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec-labs/aztec.js"
  - "@aztec-labs/accounts"
  - "@aztec-labs/wallets"
  - "@aztec-labs/noir-contracts.js"
  - "@aztec-labs/stdlib"
  - "@aztec-labs/ethereum"
