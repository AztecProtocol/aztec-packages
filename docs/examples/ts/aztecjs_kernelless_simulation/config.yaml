# Configuration for aztecjs_kernelless_simulation example
# Demonstrates kernelless simulation with stub account overrides:
# - Calling .simulate() on a view function without signing prompts
# - Harvesting CallAuthorizationRequest offchain effects to build authwits

# No custom contracts needed - using pre-built contracts from @aztec-labs/noir-contracts.js
contracts: []

# Dependencies:
#   - @aztec-labs/* packages are auto-linked from yarn-project/
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec-labs/aztec.js"
  - "@aztec-labs/accounts"
  - "@aztec-labs/wallets"
  - "@aztec-labs/noir-contracts.js"
