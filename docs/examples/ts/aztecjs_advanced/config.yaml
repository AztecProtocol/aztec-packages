# Configuration for aztecjs_advanced example
# Demonstrates advanced patterns: BatchCall, NO_WAIT, L1 bridge, contract reconstruction

# No custom contracts needed - using pre-built contracts from @aztec/noir-contracts.js
contracts: []

# Dependencies:
#   - @aztec/* packages are auto-linked from yarn-project/
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec/aztec.js"
  - "@aztec/accounts"
  - "@aztec/test-wallet"
  - "@aztec/noir-contracts.js"
  - "@aztec/ethereum"
  - "@aztec/stdlib"
