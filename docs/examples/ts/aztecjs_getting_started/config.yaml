# Configuration for aztecjs_getting_started example
# This tutorial uses pre-built TokenContract from @aztec/noir-contracts.js

# No custom contracts needed - using pre-built contracts from @aztec/noir-contracts.js
contracts: []

# Dependencies:
#   - @aztec/* packages are auto-linked from yarn-project/
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec/aztec.js"
  - "@aztec/accounts"
  - "@aztec/wallets"
  - "@aztec/noir-contracts.js"
