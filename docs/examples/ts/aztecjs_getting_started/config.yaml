# Configuration for aztecjs_getting_started example
# This tutorial uses pre-built TokenContract from @aztec-labs/noir-contracts.js

# No custom contracts needed - using pre-built contracts from @aztec-labs/noir-contracts.js
contracts: []

# Dependencies:
#   - @aztec-labs/* packages are auto-linked from yarn-project/
#   - Use npm:package-name for external npm packages
dependencies:
  - "@aztec-labs/aztec.js"
  - "@aztec-labs/accounts"
  - "@aztec-labs/wallets"
  - "@aztec-labs/noir-contracts.js"
