services:
  fork:
    image: aztecprotocol/build:3.2
    cpus: 1
    cpuset: ${CPU_LIST:-}
    mem_limit: 2G
    entrypoint: 'anvil --silent -p 8545 --host 0.0.0.0 --chain-id 31337'

  local-network:
    image: aztecprotocol/build:3.2
    cpus: 4
    cpuset: ${CPU_LIST:-}
    mem_limit: 8G
    stop_grace_period: 60s
    volumes:
      - ../../../:/root/aztec-node
      - ${HOME}/.bb-crs:/root/.bb-crs
    # The pinned CLI that docs/scripts/aztec_node.mts provisions into docs/.aztec-node/cli.
    working_dir: /root/aztec-node/docs/.aztec-node/cli/node_modules/@aztec-labs/aztec
    command: 'node ./dest/bin/index.js start --local-network'
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-verbose}
      ETHEREUM_HOSTS: http://fork:8545
      L1_CHAIN_ID: 31337
      FORCE_COLOR: ${FORCE_COLOR:-1}
      ARCHIVER_POLLING_INTERVAL_MS: 500
      P2P_BLOCK_CHECK_INTERVAL_MS: 500
      SEQ_POLLING_INTERVAL_MS: 500
      WS_BLOCK_CHECK_INTERVAL_MS: 500
      ARCHIVER_VIEM_POLLING_INTERVAL_MS: 500
      P2P_MIN_TX_POOL_AGE_MS: 0
      HARDWARE_CONCURRENCY: ${HARDWARE_CONCURRENCY:-}

  # The runner writes into the mounted checkout, so it runs as the checkout's owner: a killed run
  # leaves nothing the owner cannot remove. /root is closed to that user, hence the mount point,
  # a HOME inside the container and CRS_PATH, which bb.js reads instead of ~/.bb-crs.
  docs-examples:
    image: aztecprotocol/build:3.2
    user: ${DOCS_UID:?}:${DOCS_GID:?}
    cpus: 4
    cpuset: ${CPU_LIST:-}
    mem_limit: 8G
    volumes:
      - ../../../:/aztec-node
      - ${HOME}/.bb-crs:/bb-crs
    working_dir: /aztec-node/docs/examples/ts/aztecjs_runner
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-verbose}
      FORCE_COLOR: ${FORCE_COLOR:-1}
      AZTEC_NODE_URL: http://local-network:8080
      ETHEREUM_HOST: http://fork:8545
      AZTEC_VERSION: ${AZTEC_VERSION:?}
      BB_VERSION: ${BB_VERSION:?}
      HOME: /tmp/home
      CRS_PATH: /bb-crs
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      DOCS_EXAMPLES_HALF: ${DOCS_EXAMPLES_HALF:-}
    entrypoint: >
      bash -c '
        mkdir -p "$$HOME";
        while ! nc -z local-network 8080; do sleep 1; done;
        ./run.sh $${DOCS_EXAMPLES_HALF:+--half "$$DOCS_EXAMPLES_HALF"}
      '
    depends_on:
      - local-network
      - fork
