# Configuration for aztecjs_runner - runs all aztec.js example snippets
# This project executes the examples against a live local network

# No custom contracts needed - using pre-built contracts from @aztec/noir-contracts.js
contracts: []

# Dependencies - union of all aztecjs example dependencies
dependencies:
  - "@aztec/aztec.js"
  - "@aztec/accounts"
  - "@aztec/wallets"
  - "@aztec/noir-contracts.js"
  - "@aztec/ethereum"
  - "@aztec/stdlib"
  - "@aztec/foundation"
