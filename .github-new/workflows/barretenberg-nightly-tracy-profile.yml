name: Nightly Tracy Profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-tracy-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracy-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: next

      - name: Run Tracy profile
        timeout-minutes: 120
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ./.github/ci3.sh barretenberg-tracy-profile

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export CI=1
          ./ci3/slack_notify_with_claudebox_kickoff "#honk-team" \
            "Nightly Tracy profile FAILED: <${RUN_URL}|View Run> (🤖)" \
            "Nightly barretenberg Tracy profile failed. CI run: ${RUN_URL}. Investigate the build failure, identify the root cause, and create a fix PR targeting next." \
            --link "$RUN_URL"
