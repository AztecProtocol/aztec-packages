name: Network Healthcheck

on:
  schedule:
    # 8:00 AM UTC daily (adjust if team is in a different timezone)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      networks:
        description: 'Comma-separated list of networks to check (default: all)'
        required: false
        type: string
        default: 'v4-devnet-2,testnet,mainnet,staging-public,next-net'

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run ClaudeBox healthcheck
        timeout-minutes: 30
        env:
          CLAUDEBOX_URL: ${{ vars.CLAUDEBOX_URL }}
          CLAUDEBOX_API_SECRET: ${{ secrets.CLAUDEBOX_API_SECRET }}
          NETWORKS: ${{ inputs.networks || 'v4-devnet-2,testnet,mainnet,staging-public,next-net' }}
        run: |
          AUTH="Authorization: Bearer ${CLAUDEBOX_API_SECRET}"

          PROMPT="Run a network healthcheck for: ${NETWORKS}.

          For each network, query Cloud Logging to report:
          1. Components running
          2. Latest L2 block and slot numbers
          3. Peer counts
          4. Block production cadence (last ~10 checkpoints)
          5. Any errors (level >= 50) or warnings (level 40) in the last 8 hours
          6. Bot status if applicable

          Create a gist with the full healthcheck report. Then post a concise summary to the #general channel via respond_to_user. Flag anything that needs attention (stopped bots, missed slots, errors, low peer counts).

          Format the respond_to_user message as a brief network status overview, e.g.:
          - testnet: healthy, block 5570, 100 peers
          - mainnet: healthy, block 1234, 50 peers
          - devnet: WARNING - bot stopped (insufficient balance)
          Link to the gist for full details."

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg user "scheduled-healthcheck" \
            --arg repo "AztecProtocol/aztec-packages" \
            --arg slack_channel "C04BTJAA694" \
            '{prompt: $prompt, user: $user, repo: $repo, slack_channel: $slack_channel}')

          echo "Starting healthcheck session..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "${CLAUDEBOX_URL}/run")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 400 ] 2>/dev/null; then
            echo "ClaudeBox returned HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          LOG_URL=$(echo "$BODY" | jq -r '.log_url // empty')
          SESSION_ID=$(basename "$LOG_URL")
          echo "Session started: $LOG_URL"

          # Poll until completed
          while true; do
            sleep 30
            STATUS_BODY=$(curl -sS -H "$AUTH" "${CLAUDEBOX_URL}/session/${SESSION_ID}" 2>/dev/null || echo '{}')
            STATUS=$(echo "$STATUS_BODY" | jq -r '.status // "unknown"')
            echo "$(date -u +%H:%M:%S) status=$STATUS"
            if [ "$STATUS" != "running" ]; then
              EXIT_CODE=$(echo "$STATUS_BODY" | jq -r '.exit_code // 1')
              echo "Session finished: status=$STATUS exit_code=$EXIT_CODE"
              echo "Log: $LOG_URL"
              exit "$EXIT_CODE"
            fi
          done
