name: Nightly Release Tag
on:
  schedule:
    # Run the workflow every night at 2:00 AM UTC.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

# Add permissions for the GitHub Actions bot to push tags
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  nightly-release-tag:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository so we can read files and create tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          # Fetch all existing nightly tags so we can detect duplicates.
          fetch-depth: 0
          fetch-tags: true

      # Extract the current release version from the manifest.
      # Then, create a nightly tag using the current version and the current UTC date.
      # Skip if HEAD already has a nightly tag pointing at it (branch hasn't moved
      # since the last nightly run, so a new tag would just rebuild the same commit).
      - name: Create Nightly Tag
        run: |
          set -euo pipefail
          git config --global user.email "tech@aztecprotocol.com"
          git config --global user.name "AztecBot"

          head_sha=$(git rev-parse HEAD)
          existing_nightly=$(git tag --points-at "$head_sha" --list 'v*-nightly.*' | head -n1 || true)
          if [[ -n "$existing_nightly" ]]; then
            echo "HEAD ($head_sha) already tagged as $existing_nightly — branch has not moved since the previous nightly run. Skipping new tag."
            exit 0
          fi

          current_version=$(jq -r '."."' .release-please-manifest.json)
          echo "Current version: $current_version"
          nightly_tag="v${current_version}-nightly.$(date -u +%Y%m%d)"
          echo "Nightly tag: $nightly_tag (HEAD: $head_sha)"
          # Tag and push.
          git tag -a "$nightly_tag" -m "$nightly_tag"
          git push origin "$nightly_tag"
