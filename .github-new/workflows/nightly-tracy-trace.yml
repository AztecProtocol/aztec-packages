name: Nightly Tracy Trace

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tracy_preset:
        description: "Tracy preset (tracy-memory, tracy-time-instrumented, tracy-time-sampled, tracy-gates)"
        required: false
        default: "tracy-time-instrumented"

concurrency:
  group: nightly-tracy-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tracy-trace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: next

      - name: Capture Tracy trace
        timeout-minutes: 120
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TRACY_PRESET="${{ github.event.inputs.tracy_preset || 'tracy-time-instrumented' }}"
          ./.github/ci3.sh barretenberg-tracy-trace "$TRACY_PRESET"

      - name: Notify Slack on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export CI=1
          ./ci3/slack_notify_with_claudebox_kickoff "#honk-team" \
            "Nightly Tracy trace capture FAILED: <${RUN_URL}|View Run> (🤖)" \
            "Nightly Tracy trace capture failed. CI run: ${RUN_URL}. Investigate the failure." \
            --link "$RUN_URL"
