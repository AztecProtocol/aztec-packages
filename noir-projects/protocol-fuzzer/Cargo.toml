[package]
name = "aztec-protocol-fuzzer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arbitrary = "1.4.2"
arbtest = "0.2"
clap = { version = "4.5.47", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.29"
regex = "1.12.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serial_test = "3"
