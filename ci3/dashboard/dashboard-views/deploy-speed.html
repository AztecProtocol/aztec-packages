<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ACI - Deployment Speed</title>
  <style>
    body {
      background-color: black;
      color: #ccc;
      font-family: monospace;
      padding: 10px;
      font-size: 14px;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav a { color: #58a6ff; text-decoration: none; font-size: 13px; }
    .nav a:hover { text-decoration: underline; }
    .nav a.active { color: #fff; border-bottom: 1px solid #58a6ff; }
    .sep { color: #333; }
    .controls { margin: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls label { color: #888; }
    input, select {
      background: #111; border: 1px solid #333; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 8px;
    }
    input:focus, select:focus { outline: none; border-color: #58a6ff; }
    button {
      background: #222; border: 1px solid #444; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 12px; cursor: pointer;
    }
    button:hover { background: #333; }
    button.active { background: #238636; border-color: #238636; color: #fff; }
    .stats { margin: 12px 0; color: #888; }
    .stats span { color: #ccc; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .charts .full { grid-column: 1 / -1; }
    @media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
    .chart-box { background: #0a0a0a; border: 1px solid #222; padding: 12px; }
    .chart-box h3 { color: #888; font-size: 12px; font-weight: normal; text-transform: uppercase; margin-bottom: 8px; }
    .chart-wrap { position: relative; }
    .chart-wrap.tall { height: 350px; }
    .chart-wrap.med { height: 280px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; color: #888; white-space: nowrap; }
    td { padding: 6px 8px; border-bottom: 1px solid #111; }
    tr:hover td { background: #111; }
    .amt { font-variant-numeric: tabular-nums; text-align: right; }
    th.amt { text-align: right; }
    .msg { color: #888; padding: 8px 0; }
    .msg.err { color: #f85149; }
    .status-success { color: #3fb950; }
    .status-failure { color: #f85149; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">&lt; CI</a> <span class="sep">|</span>
    <a href="/cost-overview">cost overview</a>
    <a href="/namespace-billing">namespace billing</a>
    <a href="/ci-performance">ci performance</a>
    <a href="/deploy-speed" class="active">deploy speed</a>
    <a href="/branch-lag">branch lag</a>
    <a href="/pr-metrics">pr metrics</a>
    <a href="/runner-costs">runner costs</a>
  </div>

  <h2 style="margin:8px 0;color:#ccc;">deployment speed</h2>

  <div class="controls">
    <label>from</label> <input type="date" id="dateFrom" />
    <label>to</label> <input type="date" id="dateTo" />
    <span style="color:#333">|</span>
    <button data-g="daily" class="active">daily</button>
    <button data-g="weekly">weekly</button>
    <span style="color:#333">|</span>
    <label>workflow</label>
    <select id="workflowFilter"><option value="">all</option></select>
    <button id="refreshBtn">refresh</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="stats" id="stats"></div>

  <div class="charts">
    <div class="chart-box full">
      <h3>deploy duration over time</h3>
      <div class="chart-wrap tall"><canvas id="durationTimeline"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>deploy count by day</h3>
      <div class="chart-wrap med"><canvas id="countBar"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>duration by workflow</h3>
      <div class="chart-wrap med"><canvas id="workflowBar"></canvas></div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>date</th>
        <th>workflow</th>
        <th>status</th>
        <th class="amt">duration</th>
        <th>ref</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
    let apiData = null;
    let charts = {};

    const GOAL_MINS = 20;

    const fmtDate = s => {
      const d = new Date(s + (s.includes('T') ? '' : 'T00:00:00'));
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };

    const fmtDuration = mins => {
      if (mins < 1) return (mins * 60).toFixed(0) + 's';
      if (mins < 60) return mins.toFixed(1) + 'm';
      const h = Math.floor(mins / 60);
      const m = (mins % 60).toFixed(0);
      return h + 'h ' + m + 'm';
    };

    const fmtDatetime = s => {
      const d = new Date(s);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    };

    function granularity() {
      return document.querySelector('[data-g].active').dataset.g;
    }

    // ---- goalLine plugin ----
    const goalLinePlugin = {
      id: 'goalLine',
      afterDraw(chart) {
        const meta = chart.options.plugins.goalLine;
        if (!meta || meta.value == null) return;
        const yScale = chart.scales.y;
        const ctx = chart.ctx;
        const yPixel = yScale.getPixelForValue(meta.value);
        if (yPixel < yScale.top || yPixel > yScale.bottom) return;
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = meta.color || '#888';
        ctx.lineWidth = meta.lineWidth || 1;
        ctx.moveTo(chart.chartArea.left, yPixel);
        ctx.lineTo(chart.chartArea.right, yPixel);
        ctx.stroke();
        // label
        ctx.fillStyle = meta.color || '#888';
        ctx.font = '10px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(meta.label || (meta.value + ''), chart.chartArea.right, yPixel - 4);
        ctx.restore();
      }
    };
    Chart.register(goalLinePlugin);

    // ---- data ----
    async function load() {
      document.getElementById('msg').className = 'msg';
      document.getElementById('msg').textContent = 'loading...';
      try {
        const f = document.getElementById('dateFrom').value;
        const t = document.getElementById('dateTo').value;
        const g = granularity();
        const wf = document.getElementById('workflowFilter').value;
        const url = `/api/deployments/speed?from=${f}&to=${t}&granularity=${g}&workflow=${encodeURIComponent(wf)}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        apiData = await resp.json();

        populateWorkflowFilter();
        render();
        document.getElementById('msg').textContent = '';

        if (!apiData.by_date || !apiData.by_date.length) {
          document.getElementById('msg').textContent = 'no deployment data for this period.';
        }
      } catch (e) {
        document.getElementById('msg').className = 'msg err';
        document.getElementById('msg').textContent = 'error: ' + e.message;
      }
    }

    function populateWorkflowFilter() {
      if (!apiData || !apiData.recent) return;
      const sel = document.getElementById('workflowFilter');
      const cur = sel.value;
      const workflows = [...new Set(apiData.recent.map(r => r.workflow_name))].sort();
      sel.innerHTML = '<option value="">all</option>';
      workflows.forEach(w => {
        const o = document.createElement('option');
        o.value = w;
        o.textContent = w;
        sel.appendChild(o);
      });
      if (workflows.includes(cur) || cur === '') sel.value = cur;
    }

    // ---- render ----
    function render() {
      if (!apiData) return;
      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      const summary = apiData.summary || {};
      const byDate = apiData.by_date || [];
      const recent = apiData.recent || [];

      // stats
      document.getElementById('stats').innerHTML =
        `median: <span>${fmtDuration(summary.median_mins || 0)}</span> &middot; ` +
        `p95: <span>${fmtDuration(summary.p95_mins || 0)}</span> &middot; ` +
        `success rate: <span>${(summary.success_rate || 0).toFixed(1)}%</span> &middot; ` +
        `deploys: <span>${summary.total || 0}</span>`;

      // ---- chart 1: duration timeline ----
      const dates = byDate.map(d => d.date);
      charts.duration = new Chart(document.getElementById('durationTimeline').getContext('2d'), {
        type: 'line',
        data: {
          labels: dates.map(fmtDate),
          datasets: [
            {
              label: 'median',
              data: byDate.map(d => d.median_mins),
              borderColor: '#58a6ff',
              backgroundColor: 'rgba(88,166,255,0.1)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: '#58a6ff',
              tension: 0.3,
              fill: false
            },
            {
              label: 'p95',
              data: byDate.map(d => d.p95_mins),
              borderColor: '#f0883e',
              backgroundColor: 'rgba(240,136,62,0.1)',
              borderWidth: 2,
              borderDash: [6, 4],
              pointRadius: 3,
              pointBackgroundColor: '#f0883e',
              tension: 0.3,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: {
              ticks: { color: '#555', callback: v => v + 'm' },
              grid: { color: '#181818' },
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } }
            },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.raw.toFixed(1)}m`
              }
            },
            goalLine: {
              value: GOAL_MINS,
              color: '#555',
              lineWidth: 1,
              label: 'goal: ' + GOAL_MINS + 'm'
            }
          }
        }
      });

      // ---- chart 2: deploy count stacked bar ----
      charts.count = new Chart(document.getElementById('countBar').getContext('2d'), {
        type: 'bar',
        data: {
          labels: dates.map(fmtDate),
          datasets: [
            {
              label: 'success',
              data: byDate.map(d => d.success || 0),
              backgroundColor: '#3fb950',
              borderWidth: 0
            },
            {
              label: 'failure',
              data: byDate.map(d => d.failure || 0),
              backgroundColor: '#f85149',
              borderWidth: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { stacked: true, ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: { stacked: true, ticks: { color: '#555' }, grid: { color: '#181818' }, beginAtZero: true }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } }
            },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.raw}`,
                footer: items => `total: ${items.reduce((s, i) => s + i.raw, 0)}`
              }
            }
          }
        }
      });

      // ---- chart 3: duration by workflow (horizontal bar) ----
      const workflowMap = {};
      recent.forEach(r => {
        if (!workflowMap[r.workflow_name]) {
          workflowMap[r.workflow_name] = [];
        }
        workflowMap[r.workflow_name].push(r.duration_mins);
      });
      const workflowEntries = Object.entries(workflowMap)
        .map(([name, durations]) => ({
          name,
          median: durations.sort((a, b) => a - b)[Math.floor(durations.length / 2)]
        }))
        .sort((a, b) => b.median - a.median);

      const WF_COLORS = ['#58a6ff', '#3fb950', '#d2a8ff', '#f0883e', '#f85149',
        '#a5d6ff', '#56d364', '#bc8cff', '#db6d28', '#ff7b72'];

      charts.workflow = new Chart(document.getElementById('workflowBar').getContext('2d'), {
        type: 'bar',
        data: {
          labels: workflowEntries.map(e => e.name),
          datasets: [{
            label: 'median duration',
            data: workflowEntries.map(e => e.median),
            backgroundColor: workflowEntries.map((_, i) => WF_COLORS[i % WF_COLORS.length]),
            borderRadius: 2,
            barPercentage: 0.6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          scales: {
            x: { ticks: { color: '#555', callback: v => v + 'm' }, grid: { color: '#181818' }, beginAtZero: true },
            y: { ticks: { color: '#ccc', font: { family: 'monospace', size: 11 } }, grid: { display: false } }
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => c.raw.toFixed(1) + 'm' } },
            goalLine: {
              value: GOAL_MINS,
              color: '#555',
              lineWidth: 1,
              label: 'goal: ' + GOAL_MINS + 'm'
            }
          }
        }
      });

      // ---- table ----
      renderTable(recent);
      saveUrl();
    }

    // ---- table ----
    function renderTable(recent) {
      document.getElementById('tbody').innerHTML = recent.map(r => {
        const statusClass = r.status === 'success' ? 'status-success' : 'status-failure';
        return `<tr>
          <td>${fmtDatetime(r.started_at)}</td>
          <td>${r.workflow_name}</td>
          <td class="${statusClass}">${r.status}</td>
          <td class="amt">${fmtDuration(r.duration_mins)}</td>
          <td>${r.ref_name || '--'}</td>
        </tr>`;
      }).join('');
    }

    // ---- url state ----
    function saveUrl() {
      const p = new URLSearchParams();
      p.set('from', document.getElementById('dateFrom').value);
      p.set('to', document.getElementById('dateTo').value);
      p.set('g', granularity());
      const wf = document.getElementById('workflowFilter').value;
      if (wf) p.set('workflow', wf);
      history.replaceState({}, '', '?' + p);
    }

    function loadUrl() {
      const p = new URLSearchParams(location.search);
      if (p.get('from')) document.getElementById('dateFrom').value = p.get('from');
      if (p.get('to')) document.getElementById('dateTo').value = p.get('to');
      if (p.get('g')) {
        document.querySelectorAll('[data-g]').forEach(b =>
          b.classList.toggle('active', b.dataset.g === p.get('g'))
        );
      }
      return p.get('workflow') || '';
    }

    // ---- init ----
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date(), from = new Date();
      from.setDate(from.getDate() - 30);
      document.getElementById('dateFrom').value = from.toISOString().split('T')[0];
      document.getElementById('dateTo').value = now.toISOString().split('T')[0];

      const savedWf = loadUrl();

      document.getElementById('refreshBtn').onclick = load;
      document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
        document.querySelectorAll('[data-g]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        load();
      });
      document.getElementById('workflowFilter').onchange = load;
      document.getElementById('dateFrom').onchange = load;
      document.getElementById('dateTo').onchange = load;

      const origLoad = load;
      load = async () => {
        await origLoad();
        if (savedWf) {
          document.getElementById('workflowFilter').value = savedWf;
        }
        load = origLoad;
      };
      load();
    });
  </script>
</body>
</html>
