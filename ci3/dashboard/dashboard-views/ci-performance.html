<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ACI - CI Performance</title>
  <style>
    body {
      background-color: black;
      color: #ccc;
      font-family: monospace;
      padding: 10px;
      font-size: 14px;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav {
      padding: 8px 0;
      margin-bottom: 8px;
      border-bottom: 1px solid #222;
      font-size: 13px;
    }
    .nav a { margin-right: 10px; color: #888; }
    .nav a:hover { color: #ccc; }
    .nav a.active { color: #58a6ff; }
    .nav .sep { color: #333; margin-right: 10px; }
    .controls { margin: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls label { color: #888; }
    input, select {
      background: #111; border: 1px solid #333; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 8px;
    }
    input:focus, select:focus { outline: none; border-color: #58a6ff; }
    button {
      background: #222; border: 1px solid #444; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 12px; cursor: pointer;
    }
    button:hover { background: #333; }
    button.active { background: #238636; border-color: #238636; color: #fff; }
    .stats { margin: 12px 0; color: #888; }
    .stats span { color: #ccc; }
    .stats span.good { color: #3fb950; }
    .stats span.bad { color: #f85149; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .charts .full { grid-column: 1 / -1; }
    @media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
    .chart-box { background: #0a0a0a; border: 1px solid #222; padding: 12px; }
    .chart-box h3 { color: #888; font-size: 12px; font-weight: normal; text-transform: uppercase; margin-bottom: 8px; }
    .chart-wrap { position: relative; }
    .chart-wrap.tall { height: 350px; }
    .chart-wrap.med { height: 280px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; color: #888; cursor: pointer; white-space: nowrap; }
    th:hover { color: #ccc; }
    td { padding: 6px 8px; border-bottom: 1px solid #111; }
    tr:hover td { background: #111; }
    .amt { font-variant-numeric: tabular-nums; text-align: right; }
    th.amt { text-align: right; }
    .msg { color: #888; padding: 8px 0; }
    .msg.err { color: #f85149; }
    .status-passed { color: #3fb950; }
    .status-failed { color: #f85149; }
    .status-flaked { color: #f0883e; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">&lt; CI</a> <span class="sep">|</span>
    <a href="/cost-overview">cost overview</a>
    <a href="/namespace-billing">namespace billing</a>
    <a href="/ci-performance" class="active">ci performance</a>
    <a href="/deploy-speed">deploy speed</a>
    <a href="/branch-lag">branch lag</a>
    <a href="/pr-metrics">pr metrics</a>
    <a href="/runner-costs">runner costs</a>
  </div>

  <h2 style="margin:8px 0;color:#ccc;">ci performance</h2>

  <div class="controls">
    <label>from</label> <input type="date" id="dateFrom" />
    <label>to</label> <input type="date" id="dateTo" />
    <span style="color:#333">|</span>
    <button data-g="daily" class="active">daily</button>
    <button data-g="weekly">weekly</button>
    <span style="color:#333">|</span>
    <label>dashboard</label>
    <select id="dashFilter">
      <option value="all">all</option>
      <option value="next" selected>next</option>
      <option value="prs">prs</option>
      <option value="master">master</option>
      <option value="staging">staging</option>
    </select>
    <button id="refreshBtn">refresh</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="stats" id="stats"></div>

  <div class="charts">
    <div class="chart-box full">
      <h3>pass / flake / failure rates over time</h3>
      <div class="chart-wrap tall"><canvas id="ratesChart"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>daily run volume</h3>
      <div class="chart-wrap med"><canvas id="volumeChart"></canvas></div>
    </div>
    <div class="chart-box">
      <h3>top 10 flaky tests</h3>
      <div class="chart-wrap med"><canvas id="flakesChart"></canvas></div>
    </div>
  </div>

  <h3 style="color:#888;font-size:12px;font-weight:normal;text-transform:uppercase;margin-top:20px;">recent failures &amp; flakes</h3>
  <table>
    <thead id="thead">
      <tr>
        <th>test</th>
        <th>status</th>
        <th class="amt">count</th>
        <th>branch</th>
        <th class="amt">duration</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
    let apiData = null;
    let charts = {};

    const PASS_TARGET = 95;
    const FLAKE_TARGET = 3;

    // ---- goal line plugin ----
    const goalLinePlugin = {
      id: 'goalLine',
      afterDraw(chart) {
        const goals = chart.options.plugins.goalLine?.goals || [];
        const ctx = chart.ctx;
        const yAxis = chart.scales.y;
        goals.forEach(({ value, label, color }) => {
          const y = yAxis.getPixelForValue(value);
          ctx.save();
          ctx.strokeStyle = color || '#f0883e';
          ctx.setLineDash([5, 5]);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(chart.chartArea.left, y);
          ctx.lineTo(chart.chartArea.right, y);
          ctx.stroke();
          ctx.fillStyle = color || '#f0883e';
          ctx.font = '10px monospace';
          ctx.fillText(label || '', chart.chartArea.right + 4, y + 3);
          ctx.restore();
        });
      }
    };
    Chart.register(goalLinePlugin);

    // ---- helpers ----
    function granularity() { return document.querySelector('[data-g].active').dataset.g; }

    function fmtDate(s) {
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function truncate(s, len) {
      return s.length > len ? s.substring(0, len) + '...' : s;
    }

    // ---- load data ----
    async function load() {
      document.getElementById('msg').className = 'msg';
      document.getElementById('msg').textContent = 'loading...';
      try {
        const f = document.getElementById('dateFrom').value;
        const t = document.getElementById('dateTo').value;
        const dash = document.getElementById('dashFilter').value;
        const dashParam = dash === 'all' ? '' : dash;
        const url = `/api/ci/performance?from=${f}&to=${t}&granularity=${granularity()}` +
                    (dashParam ? `&dashboard=${dashParam}` : '');
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        apiData = await resp.json();
        render();
        document.getElementById('msg').textContent = '';
        if (!apiData.by_date || apiData.by_date.length === 0) {
          document.getElementById('msg').textContent = 'no data for selected range';
        }
      } catch (e) {
        document.getElementById('msg').className = 'msg err';
        document.getElementById('msg').textContent = 'error: ' + e.message;
      }
    }

    // ---- render ----
    function render() {
      if (!apiData) return;
      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      renderStats();
      renderRatesChart();
      renderVolumeChart();
      renderFlakesChart();
      renderTable();
      saveUrl();
    }

    function renderStats() {
      const s = apiData.summary || {};
      const passClass = (s.pass_rate || 0) >= PASS_TARGET ? 'good' : 'bad';
      const flakeClass = (s.flake_rate || 0) <= FLAKE_TARGET ? 'good' : 'bad';
      const failClass = (s.failure_rate || 0) <= (100 - PASS_TARGET) ? 'good' : 'bad';

      document.getElementById('stats').innerHTML =
        `pass rate: <span class="${passClass}">${(s.pass_rate || 0).toFixed(1)}%</span> &middot; ` +
        `flake rate: <span class="${flakeClass}">${(s.flake_rate || 0).toFixed(1)}%</span> &middot; ` +
        `failure rate: <span class="${failClass}">${(s.failure_rate || 0).toFixed(1)}%</span> &middot; ` +
        `avg duration: <span>${Math.round(s.avg_duration_mins || 0)}m</span> &middot; ` +
        `p95: <span>${Math.round(s.p95_duration_mins || 0)}m</span> &middot; ` +
        `total runs: <span>${s.total_runs || 0}</span>`;
    }

    function renderRatesChart() {
      const byDate = apiData.by_date || [];
      const labels = byDate.map(d => fmtDate(d.date));

      charts.rates = new Chart(document.getElementById('ratesChart').getContext('2d'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'pass rate',
              data: byDate.map(d => d.pass_rate),
              borderColor: '#3fb950',
              backgroundColor: 'rgba(63,185,80,0.1)',
              borderWidth: 2,
              pointRadius: 2,
              tension: 0.3,
              fill: false
            },
            {
              label: 'flake rate',
              data: byDate.map(d => d.flake_rate),
              borderColor: '#f0883e',
              backgroundColor: 'rgba(240,136,62,0.1)',
              borderWidth: 2,
              pointRadius: 2,
              tension: 0.3,
              fill: false
            },
            {
              label: 'failure rate',
              data: byDate.map(d => d.failure_rate),
              borderColor: '#f85149',
              backgroundColor: 'rgba(248,81,73,0.1)',
              borderWidth: 2,
              pointRadius: 2,
              tension: 0.3,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: {
              min: 0, max: 100,
              ticks: { color: '#555', callback: v => v + '%' },
              grid: { color: '#181818' }
            }
          },
          plugins: {
            legend: { position: 'bottom', labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } } },
            tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.raw.toFixed(1)}%` } },
            goalLine: {
              goals: [
                { value: PASS_TARGET, label: `${PASS_TARGET}% pass goal`, color: '#3fb950' },
                { value: FLAKE_TARGET, label: `${FLAKE_TARGET}% flake goal`, color: '#f0883e' }
              ]
            }
          }
        }
      });
    }

    function renderVolumeChart() {
      const byDate = apiData.by_date || [];
      const labels = byDate.map(d => fmtDate(d.date));

      charts.volume = new Chart(document.getElementById('volumeChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'passed',
              data: byDate.map(d => d.passed),
              backgroundColor: '#3fb950',
              borderWidth: 0
            },
            {
              label: 'failed',
              data: byDate.map(d => d.failed),
              backgroundColor: '#f85149',
              borderWidth: 0
            },
            {
              label: 'flaked',
              data: byDate.map(d => d.flaked),
              backgroundColor: '#f0883e',
              borderWidth: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { stacked: true, ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: { stacked: true, ticks: { color: '#555' }, grid: { color: '#181818' } }
          },
          plugins: {
            legend: { position: 'bottom', labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } } },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.raw}`,
                footer: items => `total: ${items.reduce((s, i) => s + i.raw, 0)}`
              }
            }
          }
        }
      });
    }

    function renderFlakesChart() {
      const flakes = (apiData.top_flakes || []).slice(0, 10);
      const labels = flakes.map(f => truncate(f.test_cmd, 40));
      const counts = flakes.map(f => f.count);

      charts.flakes = new Chart(document.getElementById('flakesChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'flake count',
            data: counts,
            backgroundColor: '#f0883e',
            borderRadius: 2,
            barPercentage: 0.6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          indexAxis: 'y',
          scales: {
            x: { ticks: { color: '#555' }, grid: { color: '#181818' } },
            y: { ticks: { color: '#ccc', font: { family: 'monospace', size: 10 } }, grid: { display: false } }
          },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => `${c.raw} flakes` } }
          }
        }
      });
    }

    function renderTable() {
      const failures = apiData.top_failures || [];
      const flakes = apiData.top_flakes || [];

      // Merge flakes and failures into a single table
      const rows = [];
      flakes.forEach(f => {
        rows.push({
          test: f.test_cmd,
          status: 'flaked',
          count: f.count,
          branch: f.ref_name || '--',
          duration: '--'
        });
      });
      failures.forEach(f => {
        rows.push({
          test: f.test_cmd,
          status: 'failed',
          count: f.count,
          branch: f.ref_name || '--',
          duration: f.avg_duration_secs ? Math.round(f.avg_duration_secs / 60) + 'm' : '--'
        });
      });

      // Sort by count descending
      rows.sort((a, b) => b.count - a.count);

      const tbody = document.getElementById('tbody');
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#555;padding:12px 8px;">no failures or flakes in selected range</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(r =>
        `<tr>` +
        `<td>${escHtml(truncate(r.test, 60))}</td>` +
        `<td class="status-${r.status}">${r.status}</td>` +
        `<td class="amt">${r.count}</td>` +
        `<td>${escHtml(r.branch)}</td>` +
        `<td class="amt">${r.duration}</td>` +
        `</tr>`
      ).join('');
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ---- url state ----
    function saveUrl() {
      const p = new URLSearchParams();
      p.set('from', document.getElementById('dateFrom').value);
      p.set('to', document.getElementById('dateTo').value);
      p.set('g', granularity());
      const dash = document.getElementById('dashFilter').value;
      if (dash !== 'all') p.set('dashboard', dash);
      history.replaceState({}, '', '?' + p);
    }

    function loadUrl() {
      const p = new URLSearchParams(location.search);
      if (p.get('from')) document.getElementById('dateFrom').value = p.get('from');
      if (p.get('to')) document.getElementById('dateTo').value = p.get('to');
      if (p.get('g')) {
        document.querySelectorAll('[data-g]').forEach(b =>
          b.classList.toggle('active', b.dataset.g === p.get('g'))
        );
      }
      if (p.get('dashboard')) document.getElementById('dashFilter').value = p.get('dashboard');
    }

    // ---- init ----
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date(), from = new Date();
      from.setDate(from.getDate() - 30);
      document.getElementById('dateFrom').value = from.toISOString().split('T')[0];
      document.getElementById('dateTo').value = now.toISOString().split('T')[0];

      loadUrl();

      document.getElementById('refreshBtn').onclick = load;
      document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
        document.querySelectorAll('[data-g]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        load();
      });
      document.getElementById('dashFilter').onchange = load;
      document.getElementById('dateFrom').onchange = load;
      document.getElementById('dateTo').onchange = load;

      load();
    });
  </script>
</body>
</html>
