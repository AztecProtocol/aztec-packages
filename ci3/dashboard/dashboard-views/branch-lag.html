<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ACI - Branch Lag</title>
  <style>
    body {
      background-color: black;
      color: #ccc;
      font-family: monospace;
      padding: 10px;
      font-size: 14px;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .nav a { color: #58a6ff; text-decoration: none; font-size: 13px; }
    .nav a:hover { text-decoration: underline; }
    .nav a.active { color: #fff; border-bottom: 1px solid #58a6ff; }
    .sep { color: #333; }
    .controls { margin: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .controls label { color: #888; }
    input, select {
      background: #111; border: 1px solid #333; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 8px;
    }
    input:focus, select:focus { outline: none; border-color: #58a6ff; }
    button {
      background: #222; border: 1px solid #444; color: #ccc;
      font-family: monospace; font-size: 13px; padding: 4px 12px; cursor: pointer;
    }
    button:hover { background: #333; }
    button.active { background: #238636; border-color: #238636; color: #fff; }
    .stats { margin: 12px 0; color: #888; }
    .stats span { color: #ccc; }
    .stats .green { color: #3fb950; }
    .stats .yellow { color: #d29922; }
    .stats .red { color: #f85149; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
    .charts .full { grid-column: 1 / -1; }
    @media (max-width: 1000px) { .charts { grid-template-columns: 1fr; } }
    .chart-box { background: #0a0a0a; border: 1px solid #222; padding: 12px; }
    .chart-box h3 { color: #888; font-size: 12px; font-weight: normal; text-transform: uppercase; margin-bottom: 8px; }
    .chart-wrap { position: relative; }
    .chart-wrap.tall { height: 350px; }
    .chart-wrap.med { height: 280px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #333; color: #888; cursor: pointer; white-space: nowrap; }
    th:hover { color: #ccc; }
    td { padding: 6px 8px; border-bottom: 1px solid #111; }
    tr:hover td { background: #111; }
    .amt { font-variant-numeric: tabular-nums; text-align: right; }
    th.amt { text-align: right; }
    .msg { color: #888; padding: 8px 0; }
    .msg.err { color: #f85149; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">&lt; CI</a> <span class="sep">|</span>
    <a href="/cost-overview">cost overview</a>
    <a href="/namespace-billing">namespace billing</a>
    <a href="/ci-performance">ci performance</a>
    <a href="/deploy-speed">deploy speed</a>
    <a href="/branch-lag" class="active">branch lag</a>
    <a href="/pr-metrics">pr metrics</a>
    <a href="/runner-costs">runner costs</a>
  </div>

  <h2 style="margin:8px 0;color:#ccc;">branch lag</h2>

  <div class="controls">
    <label>from</label> <input type="date" id="dateFrom" />
    <label>to</label> <input type="date" id="dateTo" />
    <span style="color:#333">|</span>
    <button id="refreshBtn">refresh</button>
  </div>

  <div id="msg" class="msg"></div>

  <div class="stats" id="stats"></div>

  <div class="charts">
    <div class="chart-box full">
      <h3>days behind over time</h3>
      <div class="chart-wrap tall"><canvas id="daysChart"></canvas></div>
    </div>
    <div class="chart-box full">
      <h3>commits behind over time</h3>
      <div class="chart-wrap tall"><canvas id="commitsChart"></canvas></div>
    </div>
  </div>

  <table>
    <thead id="thead"><tr></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
    Chart.defaults.color = '#888';
    Chart.defaults.font.family = 'monospace';

    let apiData = null;
    let charts = {};
    let sort = { col: 'date', dir: 'desc' };

    const PAIR_COLORS = {
      'next->staging-public': '#58a6ff',
      'next->testnet': '#f85149',
      'staging-public->testnet': '#3fb950'
    };

    const GOAL_LINES = {
      'next->staging-public': 3,
      'next->testnet': 7,
      'staging-public->testnet': null
    };

    function pairKey(p) { return p.source + '->' + p.target; }
    function pairLabel(p) { return p.source + ' \u2192 ' + p.target; }

    function lagColor(days) {
      if (days < 2) return 'green';
      if (days <= 5) return 'yellow';
      return 'red';
    }

    function lagColorHex(days) {
      if (days < 2) return '#3fb950';
      if (days <= 5) return '#d29922';
      return '#f85149';
    }

    const fmtDate = s => {
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };

    // ---- goalLine plugin ----
    const goalLinePlugin = {
      id: 'goalLine',
      afterDraw(chart) {
        const goals = chart.options.plugins.goalLine;
        if (!goals || !goals.lines) return;
        const { ctx, chartArea: { left, right }, scales: { y } } = chart;
        goals.lines.forEach(goal => {
          if (goal.value == null) return;
          const yPos = y.getPixelForValue(goal.value);
          if (yPos < chart.chartArea.top || yPos > chart.chartArea.bottom) return;
          ctx.save();
          ctx.beginPath();
          ctx.setLineDash([6, 4]);
          ctx.lineWidth = 1;
          ctx.strokeStyle = goal.color || '#555';
          ctx.moveTo(left, yPos);
          ctx.lineTo(right, yPos);
          ctx.stroke();
          ctx.fillStyle = goal.color || '#555';
          ctx.font = '10px monospace';
          ctx.textAlign = 'right';
          ctx.fillText(goal.label || '', right - 4, yPos - 4);
          ctx.restore();
        });
      }
    };
    Chart.register(goalLinePlugin);

    // ---- data ----
    async function load() {
      document.getElementById('msg').className = 'msg';
      document.getElementById('msg').textContent = 'loading...';
      try {
        const f = document.getElementById('dateFrom').value;
        const t = document.getElementById('dateTo').value;
        const resp = await fetch(`/api/branches/lag?from=${f}&to=${t}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        apiData = await resp.json();

        if (!apiData.pairs || !apiData.pairs.length) {
          document.getElementById('msg').textContent = 'no data available';
          document.getElementById('stats').innerHTML = '';
          document.getElementById('tbody').innerHTML = '';
          Object.values(charts).forEach(c => c.destroy());
          charts = {};
          return;
        }

        document.getElementById('msg').textContent = '';
        buildHeader();
        render();
      } catch (e) {
        document.getElementById('msg').className = 'msg err';
        document.getElementById('msg').textContent = 'error: ' + e.message;
      }
    }

    // ---- render ----
    function render() {
      Object.values(charts).forEach(c => c.destroy());
      charts = {};

      const pairs = apiData.pairs;

      // stats
      const parts = pairs.map(p => {
        const cls = lagColor(p.current.days_behind);
        return `<span class="${cls}">${pairLabel(p)}: ${p.current.days_behind.toFixed(1)} days (${p.current.commits_behind} commits)</span>`;
      });
      document.getElementById('stats').innerHTML = parts.join(' &middot; ');

      // collect all dates from history across all pairs
      const allDates = [...new Set(pairs.flatMap(p => (p.history || []).map(h => h.date)))].sort();

      // ---- days behind line chart ----
      const daysDatasets = pairs.map(p => {
        const key = pairKey(p);
        const histMap = {};
        (p.history || []).forEach(h => { histMap[h.date] = h.days_behind; });
        return {
          label: pairLabel(p),
          data: allDates.map(d => histMap[d] != null ? histMap[d] : null),
          borderColor: PAIR_COLORS[key] || '#888',
          backgroundColor: PAIR_COLORS[key] || '#888',
          borderWidth: 2,
          pointRadius: 2,
          pointHoverRadius: 4,
          tension: 0.3,
          fill: false,
          spanGaps: true
        };
      });

      const goalLines = [];
      pairs.forEach(p => {
        const key = pairKey(p);
        const goal = GOAL_LINES[key];
        if (goal != null) {
          goalLines.push({
            value: goal,
            color: PAIR_COLORS[key] || '#555',
            label: `${goal}d goal (${p.target})`
          });
        }
      });

      charts.days = new Chart(document.getElementById('daysChart').getContext('2d'), {
        type: 'line',
        data: { labels: allDates.map(fmtDate), datasets: daysDatasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: {
              beginAtZero: true,
              ticks: { color: '#555', callback: v => v + 'd' },
              grid: { color: '#181818' }
            }
          },
          plugins: {
            legend: { position: 'bottom', labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } } },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.raw != null ? c.raw.toFixed(1) + ' days' : 'n/a'}`
              }
            },
            goalLine: { lines: goalLines }
          }
        }
      });

      // ---- commits behind stacked area chart ----
      const commitsDatasets = pairs.map(p => {
        const key = pairKey(p);
        const histMap = {};
        (p.history || []).forEach(h => { histMap[h.date] = h.commits_behind; });
        return {
          label: pairLabel(p),
          data: allDates.map(d => histMap[d] != null ? histMap[d] : null),
          borderColor: PAIR_COLORS[key] || '#888',
          backgroundColor: (PAIR_COLORS[key] || '#888') + '33',
          borderWidth: 2,
          pointRadius: 0,
          pointHoverRadius: 4,
          tension: 0.3,
          fill: true,
          spanGaps: true
        };
      });

      charts.commits = new Chart(document.getElementById('commitsChart').getContext('2d'), {
        type: 'line',
        data: { labels: allDates.map(fmtDate), datasets: commitsDatasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { ticks: { color: '#555', maxRotation: 45 }, grid: { color: '#181818' } },
            y: {
              stacked: true,
              beginAtZero: true,
              ticks: { color: '#555' },
              grid: { color: '#181818' }
            }
          },
          plugins: {
            legend: { position: 'bottom', labels: { color: '#888', boxWidth: 10, padding: 8, font: { size: 10, family: 'monospace' } } },
            tooltip: {
              callbacks: {
                label: c => `${c.dataset.label}: ${c.raw != null ? c.raw + ' commits' : 'n/a'}`,
                footer: items => {
                  const total = items.reduce((s, i) => s + (i.raw || 0), 0);
                  return `total: ${total} commits`;
                }
              }
            }
          }
        }
      });

      renderTable();
      saveUrl();
    }

    // ---- table ----
    function buildHeader() {
      const tr = document.querySelector('#thead tr');
      tr.innerHTML = '';
      const cols = [
        { k: 'date', l: 'Date' },
        { k: 'next_staging_days', l: 'next\u2192staging (days)' },
        { k: 'next_staging_commits', l: 'next\u2192staging (commits)' },
        { k: 'next_testnet_days', l: 'next\u2192testnet (days)' },
        { k: 'next_testnet_commits', l: 'next\u2192testnet (commits)' },
        { k: 'staging_testnet_days', l: 'staging\u2192testnet (days)' },
        { k: 'staging_testnet_commits', l: 'staging\u2192testnet (commits)' }
      ];
      cols.forEach(col => {
        const th = document.createElement('th');
        th.dataset.sort = col.k;
        if (col.k !== 'date') th.className = 'amt';
        th.textContent = col.l;
        th.onclick = () => {
          sort = sort.col === col.k
            ? { col: col.k, dir: sort.dir === 'asc' ? 'desc' : 'asc' }
            : { col: col.k, dir: 'desc' };
          renderTable();
        };
        tr.appendChild(th);
      });
    }

    function renderTable() {
      if (!apiData || !apiData.pairs) return;

      const pairs = apiData.pairs;
      const pairMap = {};
      pairs.forEach(p => { pairMap[pairKey(p)] = p; });

      // collect all dates
      const allDates = [...new Set(pairs.flatMap(p => (p.history || []).map(h => h.date)))].sort();

      // build history maps
      const histMaps = {};
      pairs.forEach(p => {
        const key = pairKey(p);
        histMaps[key] = {};
        (p.history || []).forEach(h => { histMaps[key][h.date] = h; });
      });

      const rows = allDates.map(date => {
        const ns = histMaps['next->staging-public'] && histMaps['next->staging-public'][date];
        const nt = histMaps['next->testnet'] && histMaps['next->testnet'][date];
        const st = histMaps['staging-public->testnet'] && histMaps['staging-public->testnet'][date];
        return {
          date,
          next_staging_days: ns ? ns.days_behind : null,
          next_staging_commits: ns ? ns.commits_behind : null,
          next_testnet_days: nt ? nt.days_behind : null,
          next_testnet_commits: nt ? nt.commits_behind : null,
          staging_testnet_days: st ? st.days_behind : null,
          staging_testnet_commits: st ? st.commits_behind : null
        };
      });

      rows.sort((a, b) => {
        const av = a[sort.col];
        const bv = b[sort.col];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === 'string') return sort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        return sort.dir === 'asc' ? av - bv : bv - av;
      });

      function fmtDays(v) {
        if (v == null) return '<td class="amt" style="color:#555">-</td>';
        return `<td class="amt" style="color:${lagColorHex(v)}">${v.toFixed(1)}d</td>`;
      }
      function fmtCommits(v) {
        if (v == null) return '<td class="amt" style="color:#555">-</td>';
        return `<td class="amt">${v}</td>`;
      }

      document.getElementById('tbody').innerHTML = rows.map(r =>
        `<tr>` +
        `<td>${fmtDate(r.date)}</td>` +
        fmtDays(r.next_staging_days) +
        fmtCommits(r.next_staging_commits) +
        fmtDays(r.next_testnet_days) +
        fmtCommits(r.next_testnet_commits) +
        fmtDays(r.staging_testnet_days) +
        fmtCommits(r.staging_testnet_commits) +
        `</tr>`
      ).join('');
    }

    // ---- url state ----
    function saveUrl() {
      const p = new URLSearchParams();
      p.set('from', document.getElementById('dateFrom').value);
      p.set('to', document.getElementById('dateTo').value);
      history.replaceState({}, '', '?' + p);
    }

    function loadUrl() {
      const p = new URLSearchParams(location.search);
      if (p.get('from')) document.getElementById('dateFrom').value = p.get('from');
      if (p.get('to')) document.getElementById('dateTo').value = p.get('to');
    }

    // ---- init ----
    window.addEventListener('DOMContentLoaded', () => {
      const now = new Date(), from = new Date();
      from.setDate(from.getDate() - 30);
      document.getElementById('dateFrom').value = from.toISOString().split('T')[0];
      document.getElementById('dateTo').value = now.toISOString().split('T')[0];

      loadUrl();

      document.getElementById('refreshBtn').onclick = load;
      document.getElementById('dateFrom').onchange = load;
      document.getElementById('dateTo').onchange = load;

      load();
    });
  </script>
</body>
</html>
