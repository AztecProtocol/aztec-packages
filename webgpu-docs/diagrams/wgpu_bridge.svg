,6 Z" fill="#34d399"/></marker><marker id="ah5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker><marker id="ahs5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker></defs><rect x="0" y="0" width="1240" height="700" fill="#0b0e14"/><rect x="1" y="1" width="1238" height="698" rx="16" fill="none" stroke="#212a39"/><text x="34" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6e9ef">The C++ ↔ GPU bridge — exact data movement across two threads</text><text x="34" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa4b2">The worker marshals a request into shared memory and parks; the main thread runs the GPU and writes results back. Amber = scalars in · green = results out · grey = control.</text><rect x="32" y="78" width="306" height="590" rx="14" fill="#271e10" fill-opacity="0.32" stroke="#f5b544"/><text x="48" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#f5b544">WEB WORKER — WASM PROVER · BLOCKS</text><rect x="467" y="78" width="306" height="590" rx="14" fill="#12161f" fill-opacity="0.32" stroke="#5a6683" stroke-dasharray="6 5"/><text x="483" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5a6683">SHARED MEMORY — SHAREDARRAYBUFFER</text><rect x="902" y="78" width="306" height="590" rx="14" fill="#0e1c30" fill-opacity="0.32" stroke="#4b9fff"/><text x="918" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#4b9fff">MAIN THREAD — OWNS GPUDEVICE</text><rect x="50" y="128" width="270" height="92" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M53,137 a6,6 0 0 1 5,-6 v86 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="66" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">webgpu_msm_hook.cpp</text><text x="66" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">marshal scalars → LE canonical</text><text x="66" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">opcode · ptrs · srs_offset</text><rect x="50" y="306" width="270" height="74" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M53,315 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="66" y="331" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">worker_stub</text><text x="66" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">postMessage · Atomics.wait</text><text x="66" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">⏸ worker parks (UI stays live)</text><rect x="50" y="462" width="270" height="82" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M53,471 a6,6 0 0 1 5,-6 v76 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="66" y="487" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">combine_windows (native)</text><text x="66" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe U