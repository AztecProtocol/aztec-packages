', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle">6 · meta + DONE</text><path d="M485,452 L402.5,452 L402.5,500 L320,500" fill="none" stroke="#34d399" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah34d399)"/><rect x="327.01" y="480.5" width="149.98" height="19" rx="9" fill="#0b0e14" stroke="#212a39"/><text x="402" y="493.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle">7 · results → combine</text><path d="M50,343 L44,343 L44,112 L1130,112 L1130,128" fill="none" stroke="#8aa0c0" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah8aa0c0)"/><rect x="320.63" y="102.5" width="162.73999999999998" height="19" rx="9" fill="#0b0e14" stroke="#212a39"/><text x="402" y="115.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle">postMessage → wake main</text><path d="M1190,190 L1196,190 L1196,622 L44,622 L44,362 L50,362" fill="none" stroke="#8aa0c0" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah8aa0c0)"/><rect x="304.68" y="612.5" width="194.64" height="19" rx="9" fill="#0b0e14" stroke="#212a39"/><text x="402" y="625.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2" text-anchor="middle">Atomics.notify → wake worker</text></svg>