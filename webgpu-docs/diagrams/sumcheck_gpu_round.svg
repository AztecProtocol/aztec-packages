<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900" role="img"><defs><marker id="ah6b7688" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#6b7688"/></marker><marker id="ahs6b7688" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#6b7688"/></marker><marker id="ah8aa0c0" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#8aa0c0"/></marker><marker id="ahs8aa0c0" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#8aa0c0"/></marker><marker id="ah34d399" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#34d399"/></marker><marker id="ahs34d399" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#34d399"/></marker><marker id="ah4b9fff" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#4b9fff"/></marker><marker id="ahs4b9fff" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#4b9fff"/></marker><marker id="aha78bfa" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#a78bfa"/></marker><marker id="ahsa78bfa" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#a78bfa"/></marker><marker id="ahf5b544" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f5b544"/></marker><marker id="ahsf5b544" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f5b544"/></marker><marker id="ahf87171" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f87171"/></marker><marker id="ahsf87171" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f87171"/></marker><marker id="ah2dd4bf" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#2dd4bf"/></marker><marker id="ahs2dd4bf" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#2dd4bf"/></marker><marker id="ah5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker><marker id="ahs5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker></defs><rect x="0" y="0" width="1180" height="900" fill="#0b0e14"/><rect x="1" y="1" width="1178" height="898" rx="16" fill="none" stroke="#212a39"/><text x="34" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6e9ef">One sumcheck round as WebGPU passes</text><text x="34" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa4b2">Shared six-kernel spine; the two engines differ only in where the host re-enters the loop.</text><rect x="34" y="78" width="1112" height="112" rx="14" fill="#1b1633" fill-opacity="0.32" stroke="#a78bfa" stroke-dasharray="6 5"/><text x="50" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#a78bfa">SETUP — ONCE PER PROVE</text><rect x="56" y="112" width="340" height="62" rx="11" fill="#1b1633" stroke="#a78bfa" stroke-width="1.4"/><path d="M59,121 a6,6 0 0 1 5,-6 v56 a6,6 0 0 1 -5,-6 Z" fill="#a78bfa"/><text x="72" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c9bafd">upload 67 columns</text><text x="72" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">Montgomery bytes, column-major, resident</text><text x="72" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">for all rounds; 5 shift columns materialised</text><rect x="420" y="112" width="340" height="62" rx="11" fill="#1b1633" stroke="#a78bfa" stroke-width="1.4"/><path d="M423,121 a6,6 0 0 1 5,-6 v56 a6,6 0 0 1 -5,-6 Z" fill="#a78bfa"/><text x="436" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c9bafd">beta_products scan</text><text x="436" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">doubling subset-product on the GPU:</text><text x="436" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">pass k writes beta[2^k + r] = beta[r]·β_k</text><rect x="784" y="112" width="340" height="62" rx="11" fill="#1b1633" stroke="#a78bfa" stroke-width="1.4"/><path d="M787,121 a6,6 0 0 1 5,-6 v56 a6,6 0 0 1 -5,-6 Z" fill="#a78bfa"/><text x="800" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c9bafd">batch matrices M_LI / M_LD</text><text x="800" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">α-powers + barycentric extend-to-8</text><text x="800" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">folded into two constant 8×345 matrices</text><rect x="396" y="214" width="388" height="588" rx="14" fill="#0e1c30" fill-opacity="0.32" stroke="#4b9fff" stroke-dasharray="6 5"/><text x="412" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#4b9fff">PER ROUND I — SIX DISPATCH GROUPS</text><rect x="430" y="254" width="320" height="58" rx="11" fill="#0c2620" stroke="#34d399" stroke-width="1.4"/><path d="M433,263 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#34d399"/><text x="446" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#7be9c0">gate_separator_gather</text><text x="446" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">tail weights: beta_products at stride 2^(i+1)</text><rect x="430" y="338" width="320" height="58" rx="11" fill="#0c2620" stroke="#34d399" stroke-width="1.4"/><path d="M433,347 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#34d399"/><text x="446" y="363" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#7be9c0">accumulate (×14 or uber)</text><text x="446" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">1 thread / edge-pair → 345-slot univariates</text><rect x="430" y="422" width="320" height="58" rx="11" fill="#0e1c30" stroke="#4b9fff" stroke-width="1.4"/><path d="M433,431 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#4b9fff"/><text x="446" y="447" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#a9ccff">reduce — two levels</text><text x="446" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">sum over edges → exactly 345 Fr (~11 KB)</text><rect x="430" y="506" width="320" height="58" rx="11" fill="#0e1c30" stroke="#4b9fff" stroke-width="1.4"/><path d="M433,515 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#4b9fff"/><text x="446" y="531" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#a9ccff">batch</text><text x="446" y="549" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">S(0..7) = (M·acc)·(a+bβᵢ)·cᵢ — 8 threads</text><rect x="430" y="590" width="320" height="58" rx="11" fill="#1b1633" stroke="#a78bfa" stroke-width="1.4"/><path d="M433,599 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#a78bfa"/><text x="446" y="615" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c9bafd">poseidon2_transcript</text><text x="446" y="633" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">squeeze uᵢ resident; c ← c·(1−uᵢ+uᵢβᵢ)</text><rect x="430" y="674" width="320" height="58" rx="11" fill="#0e1c30" stroke="#4b9fff" stroke-width="1.4"/><path d="M433,683 a6,6 0 0 1 5,-6 v52 a6,6 0 0 1 -5,-6 Z" fill="#4b9fff"/><text x="446" y="699" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#a9ccff">fold</text><text x="446" y="717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">columns halve at uᵢ, ping-pong buffers</text><path d="M590,312 L590,338" fill="none" stroke="#6b7688" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahs6b7688)"/><path d="M590,396 L590,422" fill="none" stroke="#6b7688" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahs6b7688)"/><path d="M590,480 L590,506" fill="none" stroke="#6b7688" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahs6b7688)"/><path d="M590,564 L590,590" fill="none" stroke="#6b7688" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahs6b7688)"/><path d="M590,648 L590,674" fill="none" stroke="#6b7688" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahs6b7688)"/><path d="M750,703 L768,703 L768,283 L750,283" fill="none" stroke="#8aa0c0" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahs8aa0c0)"/><text x="590" y="775" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9aa4b2" text-anchor="middle">fold feeds the next round's gather — all state stays resident</text><rect x="34" y="214" width="330" height="588" rx="14" fill="#271e10" fill-opacity="0.32" stroke="#f5b544" stroke-dasharray="6 5"/><text x="50" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#f5b544">MULTI-PASS — HOST ROUND LOOP</text><rect x="56" y="258" width="286" height="74" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M59,267 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="72" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">readback / round</text><text x="72" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">the 345-Fr accumulator maps to the</text><text x="72" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">host after reduce — columns never leave</text><rect x="56" y="356" width="286" height="74" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M59,365 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="72" y="381" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">host tail + challenge</text><text x="72" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">batch on CPU, supply uᵢ (no host FS),</text><text x="72" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">submit the fold; d blocking syncs/prove</text><rect x="56" y="454" width="286" height="74" rx="11" fill="#271e10" stroke="#f5b544" stroke-width="1.4"/><path d="M59,463 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#f5b544"/><text x="72" y="479" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#fbd38d">unfenced fold</text><text x="72" y="497" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">the next round's readback covers it —</text><text x="72" y="513" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">one sync per round, not two</text><rect x="56" y="570" width="286" height="90" rx="11" fill="#12161f" stroke="#5a6683" stroke-width="1.4"/><path d="M59,579 a6,6 0 0 1 5,-6 v84 a6,6 0 0 1 -5,-6 Z" fill="#5a6683"/><text x="72" y="595" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c3ccdb">why it exists</text><text x="72" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">smallest protocol surface around the</text><text x="72" y="629" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">O(n) kernels; validated the math first;</text><text x="72" y="645" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">pays a d-round-trip latency floor</text><path d="M430,451 L342,295" fill="none" stroke="#f5b544" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahsf5b544)"/><path d="M342,393 L430,697" fill="none" stroke="#f5b544" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahsf5b544)"/><rect x="816" y="214" width="330" height="588" rx="14" fill="#0c2422" fill-opacity="0.32" stroke="#2dd4bf" stroke-dasharray="6 5"/><text x="832" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#2dd4bf">SINGLE-SUBMISSION — ONE SUBMIT</text><rect x="838" y="258" width="286" height="74" rx="11" fill="#0c2422" stroke="#2dd4bf" stroke-width="1.4"/><path d="M841,267 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#2dd4bf"/><text x="854" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#69ecd7">all d rounds, 1 buffer</text><text x="854" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">the whole protocol in one command</text><text x="854" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">buffer; hazard tracking orders the chain</text><rect x="838" y="356" width="286" height="74" rx="11" fill="#0c2422" stroke="#2dd4bf" stroke-width="1.4"/><path d="M841,365 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#2dd4bf"/><text x="854" y="381" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#69ecd7">on-GPU Fiat–Shamir</text><text x="854" y="399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">uᵢ never visits the host; transcript</text><text x="854" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">bit-identical to bb.js poseidon2Hash</text><rect x="838" y="454" width="286" height="74" rx="11" fill="#0c2422" stroke="#2dd4bf" stroke-width="1.4"/><path d="M841,463 a6,6 0 0 1 5,-6 v68 a6,6 0 0 1 -5,-6 Z" fill="#2dd4bf"/><text x="854" y="479" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#69ecd7">one readback at the end</text><text x="854" y="497" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">all d univariates + challenges +</text><text x="854" y="513" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">claimed evaluations in one map</text><rect x="838" y="570" width="286" height="90" rx="11" fill="#12161f" stroke="#5a6683" stroke-width="1.4"/><path d="M841,579 a6,6 0 0 1 5,-6 v84 a6,6 0 0 1 -5,-6 Z" fill="#5a6683"/><text x="854" y="595" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="600" fill="#c3ccdb">why it exists</text><text x="854" y="613" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">drop-in transcript ownership; never</text><text x="854" y="629" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">blocks the prover thread; the resident</text><text x="854" y="645" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#9aa4b2">stage of a GPU-resident prove</text><path d="M838,393 L750,619" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ahs2dd4bf)"/><rect x="34" y="826" width="1112" height="52" rx="14" fill="#2a1416" fill-opacity="0.32" stroke="#f87171" stroke-dasharray="6 5"/><text x="50" y="858" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#f87171">HYBRID</text><text x="130" y="858" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start">run the first d−T rounds on the GPU, hand the 2^T-row columns to threaded WASM for the last T ≈ 9 —</text><text x="130" y="874" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="start">the tail is latency-bound (a handful of edges still pays a full dispatch chain), the handoff is ~1–3 ms.</text></svg>