<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img"><defs><marker id="ah6b7688" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#6b7688"/></marker><marker id="ahs6b7688" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#6b7688"/></marker><marker id="ah8aa0c0" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#8aa0c0"/></marker><marker id="ahs8aa0c0" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#8aa0c0"/></marker><marker id="ah34d399" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#34d399"/></marker><marker id="ahs34d399" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#34d399"/></marker><marker id="ah4b9fff" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#4b9fff"/></marker><marker id="ahs4b9fff" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#4b9fff"/></marker><marker id="ahf5b544" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f5b544"/></marker><marker id="ahsf5b544" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#f5b544"/></marker><marker id="ah5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker><marker id="ahs5a6683" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse"><path d="M0.5,0.5 L12,6 L0.5,11.5 L4,6 Z" fill="#5a6683"/></marker></defs><rect x="0" y="0" width="1180" height="470" fill="#0b0e14"/><rect x="1" y="1" width="1178" height="468" rx="16" fill="none" stroke="#212a39"/><text x="34" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6e9ef">Where the work lives — and why the tail moves to WASM</text><text x="34" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9aa4b2">Each round touches half the rows of the last: the O(n) work is front-loaded, the tail is pure per-round latency. Example: d = 17.</text><text x="34" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#9aa4b2">SHARE OF TOTAL O(N) FIELD WORK, BY ROUND</text><rect x="34" y="120" width="553" height="52" rx="8" fill="#0c2620" stroke="#34d399"/><text x="312" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#7be9c0" text-anchor="middle">round 0 — 50%</text><rect x="590" y="120" width="275" height="52" rx="8" fill="#0c2620" stroke="#34d399"/><text x="729" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#7be9c0" text-anchor="middle">round 1 — 25%</text><rect x="868" y="120" width="136" height="52" rx="8" fill="#0e1c30" stroke="#4b9fff"/><text x="937.5" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#a9ccff" text-anchor="middle">r2 — 12.5%</text><rect x="1007" y="120" width="66.5" height="52" rx="8" fill="#0e1c30" stroke="#4b9fff"/><text x="1041.75" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#a9ccff" text-anchor="middle">r3</text><rect x="1076.5" y="120" width="66.5" height="52" rx="8" fill="#12161f" stroke="#5a6683"/><text x="1111.25" y="151" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#c3ccdb" text-anchor="middle">4…16</text><text x="451" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#7be9c0" text-anchor="middle">rounds 0–1 = 75% of everything</text><text x="1112.6399999999999" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9aa4b2" text-anchor="end">≈ noise</text><text x="34" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#9aa4b2">ROWS ALIVE PER ROUND (N = 2^17)</text><rect x="26" y="262" width="531.0588235294117" height="96" rx="14" fill="#0e1c30" fill-opacity="0.32" stroke="#4b9fff" stroke-dasharray="6 5"/><rect x="559.0588235294117" y="262" width="594.9411764705882" height="96" rx="14" fill="#271e10" fill-opacity="0.32" stroke="#f5b544" stroke-dasharray="6 5"/><rect x="34" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="62.94117647058823" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r0</text><text x="62.94117647058823" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">128k</text><rect x="99.88235294117646" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="128.8235294117647" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r1</text><text x="128.8235294117647" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">64k</text><rect x="165.76470588235293" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="194.70588235294116" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r2</text><text x="194.70588235294116" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">32k</text><rect x="231.6470588235294" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="260.5882352941176" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r3</text><text x="260.5882352941176" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">16k</text><rect x="297.52941176470586" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="326.4705882352941" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r4</text><text x="326.4705882352941" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">8k</text><rect x="363.4117647058823" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="392.35294117647055" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r5</text><text x="392.35294117647055" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">4k</text><rect x="429.2941176470588" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="458.235294117647" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r6</text><text x="458.235294117647" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">2k</text><rect x="495.17647058823525" y="278" width="57.88235294117647" height="44" rx="7" fill="#0e1c30" stroke="#4b9fff"/><text x="524.1176470588235" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r7</text><text x="524.1176470588235" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#a9ccff" text-anchor="middle">1k</text><rect x="561.0588235294117" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="590" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r8</text><text x="590" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">512</text><rect x="626.9411764705882" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="655.8823529411765" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r9</text><text x="655.8823529411765" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">256</text><rect x="692.8235294117646" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="721.7647058823529" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r10</text><text x="721.7647058823529" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">128</text><rect x="758.7058823529411" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="787.6470588235294" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r11</text><text x="787.6470588235294" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">64</text><rect x="824.5882352941176" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="853.5294117647059" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r12</text><text x="853.5294117647059" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">32</text><rect x="890.470588235294" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="919.4117647058823" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r13</text><text x="919.4117647058823" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">16</text><rect x="956.3529411764705" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="985.2941176470588" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r14</text><text x="985.2941176470588" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">8</text><rect x="1022.235294117647" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="1051.1764705882351" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r15</text><text x="1051.1764705882351" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">4</text><rect x="1088.1176470588234" y="278" width="57.88235294117647" height="44" rx="7" fill="#271e10" stroke="#f5b544"/><text x="1117.0588235294117" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9aa4b2" text-anchor="middle">r16</text><text x="1117.0588235294117" y="313" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fbd38d" text-anchor="middle">2</text><text x="297.52941176470586" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#a9ccff" text-anchor="middle">GPU front — edge-parallel, ~99.8% of the field work</text><text x="857.5294117647059" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#fbd38d" text-anchor="middle">WASM tail — last T ≈ 9 rounds, flat ~13 ms</text><text x="34" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start">The latency floor: a GPU round costs (submit + dispatch chain + sync) no matter how few edges remain, so the</text><text x="34" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start">deepest rounds cost the same as a mid-depth round while doing ~0 work — multi-pass pays that floor d times, single-submission</text><text x="34" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa4b2" text-anchor="start">collapses it to one bubble, and the hybrid simply hands the floor-bound tail to a CPU that does not have one.</text></svg>