[build]
  # Only build if docs-related files changed (docs/ or #include_code references)
  ignore = "./scripts/netlify-ignore-build.sh"

# Redirect root to /docs
[[redirects]]
  from = "/"
  to = "/docs"
  status = 302

# Serve static API files from /api
# The API files are already in static/api directory which will be served at /api
