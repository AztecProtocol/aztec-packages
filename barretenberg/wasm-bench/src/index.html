<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Barretenberg Wasm Bench</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #101417;
        color: #eef2f4;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
        align-items: end;
        margin-bottom: 18px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #b7c0c7;
        font-size: 13px;
      }

      input,
      select,
      button {
        min-height: 38px;
        border: 1px solid #39434b;
        border-radius: 6px;
        background: #151b20;
        color: #eef2f4;
        font: inherit;
      }

      input,
      select {
        padding: 0 10px;
      }

      button {
        cursor: pointer;
        background: #d4f05f;
        color: #121600;
        font-weight: 650;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.65;
      }

      pre {
        min-height: 360px;
        margin: 0;
        padding: 14px;
        overflow: auto;
        border: 1px solid #29323a;
        border-radius: 6px;
        background: #070a0c;
        color: #d9e4ea;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Barretenberg Wasm Bench</h1>
      <form id="bench-form">
        <label>
          Flow
          <input id="flow" name="flow" value="ecdsar1+transfer_1_recursions+sponsored_fpc" />
        </label>
        <label>
          Threads
          <input id="threads" name="threads" value="auto" />
        </label>
        <label>
          Runs
          <input id="runs" name="runs" type="number" min="1" value="1" />
        </label>
        <label>
          Mode
          <select id="smoke" name="smoke">
            <option value="false">prove</option>
            <option value="true">smoke</option>
          </select>
        </label>
        <button id="run" type="submit">Run</button>
      </form>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
