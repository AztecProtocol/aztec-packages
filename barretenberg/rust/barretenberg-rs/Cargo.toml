[package]
name = "barretenberg-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust bindings for Barretenberg, a C++ cryptographic library for zero-knowledge proofs"
license = "Apache-2.0"
repository = "https://github.com/AztecProtocol/aztec-packages/tree/next/barretenberg/rust/barretenberg-rs"
readme = "README.md"
keywords = ["cryptography", "zero-knowledge", "zkp", "barretenberg", "aztec"]
categories = ["cryptography", "api-bindings"]

[dependencies]
# Serialization
rmp.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
serde.workspace = true

# Async runtime
tokio = { workspace = true, optional = true }

# IPC and system
libc.workspace = true
nix = { workspace = true, optional = true }

# Utilities
thiserror.workspace = true
tracing = { workspace = true, optional = true }
hex.workspace = true

[features]
default = ["native", "ffi"]
native = ["tokio", "nix", "tracing"]
async = ["tokio"]
# FFI backend - links against libbarretenberg from cpp build
ffi = []
