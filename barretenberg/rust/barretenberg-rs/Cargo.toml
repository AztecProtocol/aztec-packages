[package]
name = "barretenberg-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust bindings for Barretenberg, a C++ cryptographic library for zero-knowledge proofs"
license = "Apache-2.0"
repository = "https://github.com/AztecProtocol/aztec-packages/tree/next/barretenberg/rust/barretenberg-rs"
readme = "README.md"
# crates.io allows max 5 keywords
keywords = ["zero-knowledge", "snark", "plonk", "noir", "aztec"]
categories = ["cryptography", "api-bindings"]
# Include generated files in the published crate even though they're gitignored.
# They're generated by `yarn generate` in ts/ and must exist on disk before `cargo publish`.
include = ["src/**/*.rs", "build.rs", "README.md"]

[dependencies]
# Serialization
rmp.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
serde.workspace = true

# Async runtime
tokio = { workspace = true, optional = true }

# IPC and system
libc.workspace = true
nix = { workspace = true, optional = true }

# Utilities
thiserror.workspace = true
tracing = { workspace = true, optional = true }
hex.workspace = true

[features]
default = ["native", "ffi"]
native = ["tokio", "nix", "tracing"]
async = ["tokio"]
# FFI backend - links against libbarretenberg from cpp build
ffi = []
