[package]
name = "barretenberg-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust bindings for Barretenberg, a C++ cryptographic library for zero-knowledge proofs"
license = "Apache-2.0"
repository = "https://github.com/AztecProtocol/aztec-packages/tree/next/barretenberg/rust/barretenberg-rs"
readme = "README.md"
# crates.io allows max 5 keywords
keywords = ["zero-knowledge", "snark", "plonk", "noir", "aztec"]
categories = ["cryptography", "api-bindings"]
# Include generated files in the published crate even though they're gitignored.
# They're generated by `yarn generate` in ts/ and must exist on disk before `cargo publish`.
include = ["src/**/*.rs", "build.rs", "README.md"]

[dependencies]
# Serialization
rmp.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
serde.workspace = true

# IPC and system
libc.workspace = true

# UDS / MPSC-SHM transport. The generated Backend trait carries a bridge impl
# for ipc_runtime::IpcClient, so this crate ships no transport code of its own.
ipc-runtime = { path = "../../../ipc-runtime/rust", optional = true }

# Utilities
thiserror.workspace = true
hex.workspace = true

[features]
default = ["native", "ffi"]
# FFI backend - links against libbarretenberg from cpp build
ffi = []
# Transport backends, provided by ipc-runtime.
ipc-runtime = ["dep:ipc-runtime"]
# Pre-migration feature names. `native` used to pull in the in-crate pipe
# backend and its async runtime; the transport now comes from ipc-runtime and
# needs no runtime of its own, so `async` is inert. Kept so existing manifests
# resolve unchanged.
native = ["ipc-runtime"]
async = []
