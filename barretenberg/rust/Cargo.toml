[workspace]
resolver = "2"
members = [
    "barretenberg-rs",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
# Serialization
rmp = "0.8"
rmp-serde = "1.1"
rmpv = "1.0"
serde = { version = "1.0", features = ["derive"] }

# IPC and system
libc = "0.2"

# Testing
criterion = "0.5"

# Utilities
thiserror = "1.0"
hex = "0.4"
