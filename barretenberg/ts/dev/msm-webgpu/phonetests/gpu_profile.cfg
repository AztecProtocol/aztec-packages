# AGI / perfetto TraceConfig for GPU profiling a WebGPU app.
# Passed to: gapit trace -api perfetto -perfetto gpu_profile.cfg ...
#
# Two data sources:
#   gpu.renderstages  -> per-GPU-job slices (this is what carries your pass labels). REQUIRED.
#   gpu.counters      -> hardware counters (utilization, starvation, ...). OPTIONAL, device-specific.
#
# duration_ms here is a fallback; the gapit `-for` flag is what actually bounds the capture.

buffers: { size_kb: 524288 fill_policy: RING_BUFFER }

data_sources: { config { name: "gpu.renderstages" } }

# Hardware counters are OPTIONAL and the counter_ids below are Mali-G715-specific.
# To discover the counter ids your device exposes:
#   gapit trace -api perfetto -serial <SER> -os android -list-gpu-counters
# Then replace the counter_ids list. If unsure, you can delete this whole block and
# still get fully-labeled render stages (just no counters).
data_sources: { config {
  name: "gpu.counters"
  gpu_counter_config {
    counter_period_ns: 200000
    counter_ids: 65536   # GPU utilization
    counter_ids: 65603   # SFU pipe utilization
    counter_ids: 65589   # Non-fragment (compute/vertex) utilization
    counter_ids: 230     # Execution core active cycles
    counter_ids: 236     # Processing unit starvation cycles
  }
} }

duration_ms: 60000
