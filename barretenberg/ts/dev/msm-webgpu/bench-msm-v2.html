<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MsmV2 A/B bench</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        max-width: 900px;
        margin: 1.5rem auto;
        padding: 0 1rem;
        line-height: 1.45;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        color: #334155;
      }
      table {
        border-collapse: collapse;
        margin: 1rem 0;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border: 1px solid #cbd5e1;
        padding: 3px 10px;
        text-align: right;
        font-size: 13px;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      thead th,
      tbody th {
        background: #f1f5f9;
      }
      tr.sum td {
        font-weight: 700;
        background: #f8fafc;
      }
      #log {
        background: #0b1020;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        padding: 0.75rem;
        border-radius: 6px;
        white-space: pre-wrap;
        max-height: 22rem;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h1>MsmV2 A/B bench — knob profiling</h1>
    <p>
      Drives <code>MsmV2</code> at one (n, knobs) config; reports median wall + per-pass GPU breakdown over warm reps.
      Open this page twice with one param changed to A/B a knob. Params:
      <code>?n=16384&amp;c=&amp;s=&amp;wgi=&amp;reducewg=&amp;l0log=&amp;inv=a|loop&amp;reps=20&amp;warmup=5&amp;profile=0</code>
    </p>
    <div id="out"></div>
    <div id="log"></div>
    <script type="module" src="./bench-msm-v2.ts"></script>
  </body>
</html>
