[workspace]
resolver = "2"
members = [
    "barretenberg-rs",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
# Serialization
rmp = "0.8"
rmp-serde = "1.1"
serde = { version = "1.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# IPC and system
libc = "0.2"
nix = { version = "0.27", features = ["socket", "uio"] }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Testing
criterion = "0.5"

# Utilities
thiserror = "1.0"
tracing = "0.1"
hex = "0.4"
