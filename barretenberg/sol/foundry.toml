[profile.default]
src = 'src'
out = 'out'
test = 'test'
libs = ['lib']
ffi = true
optimizer_runs = 1
gas_limit = 900000000000000000
bytecode_hash = "none"
evm_version = "cancun"

# Use the pre-downloaded solc binary from l1-contracts. l1-contracts' build is
# the single owner of the svm download; pointing other forge projects at the
# same binary avoids parallel svm downloads racing on ~/.svm.
solc = "../../l1-contracts/solc-0.8.30"

[fuzz]
runs = 2

[fmt]
# Foundry 1.5+ would reformat these. They are copied into the verifier templates in
# barretenberg/cpp/src/barretenberg/dsl/acir_proofs, so reformatting them changes the generated
# verifier source and with it the metadata hash in the deployed verifier's bytecode.
ignore = ["src/honk/CommitmentScheme.sol", "src/honk/Relations.sol"]

[lint]
ignore = ["./lib/**"]
exclude_lints = [
  # Silencing due to just being style changes
  "mixed-case-variable",
  "mixed-case-function",
  "screaming-snake-case-const",
  "screaming-snake-case-immutable",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
