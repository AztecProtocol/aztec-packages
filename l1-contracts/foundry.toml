[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib']
# NOTE!: This line defines the solc version used.
# It is downloaded by bootstrap.sh, but the version string here is parsed.
solc = "./solc-0.8.30"
evm_version = 'prague'
optimizer = true
optimizer_runs = 100
match_path = "test/**/*.t.sol"
# Run each test as one transaction rather than isolating every top-level call into its own. Per-call
# isolation charges cold-access and intrinsic gas on each call, which pushes the large validator-set
# tests past the gas limit. Gas reports isolate every call whatever this is set to.
isolate = false
# Helper to get all the contract names in the src/governance and src/core directories
# find ./src/governance ./src/core -type f -name "*.sol" -exec grep -h "^contract [A-Za-z]" {} \; | sed -E 's/contract ([A-Za-z0-9_]+).*/"\1"/' | tr "\n" ", "
gas_reports = [
  "BN254KeyTest",
  "CoinIssuer",
  "FeeJuicePortal",
  "Governance",
  "TestGov",
  "GovernanceProposer",
  "GSE",
  "Inbox",
  "Multicall3",
  "Outbox",
  "Registry",
  "RewardDistributor",
  "Rollup",
  "RollupCore",
  "Slasher",
  "RollupWithPreheating",
  "SlashingProposer",
  "MultiAdder",
]

# Remappings are listed explicitly instead of auto-detected from lib/. They are recorded in each
# contract's metadata, so its hash and therefore the deployed bytecode depend on them. Foundry 1.5+
# auto-detects extra context-scoped remappings for nested libraries, some with absolute paths, which
# would make the bytecode differ from the deployed contracts and between checkouts. The last six
# entries of each list are what Foundry 1.4 used to auto-detect.
auto_detect_remappings = false
remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=src",
  "@test/=test",
  "@generated/=generated/",
  "@zkpassport/=lib/circuits/src/solidity/src/",
  "@zkpassport-test/=lib/circuits/src/solidity/test",
  "@aztec-blob-lib/=src/mock/libraries",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "circuits/=lib/circuits/src/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

fs_permissions = [
  { access = "read-write", path = "./test/fixtures/mainnet_atp_reduction_calculator.json" },
  { access = "read", path = "./test/fixtures/bn254_constants.json" },
  { access = "read", path = "./test/fixtures/bn254_pop_gas_vectors.json" },
  { access = "read", path = "./test/fixtures/mixed_checkpoint_1.json" },
  { access = "read", path = "./test/fixtures/mixed_checkpoint_2.json" },
  { access = "read", path = "./test/fixtures/single_tx_checkpoint_1.json" },
  { access = "read", path = "./test/fixtures/single_tx_checkpoint_2.json" },
  { access = "read", path = "./test/fixtures/empty_checkpoint_1.json" },
  { access = "read", path = "./test/fixtures/empty_checkpoint_2.json" },
  { access = "read", path = "./test/fixtures/fee_data_points.json" },
  { access = "read", path = "./test/staking_asset_handler/zkpassport/fixtures/valid_proof.hex" },
  { access = "read", path = "./test/staking_asset_handler/zkpassport/fixtures/valid_committed_inputs.hex" },
  { access = "read", path = "./test/staking_asset_handler/zkpassport/fixtures/valid_public_inputs.json" },
  { access = "read", path = "./test/fixtures/boosted_rewards/shares.json" },
  { access = "read", path = "./test/fixtures/boosted_rewards/activity_scores.json" },
  { access = "read", path = "./script/registration_data.json" },
  # Network defaults - the canonical L1 contract config values (source of truth).
  { access = "read", path = "./scripts/network-defaults.json" }
]
no_match_contract = "(ScreamAndShoutTest|UniswapPortalTest|MerkleCheck)"

[fmt]
line_length = 120
tab_width = 2
wrap_comments = true
number_underscore = "thousands"
override_spacing = false
# HonkVerifier.sol is generated. The other files are ones Foundry 1.5+ would reformat, left as they were
# deployed: any change to a source file, whitespace included, changes the metadata hash in the bytecode
# of every contract built from it.
ignore = [
  "src/core/EscapeHatch.sol",
  "src/core/libraries/rollup/FeeLib.sol",
  "src/core/libraries/rollup/RewardLib.sol",
  "src/core/libraries/rollup/STFLib.sol",
  "src/governance/GSE.sol",
  "src/governance/libraries/compressed-data/Proposal.sol",
  "script/deploy/DeployRollupForUpgradeV6.s.sol",
  "script/deploy/HonkVerifier.sol",
]

[lint]
ignore = ["./lib/**"]
exclude_lints = [
  "unused-import",   # Mostly in test code
  "incorrect-shift", # Throws warnings on construction of bitmasks
  "asm-keccak256", # https://github.com/AztecProtocol/aztec-packages/issues/16808

  # Silencing due to just being style changes
  "mixed-case-variable",
  "mixed-case-function",
  "screaming-snake-case-const",
  "screaming-snake-case-immutable",
]

[rpc_endpoints]
mainnet_fork = "https://mainnet.infura.io/v3/9928b52099854248b3a096be07a6b23c"

[profile.production]
remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=src",
  "@test/=test",
  "@generated/=generated/",
  "@zkpassport/=lib/circuits/src/solidity/src/",
  "@zkpassport-test/=lib/circuits/src/solidity/test",
  "@aztec-blob-lib/=src/core/libraries/rollup/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "circuits/=lib/circuits/src/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[profile.coverage]
script = "coverage-script"
sparse_mode = true
skip = [
  "shouting.t.sol",
  "test/benchmark/happy.t.sol",
  "test/script",
  "script/deploy/DeployAztecL1Contracts.s.sol",
  "test/staking/move.t.sol",
  "test/validator-selection/setupEpoch.t.sol",
  "test/validator-selection/setupSampleSeed.t.sol",
]
remappings = [
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@aztec/=src",
  "@test/=test",
  "@generated/=src/mock/coverage/generated/",
  "@zkpassport/=src/mock/coverage/zkpassport/",
  "@zkpassport-test/=lib/circuits/src/solidity/test",
  "@aztec-blob-lib/=src/mock/libraries",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "circuits/=lib/circuits/src/",
  "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
  "forge-std/=lib/forge-std/src/",
  "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
