fullnameOverride: ""

externalSecret:
  gcpSecretName: ""
  refreshInterval: "1m"
  secretStore:
    name: "gcp-secret-store"
    kind: "ClusterSecretStore"

scrapeConfigs: []

resourceAttributes: {}

irm:
  enabled: false
  endpoint: ""
  resourceAttributes: {}
  metricCatalog:
    schemaVersion: 1
    resourceAttributes: []
    metrics: []
  exporter:
    timeout: "10s"
    retry:
      initialInterval: "1s"
      maxInterval: "10s"
      maxElapsedTime: "300s"
    queue:
      numConsumers: 2
      size: 500

labels: {}

image: "otel/opentelemetry-collector-contrib:0.154.0"

replicas: 1

nodeSelector: {}

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"
