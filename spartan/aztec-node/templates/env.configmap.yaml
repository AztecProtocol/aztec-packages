{{- /*
  Generic env ConfigMap built from .Values.env (UPPER_SNAKE keys).
  Mounted via envFrom in _pod-template.yaml.
  Only rendered when .Values.env has at least one key.
*/}}
{{- if .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-env-from-values
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
{{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
