{{- define "chart.podTemplate" }}
{{- $repo := .Values.node.image.repository | default .Values.global.aztecImage.repository | required ".Values.global.aztecImage.repository is required" }}
{{- $tag := .Values.node.image.tag | default .Values.global.aztecImage.tag | required ".Values.global.aztecImage.tag is required" }}
{{- $image := printf "%s:%s" $repo $tag }}
metadata:
  labels:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app: node
  annotations:
    {{- /* Recreate the pods on every upgrade in order to refresh configmaps and secrets */}}
    rollme: {{ randAlphaNum 5 | quote }}
spec:
  {{- if .Values.serviceAccount.create }}
  serviceAccountName: {{ include "chart.serviceAccountName" . }}
  {{- end }}

  {{- if .Values.hostNetwork }}
  dnsPolicy: ClusterFirstWithHostNet
  hostNetwork: true
  {{- end }}

  {{- if .Values.affinity }}
  affinity:
    {{- toYaml .Values.affinity | nindent 4 }}
  {{- end }}

  {{- if .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml .Values.nodeSelector | nindent 4 }}
  {{- end }}

  {{- if .Values.tolerations }}
  tolerations:
    {{- toYaml .Values.tolerations | nindent 4 }}
  {{- end }}

  {{- if .Values.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml .Values.topologySpreadConstraints | nindent 4 }}
  {{- end }}

  {{- if or .Values.initContainers .Values.service.p2p.nodePortEnabled }}
  initContainers:
  {{- if .Values.initContainers }}
    {{- tpl (toYaml .Values.initContainers | nindent 4) $ }}
  {{- end }}
  {{- if .Values.service.p2p.nodePortEnabled }}
    - name: init-nodeport
      image: registry.suse.com/suse/kubectl:1.33
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      command:
        - /bin/bash
        - -c
        - |
          export POD_INDEX=$(echo ${POD_NAME} | awk -F'-' '{print $NF}');
          export EXTERNAL_PORT=$(kubectl get services -l "pod-index in (${POD_INDEX}), type in (p2p)" -o jsonpath='{.items[0].spec.ports[0].nodePort}');

          echo "export P2P_BROADCAST_PORT=$EXTERNAL_PORT"      >> /shared/init-nodeport;

          cat /shared/init-nodeport;
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      volumeMounts:
        - name: shared
          mountPath: /shared
  {{- end }}
  {{- end }}
  containers:
    - name: aztec
      image: {{ $image }}
      imagePullPolicy: {{ .Values.global.aztecImage.pullPolicy }}
      command:
        - /bin/bash
        - -c
        - |
          if [ -f /shared/init-nodeport ]; then
            source /shared/init-nodeport;
          fi

          if [ -n "${DATA_DIRECTORY:-}" ]; then
            mkdir -p "$DATA_DIRECTORY"
          fi

          if [ -n "${CRS_PATH:-}" ]; then
            mkdir -p "$CRS_PATH"
          fi

          {{- if .Values.service.p2p.publicIP }}
            export P2P_QUERY_FOR_IP=true
          {{- else }}
            export P2P_IP=$(hostname -i)
          {{- end }}

          {{- if .Values.node.enableInspector }}
          start_cmd=("node" "--inspect=0.0.0.0:9229" "/usr/src/yarn-project/aztec/dest/bin/index.js" "start" {{ join " " .Values.node.startCmd }})
          {{- else }}
          start_cmd=("node" "/usr/src/yarn-project/aztec/dest/bin/index.js" "start" {{ join " " .Values.node.startCmd }})
          {{- end }}
          source /scripts/setup-otel-resource.sh

          {{- if .Values.node.preStartScript }}
          {{ .Values.node.preStartScript | nindent 10 }}
          {{- end }}
          "${start_cmd[@]}"
      startupProbe:
        httpGet:
          path: /status
          port: {{ .Values.service.rpc.port }}
        periodSeconds: {{ .Values.node.startupProbe.periodSeconds }}
        timeoutSeconds: {{ .Values.node.startupProbe.timeoutSeconds }}
        initialDelaySeconds: {{ .Values.node.startupProbe.initialDelaySeconds }}
        failureThreshold: {{ .Values.node.startupProbe.failureThreshold }}
      volumeMounts:
        - name: shared
          mountPath: /shared
        - name: scripts
          mountPath: /scripts/
        {{- if .Values.node.configMap.extraScriptsEnabled }}
        - name: extra-scripts
          mountPath: /extra-scripts/
        {{- end }}
        {{- if .Values.node.secret.filesEnabled }}
        - name: secrets
          mountPath: /secrets/
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.node.storage.dataDirectory }}
        {{- end }}
      envFrom:
        {{- /*
          Pod env vars come from the env ConfigMap built from .Values.env (single
          source of truth, populated from per-network YAMLs by the loader).
        */}}
        {{- if .Values.env }}
        - configMapRef:
            name: {{ include "chart.fullname" . }}-env-from-values
        {{- end }}
        {{- if .Values.node.configMap.envEnabled }}
        - configMapRef:
            name: {{ include "chart.fullname" . }}-env
        {{- end }}
        {{- if .Values.node.secret.envEnabled }}
        - secretRef:
            name: {{ include "chart.fullname" . }}-env
        {{- end }}
      env:
        {{- /*
          Only env vars that depend on k8s pod metadata or chart-shape (service
          ports, paths derived from storage volumes, JS runtime flags, admin API
          key auth) live here. Everything else flows from .Values.env above.
        */}}
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VALIDATOR_HA_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_OPTIONS
          value: {{ join " " .Values.node.nodeJsOptions | quote }}
        - name: AZTEC_PORT
          value: "{{ .Values.service.rpc.port }}"
        - name: AZTEC_ADMIN_PORT
          value: "{{ .Values.service.admin.port }}"
        {{- if .Values.node.adminApiKeyHash }}
        - name: AZTEC_ADMIN_API_KEY_HASH
          value: {{ .Values.node.adminApiKeyHash | quote }}
        {{- else if .Values.node.disableAdminApiKey }}
        - name: AZTEC_DISABLE_ADMIN_API_KEY
          value: "true"
        {{- end }}
        - name: P2P_PORT
          value: "{{ .Values.service.p2p.port }}"
        - name: P2P_BROADCAST_PORT
          value: "{{ .Values.service.p2p.announcePort }}"
        - name: DATA_DIRECTORY
          value: "{{ .Values.node.storage.dataDirectory }}/data"
        - name: CRS_PATH
          value: "{{ .Values.node.storage.dataDirectory }}/crs"
        {{- if .Values.node.coinbase }}
        - name: COINBASE
          value: {{ .Values.node.coinbase | quote }}
        - name: PROVER_ID
          value: {{ .Values.node.coinbase | quote }}
        {{- end }}
        {{- /*
          Per-release env vars set via Terraform `set` blocks (deploy-time
          computed values: PUBLISHER_KEY_INDEX_START, VALIDATOR_HA_*, etc.)
          flow through .Values.node.env. These are inline (not via the env
          ConfigMap) so per-release computed values can differ across
          validators-* / validators-ha-N releases without colliding on a
          shared ConfigMap name.
        */}}
        {{- range $key, $value := .Values.node.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
      ports:
        - containerPort: {{ .Values.service.rpc.port }}
          name: rpc
        {{- if .Values.service.admin.enabled }}
        - containerPort: {{ .Values.service.admin.port }}
          name: admin
        {{- end }}
        {{- if .Values.service.p2p.enabled }}
        - containerPort: {{ .Values.service.p2p.port }}
          protocol: TCP
          name: p2p-tcp
          {{- if and (not .Values.hostNetwork) (not .Values.service.p2p.nodePortEnabled) }}
          hostPort: {{ .Values.service.p2p.announcePort }}
          {{- end }}
        - containerPort: {{ .Values.service.p2p.port }}
          protocol: UDP
          name: p2p-udp
          {{- if and (not .Values.hostNetwork) (not .Values.service.p2p.nodePortEnabled) }}
          hostPort: {{ .Values.service.p2p.announcePort }}
          {{- end }}
        {{- end }}
      resources:
        {{- toYaml .Values.node.resources | nindent 8 }}
  volumes:
    - name: shared
      emptyDir: {}
    - name: scripts
      configMap:
        name: {{ include "chart.fullname" . }}-scripts
    {{- if .Values.node.configMap.extraScriptsEnabled }}
    - name: extra-scripts
      configMap:
        name: {{ include "chart.fullname" . }}-extra-scripts
    {{- end }}
    {{- if .Values.node.secret.filesEnabled }}
    - name: secrets
      secret:
        secretName: {{ include "chart.fullname" . }}-files
    {{- end }}
    {{- if .Values.persistence.enabled }}
    {{- if .Values.persistence.existingClaim }}
    - name: data
      persistentVolumeClaim:
        claimName: {{ .Values.persistence.existingClaim }}
    {{- else if not .Values.statefulSet.enabled }}
    - name: data
      emptyDir: {}
    {{/* else the statefulSet's volume claim templates is expected to set something up for the pod to use */}}
    {{- end }}
    {{- end }}
{{- end }}
