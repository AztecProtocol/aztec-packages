# Network Configuration Defaults
#
# This file is used for CODE GENERATION, not runtime configuration.
# It centralizes "baked-in" defaults used by yarn-project packages.
#
# These defaults affect:
#   - End-to-end tests
#   - CLI usage without environment variables
#   - Default values in TypeScript config mappings
#
# They are NOT read at runtime from this file. To override values for
# an existing deployment, use environment variables or a .env file.
#
# The network sections (devnet, testnet, mainnet) define presets for
# the NETWORK env var. You can target them via runtime injection and
# still override individual values.
#
# Generated outputs:
#   - yarn-project/ethereum/src/generated/l1-contracts-defaults.ts
#   - yarn-project/slasher/src/generated/slasher-defaults.ts
#   - yarn-project/cli/src/config/generated/networks/{network}.json
#   - l1-contracts/generated/default.json
#
# To regenerate after editing:
#   yarn-project/ethereum: yarn generate
#   yarn-project/slasher: yarn generate
#   yarn-project/cli: yarn generate
#   l1-contracts: ./bootstrap.sh

#===============================================================================
# L1 CONTRACTS DEFAULTS
#===============================================================================
# These configure Aztec L1 smart contracts and are used during deployment.
# Values here must match Solidity vm.envOr defaults in RollupConfiguration.sol.

l1-contracts: &l1-contracts-defaults
  #---------------------------------------------------------------------------
  # Timing Configuration
  #---------------------------------------------------------------------------
  # How many seconds an L1 slot lasts (Ethereum consensus layer).
  ETHEREUM_SLOT_DURATION: 12
  # How many seconds an L2 slot lasts (must be multiple of L1 slot duration).
  AZTEC_SLOT_DURATION: 36
  # How many L2 slots in an epoch.
  AZTEC_EPOCH_DURATION: 32

  #---------------------------------------------------------------------------
  # Validator Configuration
  #---------------------------------------------------------------------------
  # Target number of validators in the committee.
  AZTEC_TARGET_COMMITTEE_SIZE: 48
  # How many epochs to lag for validator set selection.
  AZTEC_LAG_IN_EPOCHS_FOR_VALIDATOR_SET: 2
  # How many epochs to lag for RANDAO selection.
  AZTEC_LAG_IN_EPOCHS_FOR_RANDAO: 2
  # Minimum stake to become a validator (in wei, 100 TST).
  AZTEC_ACTIVATION_THRESHOLD: 100e18
  # Minimum stake before forced ejection (in wei, 50 TST).
  AZTEC_EJECTION_THRESHOLD: 50e18
  # Local ejection threshold, stricter than ejectionThreshold (in wei, 98 TST).
  AZTEC_LOCAL_EJECTION_THRESHOLD: 98e18
  # Seconds a validator must wait before exiting (2 days).
  AZTEC_EXIT_DELAY_SECONDS: 172800

  #---------------------------------------------------------------------------
  # Proof & Block Configuration
  #---------------------------------------------------------------------------
  # Checkpoints to lag in inbox (prevents sequencer DOS attacks).
  AZTEC_INBOX_LAG: 1
  # Epochs after end that proofs are still accepted.
  AZTEC_PROOF_SUBMISSION_EPOCHS: 1
  # Target mana consumption per block.
  AZTEC_MANA_TARGET: 100000000
  # Cost per unit of mana for proving.
  AZTEC_PROVING_COST_PER_MANA: 100

  #---------------------------------------------------------------------------
  # Slashing Protocol Configuration
  #---------------------------------------------------------------------------
  # Type of slasher: 'empire', 'tally', or 'none'.
  AZTEC_SLASHER_FLAVOR: tally
  # How many epochs in a slashing round.
  AZTEC_SLASHING_ROUND_SIZE_IN_EPOCHS: 4
  # How many rounds a slashing payload is valid.
  AZTEC_SLASHING_LIFETIME_IN_ROUNDS: 5
  # Rounds to wait before executing a slash (0 = immediate).
  AZTEC_SLASHING_EXECUTION_DELAY_IN_ROUNDS: 0
  # Rounds back we slash for (N-offset when slashing in round N).
  AZTEC_SLASHING_OFFSET_IN_ROUNDS: 2
  # Address that can veto slashing payloads (zero = no vetoer).
  AZTEC_SLASHING_VETOER: "0x0000000000000000000000000000000000000000"
  # How long slashing can be disabled when vetoer disables it (5 days).
  AZTEC_SLASHING_DISABLE_DURATION: 432000
  # Small slash amount for light offenses (in wei, 10 TST).
  AZTEC_SLASH_AMOUNT_SMALL: 10e18
  # Medium slash amount for moderate offenses (in wei, 20 TST).
  AZTEC_SLASH_AMOUNT_MEDIUM: 20e18
  # Large slash amount for severe offenses (in wei, 50 TST).
  AZTEC_SLASH_AMOUNT_LARGE: 50e18

  #---------------------------------------------------------------------------
  # Governance Configuration
  #---------------------------------------------------------------------------
  # Number of slots in a governance proposer round.
  AZTEC_GOVERNANCE_PROPOSER_ROUND_SIZE: 300

#===============================================================================
# SLASHER NODE DEFAULTS
#===============================================================================
# These configure the slasher node's operational behavior.
# Used by yarn-project/slasher for penalty calculation and offense tracking.

slasher: &slasher
  # Minimum penalty percentage multiplier.
  SLASH_MIN_PENALTY_PERCENTAGE: 0.5
  # Maximum penalty percentage multiplier.
  SLASH_MAX_PENALTY_PERCENTAGE: 2.0
  # Rounds after which an offense expires.
  SLASH_OFFENSE_EXPIRATION_ROUNDS: 4
  # Maximum size of slashing payload.
  SLASH_MAX_PAYLOAD_SIZE: 50
  # Rounds to look back when executing slashes.
  SLASH_EXECUTE_ROUNDS_LOOK_BACK: 4
  # Penalty for slashing validators of a valid pruned epoch.
  SLASH_PRUNE_PENALTY: 10e18
  # Penalty for data withholding.
  SLASH_DATA_WITHHOLDING_PENALTY: 10e18
  # Missed attestation percentage to trigger inactivity slash (0, 1].
  SLASH_INACTIVITY_TARGET_PERCENTAGE: 0.9
  # Consecutive epochs a validator must be inactive before slashing.
  SLASH_INACTIVITY_CONSECUTIVE_EPOCH_THRESHOLD: 1
  # Penalty for inactivity.
  SLASH_INACTIVITY_PENALTY: 10e18
  # Penalty for proposing invalid attestations.
  SLASH_PROPOSE_INVALID_ATTESTATIONS_PENALTY: 10e18
  # Penalty for attesting to a descendant of an invalid block.
  SLASH_ATTEST_DESCENDANT_OF_INVALID_PENALTY: 10e18
  # Penalty for unknown offenses.
  SLASH_UNKNOWN_PENALTY: 10e18
  # Penalty for broadcasting an invalid block.
  SLASH_INVALID_BLOCK_PENALTY: 10e18
  # L2 slots grace period before considering an offense expired.
  SLASH_GRACE_PERIOD_L2_SLOTS: 0

#===============================================================================
# PRODLIKE BASE
#===============================================================================
# Common configuration for all non-local networks.
# Not itself a network, just used as an anchor for inheritance.

_prodlike: &prodlike
  <<: *l1-contracts-defaults
  <<: *slasher

  #---------------------------------------------------------------------------
  # P2P & Network
  #---------------------------------------------------------------------------
  # Enable P2P networking.
  P2P_ENABLED: true
  # Comma-separated list of bootstrap node multiaddrs.
  BOOTSTRAP_NODES: ""

  #---------------------------------------------------------------------------
  # Sequencer Configuration
  #---------------------------------------------------------------------------
  # Minimum transactions to include in a block.
  SEQ_MIN_TX_PER_BLOCK: 0
  # Build checkpoint even if block is empty.
  SEQ_BUILD_CHECKPOINT_IF_EMPTY: true

  #---------------------------------------------------------------------------
  # Database Map Sizes (in KB)
  #---------------------------------------------------------------------------
  # General data store size (128 GB).
  DATA_STORE_MAP_SIZE_KB: 134217728
  # Archiver store size (1 TB).
  ARCHIVER_STORE_MAP_SIZE_KB: 1073741824
  # Note hash tree store size (1 TB).
  NOTE_HASH_TREE_MAP_SIZE_KB: 1073741824
  # Nullifier tree store size (1 TB).
  NULLIFIER_TREE_MAP_SIZE_KB: 1073741824
  # Public data tree store size (1 TB).
  PUBLIC_DATA_TREE_MAP_SIZE_KB: 1073741824

  #---------------------------------------------------------------------------
  # Public Telemetry
  #---------------------------------------------------------------------------
  # Metric name prefixes to include in public telemetry.
  PUBLIC_OTEL_INCLUDE_METRICS: "aztec.validator,aztec.tx_collector,aztec.mempool,aztec.p2p.gossip.agg_,aztec.ivc_verifier.agg_"

  #---------------------------------------------------------------------------
  # Sentinel
  #---------------------------------------------------------------------------
  # Enable sentinel monitoring.
  SENTINEL_ENABLED: true

# Network presets selected via NETWORK env var; individual values can still be overridden.
networks:
  devnet:
    <<: *prodlike
    # L1 contract overrides - faster epochs for development
    AZTEC_EPOCH_DURATION: 8
    AZTEC_LAG_IN_EPOCHS_FOR_VALIDATOR_SET: 1
    AZTEC_LAG_IN_EPOCHS_FOR_RANDAO: 1
    AZTEC_SLASHING_EXECUTION_DELAY_IN_ROUNDS: 1
    # Network identity
    L1_CHAIN_ID: 11155111  # Sepolia
    # Genesis state
    TEST_ACCOUNTS: true     # Fund test accounts with fee juice
    SPONSORED_FPC: true     # Fund sponsored FPC with fee juice
    TRANSACTIONS_DISABLED: false
    # Sequencer
    SEQ_MAX_TX_PER_BLOCK: 32
    # Prover
    PROVER_REAL_PROOFS: false   # Use mock proofs
    PXE_PROVER_ENABLED: false   # Disable PXE proving
    # Sync
    SYNC_SNAPSHOTS_URLS: ""
    SKIP_ARCHIVER_INITIAL_SYNC: false
    BLOB_ALLOW_EMPTY_SOURCES: false
    # P2P
    P2P_MAX_PENDING_TX_COUNT: 1000
    P2P_TX_POOL_DELETE_TXS_AFTER_REORG: false
    # Auto-update
    AUTO_UPDATE: none
    AUTO_UPDATE_URL: ""
    # Telemetry
    PUBLIC_OTEL_OPT_OUT: true
    PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ""
    PUBLIC_OTEL_COLLECT_FROM: ""
    # Slasher penalties
    SLASH_PRUNE_PENALTY: 10e18
    SLASH_DATA_WITHHOLDING_PENALTY: 10e18
    SLASH_INACTIVITY_TARGET_PERCENTAGE: 0.9
    SLASH_INACTIVITY_CONSECUTIVE_EPOCH_THRESHOLD: 1
    SLASH_INACTIVITY_PENALTY: 10e18
    SLASH_PROPOSE_INVALID_ATTESTATIONS_PENALTY: 10e18
    SLASH_ATTEST_DESCENDANT_OF_INVALID_PENALTY: 10e18
    SLASH_UNKNOWN_PENALTY: 10e18
    SLASH_INVALID_BLOCK_PENALTY: 10e18
    SLASH_GRACE_PERIOD_L2_SLOTS: 0

  testnet:
    <<: *prodlike
    # L1 contract overrides - longer slots, higher stakes
    AZTEC_SLOT_DURATION: 72
    AZTEC_ACTIVATION_THRESHOLD: 200000e18
    AZTEC_EJECTION_THRESHOLD: 100000e18
    AZTEC_LOCAL_EJECTION_THRESHOLD: 199000e18
    AZTEC_SLASHING_EXECUTION_DELAY_IN_ROUNDS: 2
    AZTEC_SLASHING_VETOER: "0xdfe19Da6a717b7088621d8bBB66be59F2d78e924"
    AZTEC_SLASHING_QUORUM: 33
    AZTEC_GOVERNANCE_PROPOSER_ROUND_SIZE: 100
    AZTEC_GOVERNANCE_PROPOSER_QUORUM: 60
    AZTEC_MANA_TARGET: 150000000
    # Network identity
    L1_CHAIN_ID: 11155111  # Sepolia
    # Genesis state
    TEST_ACCOUNTS: false
    SPONSORED_FPC: true
    TRANSACTIONS_DISABLED: false
    # Sequencer
    SEQ_MAX_TX_PER_BLOCK: 8
    # Prover
    PROVER_REAL_PROOFS: true
    # P2P
    P2P_TX_POOL_DELETE_TXS_AFTER_REORG: true
    # Slasher penalties
    SLASH_PRUNE_PENALTY: 10e18
    SLASH_DATA_WITHHOLDING_PENALTY: 10e18
    SLASH_INACTIVITY_TARGET_PERCENTAGE: 0.9
    SLASH_INACTIVITY_CONSECUTIVE_EPOCH_THRESHOLD: 1
    SLASH_INACTIVITY_PENALTY: 10e18
    SLASH_PROPOSE_INVALID_ATTESTATIONS_PENALTY: 10e18
    SLASH_ATTEST_DESCENDANT_OF_INVALID_PENALTY: 10e18
    SLASH_UNKNOWN_PENALTY: 10e18
    SLASH_INVALID_BLOCK_PENALTY: 10e18
    SLASH_GRACE_PERIOD_L2_SLOTS: 64

  mainnet:
    <<: *prodlike
    # L1 contract overrides - production parameters
    AZTEC_SLOT_DURATION: 72
    AZTEC_TARGET_COMMITTEE_SIZE: 24
    AZTEC_ACTIVATION_THRESHOLD: 200000e18
    AZTEC_EJECTION_THRESHOLD: 100000e18
    AZTEC_LOCAL_EJECTION_THRESHOLD: 196000e18
    AZTEC_SLASH_AMOUNT_SMALL: 2000e18
    AZTEC_SLASH_AMOUNT_MEDIUM: 2000e18
    AZTEC_SLASH_AMOUNT_LARGE: 2000e18
    AZTEC_SLASHING_LIFETIME_IN_ROUNDS: 34
    AZTEC_SLASHING_EXECUTION_DELAY_IN_ROUNDS: 28
    AZTEC_SLASHING_VETOER: "0xBbB4aF368d02827945748b28CD4b2D42e4A37480"
    AZTEC_SLASHING_QUORUM: 65
    AZTEC_GOVERNANCE_PROPOSER_QUORUM: 600
    AZTEC_GOVERNANCE_PROPOSER_ROUND_SIZE: 1000
    AZTEC_MANA_TARGET: 0
    AZTEC_PROVING_COST_PER_MANA: 0
    AZTEC_EXIT_DELAY_SECONDS: 345600  # 4 days
    AZTEC_SLASHING_DISABLE_DURATION: 259200  # 3 days
    # Network identity
    L1_CHAIN_ID: 1  # Ethereum mainnet
    # Genesis state - no test accounts, no sponsored FPC
    TEST_ACCOUNTS: false
    SPONSORED_FPC: false
    TRANSACTIONS_DISABLED: true  # Initially disabled
    # Sequencer
    SEQ_MAX_TX_PER_BLOCK: 0
    # Prover
    PROVER_REAL_PROOFS: true
    # Sync
    SYNC_SNAPSHOTS_URLS: "https://aztec-labs-snapshots.com/mainnet/"
    BLOB_ALLOW_EMPTY_SOURCES: true
    # P2P
    P2P_MAX_PENDING_TX_COUNT: 0
    P2P_TX_POOL_DELETE_TXS_AFTER_REORG: true
    # Auto-update
    AUTO_UPDATE: notify
    AUTO_UPDATE_URL: "https://storage.googleapis.com/aztec-mainnet/auto-update/mainnet.json"
    # Telemetry
    PUBLIC_OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "https://telemetry.alpha-testnet.aztec-labs.com/v1/metrics"
    PUBLIC_OTEL_COLLECT_FROM: sequencer
    # Slasher penalties - more lenient initially
    SLASH_PRUNE_PENALTY: 0
    SLASH_DATA_WITHHOLDING_PENALTY: 0
    SLASH_INACTIVITY_TARGET_PERCENTAGE: 0.8
    SLASH_INACTIVITY_CONSECUTIVE_EPOCH_THRESHOLD: 2
    SLASH_INACTIVITY_PENALTY: 2000e18
    SLASH_PROPOSE_INVALID_ATTESTATIONS_PENALTY: 2000e18
    SLASH_ATTEST_DESCENDANT_OF_INVALID_PENALTY: 2000e18
    SLASH_UNKNOWN_PENALTY: 2000e18
    SLASH_INVALID_BLOCK_PENALTY: 2000e18
    SLASH_GRACE_PERIOD_L2_SLOTS: 1200
