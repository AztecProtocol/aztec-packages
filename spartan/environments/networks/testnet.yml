# Auto-converted from testnet.env -- review for correctness
network: testnet

deploy:
  CREATE_ETH_DEVNET: "false"
  GCP_REGION: "us-west1-a"
  CLUSTER: "aztec-gke-public"
  NAMESPACE: "${NAMESPACE:-testnet}"
  NETWORK: "testnet"
  ETHEREUM_CHAIN_ID: "11155111"
  VERIFY_CONTRACTS: "true"
  CREATE_ROLLUP_CONTRACTS: "${CREATE_ROLLUP_CONTRACTS:-false}"
  USE_NETWORK_CONFIG: "${USE_NETWORK_CONFIG:-true}"
  SNAPSHOT_BUCKET_DIRECTORY: "${SNAPSHOT_BUCKET_DIRECTORY:-testnet}"
  BLOB_BUCKET_DIRECTORY: "${BLOB_BUCKET_DIRECTORY:-testnet/blobs}"
  TX_FILE_STORE_ENABLED: "true"
  TX_FILE_STORE_BUCKET_DIRECTORY: "${TX_FILE_STORE_BUCKET_DIRECTORY:-testnet/txs}"
  RPC_INGRESS_ENABLED: "true"
  RPC_INGRESS_HOSTS:
    - "rpc.testnet.aztec-labs.com"
  RPC_INGRESS_STATIC_IP_NAME: "testnet-rpc-ip"
  RPC_INGRESS_SSL_CERT_NAMES:
    - "testnet-rpc-cert"
  VALIDATOR_RESOURCE_PROFILE: "prod-spot"
  PROVER_RESOURCE_PROFILE: "prod"
  DEPLOY_INTERNAL_BOOTNODE: "false"
  DEPLOY_ARCHIVAL_NODE: "true"
  VALIDATOR_REPLICAS: "4"
  VALIDATORS_PER_NODE: "64"
  VALIDATOR_PUBLISHERS_PER_REPLICA: "8"
  VALIDATOR_PUBLISHER_MNEMONIC_START_INDEX: "5000"
  VALIDATOR_HA_REPLICAS: "1"
  PUBLISHERS_PER_PROVER: "2"
  PROVER_PUBLISHER_MNEMONIC_START_INDEX: "8000"
  PROVER_REPLICAS: "4"
  BOT_TRANSFERS_REPLICAS: "1"
  BOT_SWAPS_REPLICAS: "0"

env:
  REAL_VERIFIER: "true"
  AZTEC_ENTRY_QUEUE_BOOTSTRAP_VALIDATOR_SET_SIZE: "48"
