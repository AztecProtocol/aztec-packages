# Devnet (Sepolia, private GKE).
# Inherits env baseline from network-defaults.yml -> networks.devnet.env.
# MNEMONIC_INDEX_OFFSET and the *_MNEMONIC_START_INDEX values are computed by
# the loader's apply_derived (devnet's NAMESPACE pattern selects the offset).
network: devnet

deploy:
  GCP_REGION: us-west1-a
  CLUSTER: aztec-gke-private
  NETWORK: devnet
  NAMESPACE: ${NAMESPACE:-devnet}
  CREATE_ETH_DEVNET: "false"
  ETHEREUM_CHAIN_ID: "11155111"
  LABS_INFRA_MNEMONIC_SECRET_NAME: sepolia-labs-devnet-mnemonic
  SNAPSHOT_BUCKET_DIRECTORY: ${SNAPSHOT_BUCKET_DIRECTORY:-devnet/$NAMESPACE/snapshots}
  BLOB_BUCKET_DIRECTORY: ${BLOB_BUCKET_DIRECTORY:-devnet/$NAMESPACE/blobs}
  VERIFY_CONTRACTS: "false"
  CREATE_ROLLUP_CONTRACTS: ${CREATE_ROLLUP_CONTRACTS:-false}
  USE_NETWORK_CONFIG: ${USE_NETWORK_CONFIG:-false}
  PROVER_RESOURCE_PROFILE: dev
  RPC_INGRESS_ENABLED: "true"
  RPC_INGRESS_HOSTS:
    - "${NAMESPACE}.aztec-labs.com"
  RPC_INGRESS_STATIC_IP_NAME: "${NAMESPACE}-rpc-ip"
  RPC_INGRESS_SSL_CERT_NAMES:
    - "${NAMESPACE}-rpc-cert"
  DEPLOY_INTERNAL_BOOTNODE: "false"
  # Mnemonic-index bases (loader adds MNEMONIC_INDEX_OFFSET via apply_derived).
  VALIDATOR_MNEMONIC_START_INDEX: "1"
  VALIDATOR_PUBLISHER_MNEMONIC_START_INDEX: "5000"
  PROVER_PUBLISHER_MNEMONIC_START_INDEX: "8000"
  # Counts consumed by deploy_network.sh / Terraform fan-out.
  VALIDATOR_REPLICAS: "1"
  VALIDATORS_PER_NODE: "1"
  VALIDATOR_PUBLISHERS_PER_REPLICA: "8"
  PROVER_REPLICAS: "1"
  PROVER_AGENTS_PER_PROVER: "4"
  PUBLISHERS_PER_PROVER: "1"
  BOT_TRANSFERS_REPLICAS: "0"
  BOT_SWAPS_REPLICAS: "0"
  REAL_VERIFIER: "false"

env:
  # Secrets resolved by the loader via gcloud (see scripts/load_network_config.sh).
  ETHEREUM_RPC_URLS: REPLACE_WITH_GCP_SECRET
  ETHEREUM_CONSENSUS_HOST_URLS: REPLACE_WITH_GCP_SECRET
  ETHEREUM_CONSENSUS_HOST_API_KEYS: REPLACE_WITH_GCP_SECRET
  ETHEREUM_CONSENSUS_HOST_API_KEY_HEADERS: REPLACE_WITH_GCP_SECRET
  FUNDING_PRIVATE_KEY: REPLACE_WITH_GCP_SECRET
  LABS_INFRA_MNEMONIC: REPLACE_WITH_GCP_SECRET
  ROLLUP_DEPLOYMENT_PRIVATE_KEY: REPLACE_WITH_GCP_SECRET
  OTEL_COLLECTOR_ENDPOINT: REPLACE_WITH_GCP_SECRET
  AWS_ACCESS_KEY_ID: REPLACE_WITH_GCP_SECRET
  AWS_SECRET_ACCESS_KEY: REPLACE_WITH_GCP_SECRET
  # Devnet-specific overrides on top of network-defaults.yml's networks.devnet.env baseline.
  AZTEC_LAG_IN_EPOCHS_FOR_VALIDATOR_SET: "1"
  AZTEC_LAG_IN_EPOCHS_FOR_RANDAO: "1"
  AZTEC_SLOT_DURATION: "36"
  AZTEC_EPOCH_DURATION: "8"
  AZTEC_TARGET_COMMITTEE_SIZE: "1"
  TEST_ACCOUNTS: "false"
  SPONSORED_FPC: "false"
  FLUSH_ENTRY_QUEUE: "true"
  SEQ_L1_PUBLISHING_TIME_ALLOWANCE_IN_SLOT: "12"
  SEQ_BLOCK_DURATION_MS: "6000"
  SEQ_MIN_TX_PER_BLOCK: "1"
  SEQ_MAX_TX_PER_BLOCK: "32"
  DEBUG_FORCE_TX_PROOF_VERIFICATION: "true"
  WS_NUM_HISTORIC_CHECKPOINTS: "300"
