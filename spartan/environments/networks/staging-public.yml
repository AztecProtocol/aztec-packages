deploy:
  CREATE_ETH_DEVNET: "false"
  GCP_REGION: "us-west1-a"
  CLUSTER: "aztec-gke-private"
  NETWORK: "staging-public"
  NAMESPACE: "${NAMESPACE:-staging-public}"
  ETHEREUM_CHAIN_ID: "11155111"
  VERIFY_CONTRACTS: "true"
  SNAPSHOT_BUCKET_DIRECTORY: "${SNAPSHOT_BUCKET_DIRECTORY:-staging-public}"
  BLOB_BUCKET_DIRECTORY: "${BLOB_BUCKET_DIRECTORY:-staging-public/blobs}"
  TX_FILE_STORE_ENABLED: "true"
  TX_FILE_STORE_BUCKET_DIRECTORY: "${TX_FILE_STORE_BUCKET_DIRECTORY:-staging-public/txs}"
  CREATE_ROLLUP_CONTRACTS: "${CREATE_ROLLUP_CONTRACTS:-false}"
  VALIDATOR_RESOURCE_PROFILE: "prod-spot"
  DEPLOY_INTERNAL_BOOTNODE: "true"
  VALIDATOR_REPLICAS: "2"
  VALIDATORS_PER_NODE: "64"
  VALIDATOR_PUBLISHERS_PER_REPLICA: "4"
  VALIDATOR_PUBLISHER_MNEMONIC_START_INDEX: "5000"
  VALIDATOR_HA_REPLICAS: "1"
  VALIDATOR_HA_REPLICA_COUNT: "4"
  PROVER_REPLICAS: "4"
  PUBLISHERS_PER_PROVER: "2"
  PROVER_PUBLISHER_MNEMONIC_START_INDEX: "8000"
  BOT_TRANSFERS_REPLICAS: "1"
  BOT_SWAPS_REPLICAS: "1"
  BOT_CROSS_CHAIN_REPLICAS: "1"

env:
  ETHEREUM_RPC_URLS: "REPLACE_WITH_GCP_SECRET"
  ETHEREUM_CONSENSUS_HOST_URLS: "REPLACE_WITH_GCP_SECRET"
  ETHEREUM_CONSENSUS_HOST_API_KEYS: "REPLACE_WITH_GCP_SECRET"
  ETHEREUM_CONSENSUS_HOST_API_KEY_HEADERS: "REPLACE_WITH_GCP_SECRET"
  FUNDING_PRIVATE_KEY: "REPLACE_WITH_GCP_SECRET"
  LABS_INFRA_MNEMONIC: "REPLACE_WITH_GCP_SECRET"
  ROLLUP_DEPLOYMENT_PRIVATE_KEY: "REPLACE_WITH_GCP_SECRET"
  OTEL_COLLECTOR_ENDPOINT: "REPLACE_WITH_GCP_SECRET"
  ETHERSCAN_API_KEY: "REPLACE_WITH_GCP_SECRET"
  BLOB_FILE_STORE_URLS: ","
  TX_COLLECTION_FILE_STORE_URLS: "https://aztec-labs-snapshots.com/${TX_FILE_STORE_BUCKET_DIRECTORY}"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_GCP_SECRET"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_GCP_SECRET"
  TEST_ACCOUNTS: "false"
  SPONSORED_FPC: "false"
  AZTEC_MANA_TARGET: "75000000"
  AZTEC_PROVING_COST_PER_MANA: "25000000"
  SEQ_MAX_L2_BLOCK_GAS: "150000000"
  SEQ_MIN_TX_PER_BLOCK: "1"
  # 0.1 TPS
  SEQ_MAX_TX_PER_CHECKPOINT: "7"
  SEQ_BUILD_CHECKPOINT_IF_EMPTY: "true"
  SEQ_BLOCK_DURATION_MS: "6000"
  SEQ_L1_PUBLISHING_TIME_ALLOWANCE_IN_SLOT: "36"
  P2P_TX_POOL_DELETE_TXS_AFTER_REORG: "true"
  PROVER_FAILED_PROOF_STORE: "gs://aztec-develop/staging-public/failed-proofs"
  L1_TX_FAILED_STORE: "gs://aztec-develop/staging-public/failed-l1-txs"
  BOT_DA_GAS_LIMIT: "100000"
  BOT_L2_GAS_LIMIT: "6540000"
  LOG_LEVEL: "debug; info: simulator, json-rpc"

bot_transfers:
  bot:
    env:
      BOT_TX_INTERVAL_SECONDS: "250"
      BOT_FOLLOW_CHAIN: "PROPOSED"

bot_swaps:
  bot:
    env:
      BOT_TX_INTERVAL_SECONDS: "350"
      BOT_FOLLOW_CHAIN: "PROPOSED"

bot_cross_chain:
  bot:
    env:
      BOT_TX_INTERVAL_SECONDS: "250"
      BOT_FOLLOW_CHAIN: "PROPOSED"
