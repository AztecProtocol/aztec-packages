{{- if .Values.proverKill.enabled }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: {{ .Release.Name }}-{{ .Values.global.targetNamespace }}-prover-kill
  namespace: {{ default .Values.global.chaosMeshNamespace .Values.global.chaosResourceNamespace }}
  labels:
    {{- include "aztec-chaos-scenarios.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
spec:
  action: pod-kill
  mode: fixed-percent
  value: {{ .Values.proverKill.percent | quote }}
  selector:
    namespaces:
      - {{ .Values.global.targetNamespace }}
    labelSelectors:
      app.kubernetes.io/component: prover-node
{{- end }}
