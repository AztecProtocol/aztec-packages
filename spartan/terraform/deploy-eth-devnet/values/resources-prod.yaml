# Production resource specifications for eth-devnet
ethereum:
  execution:
    service:
      type: ClusterIP
      annotations: {}
    nodeSelector:
      local-ssd: "false"
      node-type: "network"
    storageSize: "10Gi"
    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "8Gi"
        cpu: "4"

  beacon:
    service:
      type: ClusterIP
      annotations: {}
    nodeSelector:
      local-ssd: "false"
      node-type: "network"
    storageSize: "10Gi"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2"

  validator:
    nodeSelector:
      local-ssd: "false"
      node-type: "network"
    storageSize: "10Gi"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1"
