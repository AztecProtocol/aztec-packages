nodeSelector:
  local-ssd: "false"
  node-type: "network"
  cores: "4"

replicaCount: 1

node:
  nodeJsOptions:
    - "--max-old-space-size=12288"
  resources:
    requests:
      cpu: "2"
      memory: "8Gi"
    limits:
      cpu: "3.5"
      memory: "14Gi"

persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 16Gi

service:
  type: ClusterIP
  p2p:
    enabled: true
    nodePortEnabled: false
  admin:
    enabled: false
  headless:
    enabled: false
