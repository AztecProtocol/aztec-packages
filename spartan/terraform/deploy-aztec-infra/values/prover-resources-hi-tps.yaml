node:
  hostNetwork: true
  node:
    enableInspector: true
    nodeJsOptions:
      - "--max-old-space-size=65536"
      - "--expose-gc"
    env:
      # Memory debugging - set to track memory leaks
      PROVER_NODE_MEMORY_DEBUG: "1"
      PROVER_NODE_HEAP_SNAPSHOT_GCS: "gs://aztec-develop/heap-snapshots"
      PROVER_NODE_HEAP_SNAPSHOT_INTERVAL: "1"
      PROVER_NODE_HEAP_SNAPSHOT_DELETE_LOCAL: "1"
    resources:
      requests:
        cpu: "6"
        memory: "54Gi"

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "8"
    hi-mem: "true"

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - node
          topologyKey: "kubernetes.io/hostname"
          namespaceSelector: {}

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Gi

broker:
  replicaCount: 1

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "8"
    hi-mem: "true"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 256Gi
  node:
    enableInspector: true
    nodeJsOptions:
      - "--max-old-space-size=65536"
    resources:
      requests:
        # should land on a 8-core node
        cpu: "5"
        memory: "54Gi"

agent:
  replicaCount: 4

  node:
    env:
      HARDWARE_CONCURRENCY: "1"
    resources:
      requests:
        memory: "2Gi"
        cpu: "1.0"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: Exists

  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
