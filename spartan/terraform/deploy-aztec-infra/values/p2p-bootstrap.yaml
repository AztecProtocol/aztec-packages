nameOverride: "node"

replicaCount: 1

podDisruptionBudget:
  enabled: true
  minAvailable: 1

node:
  env:
    OTEL_SERVICE_NAME: "boot-node"

  startCmd:
    - --p2p-bootstrap
  readinessProbe:
    enabled: false

service:
  p2p:
    enabled: true
    nodePortEnabled: false
  admin:
    enabled: false
  headless:
    enabled: false
