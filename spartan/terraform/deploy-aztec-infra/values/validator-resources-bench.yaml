# Bench profile: deterministic, guaranteed validator sizing for benchmarking.
# The prod profile requests only 0.5 CPU with a node-type=network selector, so
# the scheduler bin-packs validators across the shared cluster's mixed 2-/4-core
# network pools. Pods that land on 2-core nodes run their 4 attesters on too
# little CPU, fall behind on re-execution, and fail to attest ("Timed out
# waiting for block with archive matching checkpoint proposal") — dragging the
# committee below quorum and causing checkpoint prunes at 10 TPS.
#
# Here request=limit (Guaranteed QoS) reserves the cores so nothing is
# contended, and a >1.93-core request keeps validators off the 2-core pool:
# one pod (4 attesters) per dedicated 4-core node. On-demand (no spot) so
# eviction can't corrupt the measurement.
validator:
  nodeSelector:
    local-ssd: "false"
    node-type: "network"
  node:
    resources:
      requests:
        cpu: "3.5"
        memory: "12Gi"
      limits:
        cpu: "3.5"
        memory: "12Gi"
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Gi
