replicaCount: 1

node:
  resources:
    requests:
      cpu: "0.25"
      memory: "1Gi"
    limits:
      cpu: "0.5"
      memory: "2Gi"

persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          "helm.sh/resource-policy": "Retain"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "1Ti"

service:
  headless:
    enabled: true
