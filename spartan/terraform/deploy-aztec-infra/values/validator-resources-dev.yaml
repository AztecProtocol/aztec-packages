validator:
  node:
    resources:
      requests:
        cpu: "0.25"
        memory: "1Gi"
      limits:
        cpu: "0.5"
        memory: "2Gi"
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
