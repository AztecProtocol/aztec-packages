nodeSelector:
  local-ssd: "false"
  node-type: "network"
  cores: "2"

replicaCount: 1

node:
  resources:
    requests:
      cpu: "0.5"
      memory: "2Gi"
    limits:
      cpu: "1.5"
      memory: "6Gi"

persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          "helm.sh/resource-policy": "Retain"
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: "64Gi"

service:
  headless:
    enabled: true
