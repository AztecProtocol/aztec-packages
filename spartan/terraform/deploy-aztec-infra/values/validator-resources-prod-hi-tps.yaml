validator:
  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "8"
    hi-mem: "true"
  node:
    resources:
      requests:
        cpu: "7.5"
        memory: "55Gi"

    nodeJsOptions:
      - "--max-old-space-size=61440"
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Gi
