bot:
  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "2"
    pool: "spot"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: Exists

  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  node:
    resources:
      requests:
        cpu: "0.5"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
