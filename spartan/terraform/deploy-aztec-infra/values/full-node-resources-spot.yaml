# Full-node profile that REQUIRES spot nodes (inclusion sweep). Same shape
# + resources as full-node-resources-prod.yaml, but the
# spot affinity is required (not merely preferred) so full nodes always land on
# spot, copying the pattern from prover-resources-dev.yaml. Only full nodes use
# this profile; validators / RPC / prover stay on-demand so mid-block spot
# eviction cannot corrupt the inclusion measurement.
nodeSelector:
  local-ssd: "false"
  node-type: "network"
  pool: "spot"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: cloud.google.com/gke-spot
              operator: Exists

tolerations:
  - key: "cloud.google.com/gke-spot"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

replicaCount: 1

node:
  resources:
    requests:
      cpu: "0.5"
      memory: "2Gi"
    limits:
      cpu: "1.5"
      memory: "6Gi"
persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 16Gi

service:
  p2p:
    enabled: true
    nodePortEnabled: false
  admin:
    enabled: true
  headless:
    enabled: false
