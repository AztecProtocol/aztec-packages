node:
  node:
    nodeJsOptions:
      - "--max-old-space-size=12288"
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "3.5"
        memory: "14Gi"

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "4"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Gi

broker:
  replicaCount: 1

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "4"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 8Gi
  node:
    nodeJsOptions:
      - "--max-old-space-size=12288"
    resources:
      requests:
        cpu: "2"
        memory: "8Gi"
      limits:
        cpu: "3.5"
        memory: "14Gi"

agent:
  replicaCount: 4

  node:
    env:
      HARDWARE_CONCURRENCY: "16"
    resources:
      requests:
        memory: "55Gi"
        cpu: "15"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: Exists

  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
