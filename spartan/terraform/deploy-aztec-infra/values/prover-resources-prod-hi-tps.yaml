node:
  node:
    resources:
      requests:
        cpu: "7.5"
        memory: "55Gi"

    nodeJsOptions:
      - "--max-old-space-size=61440"

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "8"
    hi-mem: "true"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 16Gi

broker:
  replicaCount: 1

  node:
    resources:
      requests:
        cpu: "7.5"
        memory: "55Gi"

    nodeJsOptions:
      - "--max-old-space-size=61440"

  nodeSelector:
    local-ssd: "false"
    node-type: "network"
    cores: "8"
    hi-mem: "true"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 64Gi
agent:
  replicaCount: 4

  node:
    env:
      # the pod will be scheduled on a 32-core VM
      HARDWARE_CONCURRENCY: "32"
    resources:
      requests:
        memory: "115Gi"
        cpu: "31"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: Exists

  tolerations:
    - key: "cloud.google.com/gke-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
