nodeSelector:
  local-ssd: "false"
  node-type: "network"
  cores: "2"

replicaCount: 1

node:
  resources:
    requests:
      cpu: "1.6"
      memory: "5Gi"
persistence:
  enabled: true

statefulSet:
  enabled: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 16Gi

service:
  # rpc:
  #   type: LoadBalancer
  #   annotations:
  #     networking.gke.io/load-balancer-type: "External"
  p2p:
    enabled: true
    nodePortEnabled: false
  admin:
    enabled: true
  headless:
    enabled: false
