bot:
  replicaCount: 1
  botMode: "crosschain"
  txIntervalSeconds: 10
  followChain: "PROPOSED"
  feePaymentMethod: "fee_juice"
  maxErrors: 3
  stopIfUnhealthy: true
  botPrivateKey: "0xcafe03"

  node:
    env:
      OTEL_SERVICE_NAME: "bot-cross-chain"

  persistence:
    enabled: true
  statefulSet:
    volumeClaimTemplates:
      - metadata:
          name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi

  service:
    headless:
      enabled: true
