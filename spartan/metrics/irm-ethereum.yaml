schemaVersion: 1

resourceAttributes:
  - k8s.namespace.name

metrics:
  - otelName: up
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - component: ethereum-node
        eth_chain: mainnet
      - component: kong

  - otelName: reth_network_connected_peers
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet

  - otelName: reth_blockchain_tree_canonical_chain_height
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet

  - otelName: libp2p_peers
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet

  - otelName: sync_eth2_synced
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet

  - otelName: beacon_head_slot
    allowedAttributes:
      - component
      - network
      - eth_chain
      - eth_client
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet

  - otelName: kong_http_requests_total
    allowedAttributes:
      - network
      - eth_chain
      - eth_endpoint
      - code
    includeAttributeSets:
      - eth_chain: mainnet
    aggregation:
      function: sum
      attributes:
        - network
        - eth_chain
        - eth_endpoint
        - code

  - otelName: kong_request_latency_ms
    allowedAttributes:
      - network
      - eth_chain
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet
    aggregation:
      function: sum
      attributes:
        - network
        - eth_chain
        - eth_endpoint

  - otelName: kong_latency
    allowedAttributes:
      - network
      - eth_chain
      - eth_endpoint
    includeAttributeSets:
      - eth_chain: mainnet
        type: request
    aggregation:
      function: sum
      attributes:
        - network
        - eth_chain
        - eth_endpoint
