                uid: __expr__
                updated: "0001-01-01T00:00:00Z"
                url: ""
                user: ""
                withCredentials: false
              expression: is_number($query) || is_nan($query) || is_inf($query)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: prometheus_math
              type: math
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              datasource:
                IsPrunable: false
                access: ""
                apiVersion: ""
                basicAuth: false
                basicAuthUser: ""
                created: "0001-01-01T00:00:00Z"
                database: ""
                id: -100
                isDefault: false
                jsonData: {}
                name: __expr__
                readOnly: false
                secureJsonData: {}
                type: __expr__
                uid: __expr__
                updated: "0001-01-01T00:00:00Z"
                url: ""
                user: ""
                withCredentials: false
              expression: prometheus_math
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        dashboardUid: ethereum
        panelId: 5
        noDataState: OK
        execErrState: OK
        for: 30m
        annotations:
          __dashboardUid__: ethereum
          __panelId__: "5"
          description: Lighthouse has reported an unsynced state for at least 30 minutes.
          summary: Lighthouse is not synced on mainnet
        labels:
          __converted_prometheus_rule__: "true"
          __grafana_alert_rule_uid__: ethereum-lighthouse-unsynced
          environment: mainnet
          service: ethereum
          severity: critical
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: ethereum-lighthouse-head-stalled
        title: EthereumLighthouseHeadStalled
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: grafanacloud-prom
            model:
              datasource:
                type: prometheus
                uid: grafanacloud-prom
              expr: |
                max by (eth_chain) (
                  changes(beacon_head_slot{job="ethereum",network="ethereum",eth_chain="mainnet",eth_client="lighthouse"}[15m])
                ) == 0
                and on (eth_chain)
                max by (eth_chain) (sync_eth2_synced{job="ethereum",network="ethereum",eth_chain="mainnet",eth_client="lighthouse"}) == 1
              instant: true
              intervalMs: 1000
