                - evaluator:
                    params:
                      - 0
                    type: gt
              datasource:
                IsPrunable: false
                access: ""
                apiVersion: ""
                basicAuth: false
                basicAuthUser: ""
                created: "0001-01-01T00:00:00Z"
                database: ""
                id: -100
