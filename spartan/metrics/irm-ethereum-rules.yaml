                type: prometheus
                uid: grafanacloud-prom
              expr: max by (eth_chain) (sync_eth2_synced{job="ethereum",network="ethereum",eth_chain="mainnet",eth_client="lighthouse"}) < 1
              instant: true
              intervalMs: 1000
