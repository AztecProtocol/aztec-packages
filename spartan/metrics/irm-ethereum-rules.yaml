            queryType: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              datasource:
                IsPrunable: false
                access: ""
                apiVersion: ""
                basicAuth: false
                basicAuthUser: ""
                created: "0001-01-01T00:00:00Z"
                database: ""
                id: -100
                isDefault: false
                jsonData: {}
                name: __expr__
                readOnly: false
                secureJsonData: {}
                type: __expr__
                uid: __expr__
                updated: "0001-01-01T00:00:00Z"
                url: ""
                user: ""
                withCredentials: false
              expression: prometheus_math
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        dashboardUid: ethereum
        panelId: 7
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          __dashboardUid__: ethereum
          __panelId__: "7"
          description: More than 5% of requests have returned 5xx responses for at least 10 minutes while traffic exceeds 0.1 requests per second.
          summary: Ethereum {{ $labels.eth_endpoint }} RPC 5xx ratio is high
        labels:
