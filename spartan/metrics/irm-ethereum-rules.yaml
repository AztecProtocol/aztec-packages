              type: threshold
        dashboardUid: ethereum
        panelId: 6
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          __dashboardUid__: ethereum
          __panelId__: "6"
          description: Lighthouse reports that it is synced, but its beacon head slot has not advanced.
          summary: Lighthouse head slot is stalled on mainnet
        labels:
          __converted_prometheus_rule__: "true"
          __grafana_alert_rule_uid__: ethereum-lighthouse-head-stalled
          environment: mainnet
          service: ethereum
          severity: critical
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: ethereum-rpc-5xx-high
        title: EthereumRPC5xxRatioHigh
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: grafanacloud-prom
            model:
              datasource:
                type: prometheus
                uid: grafanacloud-prom
              expr: |
                (
                  sum by (eth_chain, eth_endpoint) (
                    rate(kong_http_requests_total{job="ethereum",network="ethereum",eth_chain="mainnet",code=~"5.."}[10m])
                  )
                  /
                  sum by (eth_chain, eth_endpoint) (
                    rate(kong_http_requests_total{job="ethereum",network="ethereum",eth_chain="mainnet"}[10m])
                  )
                ) > 0.05
                and on (eth_chain, eth_endpoint)
                sum by (eth_chain, eth_endpoint) (
                  rate(kong_http_requests_total{job="ethereum",network="ethereum",eth_chain="mainnet"}[10m])
                ) > 0.1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: query
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
