apiVersion: v1
kind: Service
metadata:
  name: {{ include "aztec-postgres.fullname" . }}
  labels:
    {{- include "aztec-postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
