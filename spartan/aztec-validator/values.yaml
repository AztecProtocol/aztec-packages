global:
  aztecRollupVersion: "canonical"
  aztecNetwork: ""
  customAztecNetwork:
    enabled: false

  l1ExecutionUrls: []
  l1ConsensusUrls: []
  l1ConsensusHostApiKeys: ""
  l1ConsensusHostApiKeyHeaders: ""

validator:
  nodeType: "sequencer-node"
  mnemonic: "test test test test test test test test test test test junk"
  mnemonicStartIndex: 2000
  validatorsPerNode: 1
  publishersPerReplica: 4
  publisherMnemonicStartIndex: 7000

  persistence:
    enabled: false
  statefulSet:
    enabled: true

  replicaCount: 1

  node:
    # Set to false in production to enable API key auth.
    disableAdminApiKey: true
    configMap:
      envEnabled: true
    secret:
      envEnabled: true

    preStartScript: |
      source /scripts/setup-attester-keystore.sh

    env:
      OTEL_SERVICE_NAME: "validator"

    startCmd:
      - --node
      - --sequencer

  web3signerUrl: ""

  service:
    p2p:
      enabled: true
      nodePortEnabled: false
    admin:
      enabled: true
    headless:
      enabled: true
