[package]
name = "aztec-acvm"
version = "0.1.0"
edition = "2021"
description = "The ACVM as an ipc-codegen service: a native binary and a wasm module solving ACIR programs, with oracles answered by the caller."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "aztec_acvm"
# cdylib: the wasm module (exports acvm_ipc_ffi_entry). rlib: the binary and the tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aztec-acvm"
path = "src/main.rs"
required-features = ["ipc-runtime"]

[features]
default = ["ipc-runtime"]
# The native server, and the Oracle client over a socket.
ipc-runtime = ["dep:ipc-runtime"]
# The FFI entry the wasm module exports. Built with --no-default-features --features wasm.
wasm = ["dep:libc"]

[dependencies]
# Must match the noir that compiled the programs run here (noir/noir-repo).
acir = "=1.0.0-rc.5"
acvm = "=1.0.0-rc.5"
bn254_blackbox_solver = "=1.0.0-rc.5"
# The pinned foundation release (../foundation.pin).
ipc-runtime = { version = "=7.0.0-nightly.20261031", optional = true }
libc = { version = "0.2", optional = true }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[profile.release]
lto = true

[dev-dependencies]
base64 = "0.22"
flate2 = "1.0"
ipc-runtime = "=7.0.0-nightly.20261031"
serde_json = "1.0"
