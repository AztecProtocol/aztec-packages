[workspace]
resolver = "2"
members = [
    "shared/data-types",
    "shared/kernel-logic",
    "shared/aztec-sdk",
    "shared/crypto-bn254",
    "shared/interpreter",
    "shared/preflight",
    "shared/benchmarks",
    "shared/test-contracts",
    "backends/sp1/host",
    "backends/openvm/aztec-test",
]
exclude = [
    "backends/sp1/guest",
    "backends/jolt",
    "backends/zkwasm",
    # Nexus has its own workspace (host + guest). Scaffold with `cargo nexus host`.
    "backends/nexus",
    # RISC Zero has its own workspace (host + methods + guest). Built via risc0-build.
    "backends/risc0",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
zkvm-data-types = { path = "shared/data-types" }
zkvm-kernel-logic = { path = "shared/kernel-logic" }
zkvm-aztec-sdk = { path = "shared/aztec-sdk" }
zkvm-crypto-bn254 = { path = "shared/crypto-bn254" }
zkvm-interpreter = { path = "shared/interpreter" }
zkvm-preflight = { path = "shared/preflight" }
zkvm-test-contracts = { path = "shared/test-contracts" }
zkvm-benchmarks = { path = "shared/benchmarks" }

# Serialization (no_std compatible)
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
bincode = "1.3"

# Benchmarking (std, host-only)
criterion = { version = "0.5", features = ["html_reports"] }
sysinfo = "0.33"

# Utilities
thiserror-no-std = "2.0"
