[package]
name = "risc0-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "3.0", default-features = false }
zkvm-data-types = { path = "../../../../shared/data-types" }
zkvm-kernel-logic = { path = "../../../../shared/kernel-logic" }
zkvm-aztec-sdk = { path = "../../../../shared/aztec-sdk" }
zkvm-test-contracts = { path = "../../../../shared/test-contracts" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# SHA-256: the workspace-level [patch] routes this through RISC Zero's
# native SHA-256 syscall when compiled for the zkvm target.
sha2 = { version = "0.10", default-features = false }

# BN254 Poseidon2 (software): same ark crates as Nexus guest.
# This will be slow on rv32im but gives apples-to-apples comparison.
ark-ff = { version = "0.5", default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["scalar_field"] }

# ECDSA secp256k1 for signature verification and EC operations.
# k256's sha2 dependency is patched by the workspace [patch] to use RISC Zero's
# native SHA-256 syscall, so ECDSA verification exercises the HW precompile.
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "sha256", "alloc", "arithmetic"] }
