# Finds the commit that broke network tests using binary search.
name: Network Bisect

on:
  workflow_dispatch:
    inputs:
      good_commit:
        description: "Known good commit (tests pass)"
        required: true
        type: string
      bad_commit:
        description: "Known bad commit (tests fail)"
        required: true
        type: string

jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bisect
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NO_SPOT: 1
        run: |
          good="${{ inputs.good_commit }}" bad="${{ inputs.bad_commit }}"
          namespace="bisect-${{ github.run_id }}"

          for step in {1..5}; do
            mapfile -t commits < <(git rev-list --ancestry-path "$good".."$bad" | tac)
            n=${#commits[@]}

            if ((n == 0)); then echo "::error::No commits between good and bad"; exit 1; fi
            if ((n == 1)); then
              echo "::notice::CULPRIT: ${commits[0]}"
              git log -1 --oneline "${commits[0]}"
              if [[ -n "${SLACK_BOT_TOKEN:-}" ]]; then
                subj=$(git log -1 --format="%s" "${commits[0]}" | head -c 80)
                curl -sX POST https://slack.com/api/chat.postMessage \
                  -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-type: application/json" \
                  -d "{\"channel\":\"#alerts-next-scenario\",\"text\":\"Bisect: ${commits[0]:0:7} - $subj\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
              fi
              exit 0
            fi

            mid="${commits[$((n/2))]}"
            echo "::group::Step $step: ${mid:0:7} ($n commits)"
            git checkout "$mid"
            if ./.github/ci3.sh network-deploy next-scenario "$namespace"; then
              good="$mid"; echo "PASS"
            else
              bad="$mid"; echo "FAIL"
            fi
            ./.github/ci3.sh network-teardown next-scenario "$namespace" || true
            echo "::endgroup::"
          done

          echo "::warning::Incomplete after 5 steps (good=${good:0:7} bad=${bad:0:7})"
