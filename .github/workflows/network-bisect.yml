# Finds the commit that broke network tests via binary search.
name: Network Bisect

on:
  workflow_dispatch:
    inputs:
      good_commit:
        description: "Known good commit"
        required: true
      bad_commit:
        description: "Known bad commit"
        required: true

env:
  NAMESPACE: bisect-${{ github.run_id }}

jobs:
  step-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      done: ${{ steps.run.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run
        id: run
        env: &secrets
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          NO_SPOT: 1
        run: |
          ./spartan/scripts/network_bisect.ts step "${{ inputs.good_commit }}" "${{ inputs.bad_commit }}" "$NAMESPACE" --state=state.json | tee out.txt
          grep "^done=" out.txt >> $GITHUB_OUTPUT || echo "done=false" >> $GITHUB_OUTPUT
          grep "^culprit=" out.txt >> $GITHUB_OUTPUT || true
      - uses: actions/upload-artifact@v4
        with: { name: state-1, path: state.json, if-no-files-found: ignore }

  step-2:
    needs: step-1
    if: needs.step-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      done: ${{ steps.run.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: state-1 }
      - name: Run
        id: run
        env: *secrets
        run: |
          ./spartan/scripts/network_bisect.ts step "${{ inputs.good_commit }}" "${{ inputs.bad_commit }}" "$NAMESPACE" --state=state.json | tee out.txt
          grep "^done=" out.txt >> $GITHUB_OUTPUT || echo "done=false" >> $GITHUB_OUTPUT
          grep "^culprit=" out.txt >> $GITHUB_OUTPUT || true
      - uses: actions/upload-artifact@v4
        with: { name: state-2, path: state.json, if-no-files-found: ignore }

  step-3:
    needs: [step-1, step-2]
    if: needs.step-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      done: ${{ steps.run.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: state-2 }
      - name: Run
        id: run
        env: *secrets
        run: |
          ./spartan/scripts/network_bisect.ts step "${{ inputs.good_commit }}" "${{ inputs.bad_commit }}" "$NAMESPACE" --state=state.json | tee out.txt
          grep "^done=" out.txt >> $GITHUB_OUTPUT || echo "done=false" >> $GITHUB_OUTPUT
          grep "^culprit=" out.txt >> $GITHUB_OUTPUT || true
      - uses: actions/upload-artifact@v4
        with: { name: state-3, path: state.json, if-no-files-found: ignore }

  step-4:
    needs: [step-1, step-2, step-3]
    if: needs.step-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      done: ${{ steps.run.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: state-3 }
      - name: Run
        id: run
        env: *secrets
        run: |
          ./spartan/scripts/network_bisect.ts step "${{ inputs.good_commit }}" "${{ inputs.bad_commit }}" "$NAMESPACE" --state=state.json | tee out.txt
          grep "^done=" out.txt >> $GITHUB_OUTPUT || echo "done=false" >> $GITHUB_OUTPUT
          grep "^culprit=" out.txt >> $GITHUB_OUTPUT || true
      - uses: actions/upload-artifact@v4
        with: { name: state-4, path: state.json, if-no-files-found: ignore }

  step-5:
    needs: [step-1, step-2, step-3, step-4]
    if: needs.step-4.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      done: ${{ steps.run.outputs.done }}
      culprit: ${{ steps.run.outputs.culprit }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: state-4 }
      - name: Run
        id: run
        env: *secrets
        run: |
          ./spartan/scripts/network_bisect.ts step "${{ inputs.good_commit }}" "${{ inputs.bad_commit }}" "$NAMESPACE" --state=state.json | tee out.txt
          grep "^done=" out.txt >> $GITHUB_OUTPUT || echo "done=false" >> $GITHUB_OUTPUT
          grep "^culprit=" out.txt >> $GITHUB_OUTPUT || true

  report:
    needs: [step-1, step-2, step-3, step-4, step-5]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            culprit="${{ needs.step-1.outputs.culprit }}${{ needs.step-2.outputs.culprit }}${{ needs.step-3.outputs.culprit }}${{ needs.step-4.outputs.culprit }}${{ needs.step-5.outputs.culprit }}"
            [ -n "$culprit" ] && break
          done
          if [ -n "$culprit" ]; then
            echo "CULPRIT: $culprit"
            git log -1 --oneline "$culprit"
            [ -n "$SLACK_BOT_TOKEN" ] && curl -sX POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H "Content-type: application/json" \
              -d "{\"channel\":\"#alerts-next-scenario\",\"text\":\"Bisect: $culprit\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "Bisect incomplete after 5 steps"
          fi
