name: Public V5 PR Body

on:
  workflow_dispatch:

jobs:
  update-public-v5-pr-body:
    name: Update v5 to public-v5 PR body
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout public-v5 workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: public-v5
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Update holding PR body
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BASE_BRANCH: public-v5
          HEAD_BRANCH: v5
        run: ./scripts/merge-train/update-public-v5-pr-body.sh
