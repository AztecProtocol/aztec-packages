name: ClaudeBox

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt / instructions for Claude'
        required: true
        type: string
      link:
        description: 'Context link (e.g., PR URL, issue URL, external reference)'
        required: false
        type: string

jobs:
  claudebox:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.comment.body, '/claudebox')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check write access
        if: github.event_name == 'issue_comment'
        run: |
          ASSOCIATION="${{ github.event.comment.author_association }}"
          echo "Author association: $ASSOCIATION"
          if [[ "$ASSOCIATION" != "OWNER" && "$ASSOCIATION" != "MEMBER" && "$ASSOCIATION" != "COLLABORATOR" ]]; then
            echo "ERROR: User does not have write access (association: $ASSOCIATION)"
            exit 1
          fi
          echo "Access granted."

      - name: Add reaction
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content='eyes' || true

      - name: Parse command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          INPUT_PROMPT: ${{ inputs.prompt || '' }}
          INPUT_LINK: ${{ inputs.link || '' }}
        run: |
          if [ -n "$INPUT_PROMPT" ]; then
            # workflow_dispatch
            PROMPT="$INPUT_PROMPT"
            LINK="$INPUT_LINK"
          else
            # issue_comment: strip /claudebox prefix
            PROMPT=$(printf '%s' "$COMMENT_BODY" | sed 's|^/claudebox[[:space:]]*||')
            LINK=""
          fi

          echo "link=$LINK" >> "$GITHUB_OUTPUT"
          {
            echo "prompt<<PROMPT_EOF"
            echo "$PROMPT"
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed: prompt=${PROMPT:0:120}"

      - name: Post status comment
        id: status_comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          PROMPT_TEXT: ${{ steps.parse.outputs.prompt }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHORT_PROMPT=$(printf '%.120s' "$PROMPT_TEXT")
          BODY="**ClaudeBox**: _${SHORT_PROMPT}_ ... [workflow run]($RUN_URL)"

          COMMENT_ID=$(gh api \
            repos/${{ github.repository }}/issues/$ISSUE_NUM/comments \
            -f body="$BODY" \
            --jq '.id')
          echo "run_comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Posted status comment: $COMMENT_ID"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLAUDEBOX_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<SSHEOF
          Host claudebox-jump
            HostName ${{ vars.CLAUDEBOX_JUMP_HOST }}
            User ${{ vars.CLAUDEBOX_JUMP_USER }}
            StrictHostKeyChecking no

          Host claudebox
            HostName ${{ vars.CLAUDEBOX_HOST }}
            User ${{ vars.CLAUDEBOX_USER }}
            ProxyJump claudebox-jump
            StrictHostKeyChecking no
          SSHEOF

      - name: Run ClaudeBox
        timeout-minutes: 120
        env:
          CLAUDEBOX_PROMPT: ${{ steps.parse.outputs.prompt }}
          CLAUDEBOX_LINK: ${{ steps.parse.outputs.link }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          RUN_COMMENT_ID: ${{ steps.status_comment.outputs.run_comment_id || '' }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHOR: ${{ github.event.comment.user.login || github.actor }}
        run: |
          # Build flags array
          FLAGS=("--user=${AUTHOR}")
          [ -n "$COMMENT_ID" ] && FLAGS+=("--comment-id=${COMMENT_ID}")
          [ -n "$RUN_COMMENT_ID" ] && FLAGS+=("--run-comment-id=${RUN_COMMENT_ID}")
          [ -n "$REPO" ] && FLAGS+=("--repo=${REPO}")
          [ -n "$RUN_URL" ] && FLAGS+=("--run-url=${RUN_URL}")
          [ -n "$CLAUDEBOX_LINK" ] && FLAGS+=("--link=${CLAUDEBOX_LINK}")

          # Build a properly quoted remote command
          REMOTE_CMD="~/claudeentry.sh"
          for flag in "${FLAGS[@]}"; do
            REMOTE_CMD="$REMOTE_CMD '${flag}'"
          done

          printf '%s' "$CLAUDEBOX_PROMPT" | \
            ssh -o ConnectTimeout=10 -o ServerAliveInterval=30 \
              claudebox \
              "$REMOTE_CMD"
