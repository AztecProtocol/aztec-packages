name: Create Release Branch

# Derive the current version from git tags on `next`,
# create a release branch for it, then tag `next` with the next major version.

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Source commit SHA from next branch"
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.source_commit }}
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "AztecBot"
          git config --global user.email "tech@aztecprotocol.com"

      - name: Create release branch
        run: |
          # Derive the current version from the latest reachable version tag
          git fetch --tags --quiet
          CURRENT_VERSION=$(git describe --tags --match 'v[0-9]*' --abbrev=0 | sed 's/^v//; s/-.*//')
          echo "Current version: $CURRENT_VERSION"

          # grab major version
          CURRENT_MAJOR_VERSION="${CURRENT_VERSION%%.*}"

          # create branch name
          BRANCH_NAME="v${CURRENT_MAJOR_VERSION}"

          # Check if branch already exists
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Error: Branch $BRANCH_NAME already exists"
            exit 1
          fi

          # Create and push the branch
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"

          # Tag next with the next major version so nightly tags pick it up
          NEXT_MAJOR_VERSION=$((CURRENT_MAJOR_VERSION + 1))
          NEXT_VERSION="${NEXT_MAJOR_VERSION}.0.0"

          git fetch origin next
          git checkout -B next origin/next
          git tag -a "v${NEXT_VERSION}" -m "chore(release): bump next to v${NEXT_VERSION}"
          git push origin "v${NEXT_VERSION}"
