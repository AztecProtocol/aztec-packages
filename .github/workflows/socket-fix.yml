# Automated dependency vulnerability fixes via Socket.dev CLI.
# Runs on EC2 via ci3 infrastructure where yarn install works (submodules + toolchains present).
#
# Run locally with: scripts/socket-fix.sh --dry-run --severity high
#                   scripts/socket-fix.sh --severity critical --workspaces "l1-contracts"
name: Socket Fix Dependencies

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to fix (critical, high, medium, low)"
        required: false
        default: "high"
        type: choice
        options:
          - critical
          - high
          - medium
          - low

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  socket-fix:
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: next
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
      - name: Check out the ci3 submodule
        # Only the ci3 submodule: `submodules: true` would also clone noir-repo and the contract
        # libraries. The others are marked update = none in this checkout, so `bootstrap.sh init`, which
        # every script that sources ci3 runs, leaves them out too. A no-op on refs from before ci3 became
        # a submodule.
        run: if [ "$(git ls-files -s ci3 | cut -c1-6)" = 160000 ]; then git submodule update --init --depth 1 ci3 && git config -f .gitmodules --name-only --get-regexp '\.path$' | sed 's/\.path$/.update/' | grep -vx submodule.ci3.update | xargs -I{} git config {} none; fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: socket-fix-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: exec ./.github/ci3.sh socket-fix ${{ inputs.severity || 'high' }}
