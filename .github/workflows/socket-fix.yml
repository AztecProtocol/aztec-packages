# Automated dependency vulnerability fixes via Socket.dev CLI.
# Runs on EC2 via ci3 infrastructure where yarn install works (submodules + toolchains present).
#
# Run locally with: scripts/socket-fix.sh --dry-run --severity high
#                   scripts/socket-fix.sh --severity critical --workspaces "yarn-project"
name: Socket Fix Dependencies

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to fix (critical, high, medium, low)"
        required: false
        default: "critical"
        type: choice
        options:
          - critical
          - high
          - medium
          - low

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  socket-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: next
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}

      - name: Run
        env:
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./.github/ci3.sh socket-fix ${{ inputs.severity || 'critical' }}
