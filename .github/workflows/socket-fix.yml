# Automated dependency vulnerability fixes via Socket.dev CLI.
# Runs .github/scripts/socket-fix.sh to discover, filter by severity, and fix
# one vuln at a time (commit per GHSA, reset on failure). Then pushes and opens a PR.
#
# Run locally with: .github/scripts/socket-fix.sh --dry-run --severity high
#                   .github/scripts/socket-fix.sh --severity critical --workspaces "yarn-project"
name: Socket Fix Dependencies

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      severity:
        description: "Minimum severity to fix (critical, high, medium, low)"
        required: false
        default: "critical"
        type: choice
        options:
          - critical
          - high
          - medium
          - low

permissions:
  contents: write
  pull-requests: write

jobs:
  socket-fix:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: chore/socket-fix-updates
      SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
      GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: next
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Configure git
        run: |
          git config --global user.name AztecBot
          git config --global user.email tech@aztecprotocol.com

      - name: Install Socket CLI
        run: npm install -g socket

      - name: Create branch
        run: git checkout -B "$BRANCH_NAME"

      - name: Run socket-fix script
        id: fix
        run: |
          SEVERITY="${{ inputs.severity || 'critical' }}"
          .github/scripts/socket-fix.sh --severity "$SEVERITY" --workspaces "yarn-project"

      - name: Push branch
        if: steps.fix.outputs.commit_count != '0'
        run: git push -f origin "$BRANCH_NAME"

      - name: Check for existing PR
        if: steps.fix.outputs.commit_count != '0'
        id: check_pr
        run: |
          PR_URL=$(gh pr list --repo ${{ github.repository }} --head "$BRANCH_NAME" --state open --json url --jq '.[0].url')
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.fix.outputs.commit_count != '0'
        id: pr
        run: |
          SEVERITY="${{ inputs.severity || 'critical' }}"
          DATE=$(date -u +%Y-%m-%d)
          PR_TITLE="fix(deps): $SEVERITY dependency vulnerabilities ($DATE)"

          PR_BODY=$(cat <<'EOF'
          ## Socket Fix: Dependency Updates

          | Metric | Count |
          |--------|-------|
          | Total vulns found | __TOTAL_FOUND__ |
          | Qualifying (>= __SEVERITY_LEVEL__) | __QUALIFYING_COUNT__ |
          | Fixed | __COMMIT_COUNT__ |
          | Remaining | __REMAINING_COUNT__ |

          ### Fixed
          __FIXED_LIST__

          ### Failed (could not apply)
          __FAILED_LIST__

          ### Skipped (below threshold)
          __SKIPPED_LIST__

          ---
          *Auto-generated by [socket-fix workflow](https://github.com/__REPO__/actions/workflows/socket-fix.yml).
          Each commit addresses a single advisory (GHSA) for easy review and revert.*
          EOF
          )

          PR_BODY="${PR_BODY//__TOTAL_FOUND__/${{ steps.fix.outputs.total_found }}}"
          PR_BODY="${PR_BODY//__SEVERITY_LEVEL__/$SEVERITY}"
          PR_BODY="${PR_BODY//__QUALIFYING_COUNT__/${{ steps.fix.outputs.qualifying_count }}}"
          PR_BODY="${PR_BODY//__COMMIT_COUNT__/${{ steps.fix.outputs.commit_count }}}"
          PR_BODY="${PR_BODY//__REMAINING_COUNT__/${{ steps.fix.outputs.remaining_count }}}"
          PR_BODY="${PR_BODY//__FIXED_LIST__/${{ steps.fix.outputs.fixed }}}"
          PR_BODY="${PR_BODY//__FAILED_LIST__/${{ steps.fix.outputs.failed }}}"
          PR_BODY="${PR_BODY//__SKIPPED_LIST__/${{ steps.fix.outputs.skipped }}}"
          PR_BODY="${PR_BODY//__REPO__/${{ github.repository }}}"

          if [[ -z "${{ steps.check_pr.outputs.pr_url }}" ]]; then
            PR_URL=$(gh pr create \
              --repo ${{ github.repository }} \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --base next \
              --head "$BRANCH_NAME" \
              2>&1 | tail -1)
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            PR_URL="${{ steps.check_pr.outputs.pr_url }}"
            echo "Updating existing PR: $PR_URL"
            gh pr edit "$PR_URL" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        if: >-
          steps.fix.outcome == 'success' &&
          (steps.fix.outputs.commit_count != '0' || steps.fix.outputs.remaining_count != '0')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "SLACK_BOT_TOKEN not set, skipping notification"
            exit 0
          fi

          SEVERITY="${{ inputs.severity || 'critical' }}"
          COMMIT_COUNT="${{ steps.fix.outputs.commit_count }}"
          REMAINING="${{ steps.fix.outputs.remaining_count }}"
          FAILED="${{ steps.fix.outputs.failed }}"
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          LINKS="<${WORKFLOW_URL}|View Run>"
          if [ -n "$PR_URL" ]; then
            LINKS="<${PR_URL}|View PR> | ${LINKS}"
          fi

          if [ "$REMAINING" = "0" ]; then
            TEXT="✅ Socket Fix: Fixed ${COMMIT_COUNT} ${SEVERITY} dependency vulnerabilities
          • ${LINKS}"
          elif [ "$COMMIT_COUNT" != "0" ]; then
            TEXT="⚠️ Socket Fix: Fixed ${COMMIT_COUNT} ${SEVERITY} dependency vulnerabilities, ${REMAINING} could not be auto-fixed
          • Failed: ${FAILED}
          • ${LINKS}"
          else
            TEXT="❌ Socket Fix: ${REMAINING} ${SEVERITY} dependency vulnerabilities could not be auto-fixed
          • Failed: ${FAILED}
          • ${LINKS}"
          fi

          data=$(jq -n --arg channel "#team-alpha" --arg text "$TEXT" '{channel: $channel, text: $text}')

          curl -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            --data "$data"

      - name: No vulnerabilities found
        if: steps.fix.outputs.commit_count == '0'
        run: echo "No dependency vulnerabilities at or above the severity threshold, or all fixes failed. No PR created."
