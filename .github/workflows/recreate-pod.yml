name: Recreate Red Team Pod

on:
  workflow_dispatch:
    inputs:
      pod_name:
        description: "Name of the pod to recreate"
        required: true
        type: string
      image_name:
        description: "Docker image to use (optional, if not set, reuses existing image)"
        required: false
        type: string

jobs:
  recreate-pod:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: stg-public-redteam
      CLUSTER_NAME: aztec-gke-private
      REGION: us-west1-a

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a

      - name: Install GKE Auth Plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure kubectl with GKE cluster
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} --region ${{ env.REGION }}

      - name: Recreate pod with fresh image pull
        run: |
          echo "Recreating pod: ${{ inputs.pod_name }} in namespace: ${{ env.NAMESPACE }}"

          # Get the pod definition
          kubectl get pod ${{ inputs.pod_name }} -n ${{ env.NAMESPACE }} -o yaml > /tmp/pod.yaml

          # Delete the pod
          kubectl delete pod ${{ inputs.pod_name }} -n ${{ env.NAMESPACE }}

          # Wait for deletion to complete
          kubectl wait --for=delete pod/${{ inputs.pod_name }} -n ${{ env.NAMESPACE }} --timeout=60s || true

          # Remove status and other runtime fields, set imagePullPolicy to Always
          # Optionally override image if provided
          POD_YAML=$(cat /tmp/pod.yaml | \
            grep -v '^\s*status:' | \
            grep -v '^\s*uid:' | \
            grep -v '^\s*resourceVersion:' | \
            grep -v '^\s*creationTimestamp:' | \
            sed 's/imagePullPolicy:.*/imagePullPolicy: Always/')

          if [ -n "${{ inputs.image_name }}" ]; then
            echo "Overriding image to: ${{ inputs.image_name }}"
            POD_YAML=$(echo "$POD_YAML" | sed -E "s|image: .+|image: ${{ inputs.image_name }}|")
          fi

          kubectl apply -f - <<EOF
          $POD_YAML
          EOF

          echo "Pod recreated with imagePullPolicy: Always"
          [ -n "${{ inputs.image_name }}" ] && echo "Using image: ${{ inputs.image_name }}" || echo "Using original image"
