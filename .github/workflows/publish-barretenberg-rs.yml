name: Publish barretenberg-rs Libraries

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g., 0.1.0)
        required: true
      publish_release:
        description: Publish release to GitHub
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld

      - name: Build libbb-external.a
        working-directory: barretenberg/cpp
        run: |
          cmake --preset clang16 -DAVM=OFF
          cmake --build --preset clang16 --target bb-external -j$(nproc)

      - name: Package artifact
        run: |
          mkdir -p dist
          cp barretenberg/cpp/build/lib/libbb-external.a dist/
          tar -czvf barretenberg-rs-x86_64-unknown-linux-gnu.tar.gz -C dist libbb-external.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: barretenberg-rs-x86_64-unknown-linux-gnu
          path: barretenberg-rs-x86_64-unknown-linux-gnu.tar.gz
          retention-days: 7

  build-macos:
    name: Build macOS
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          brew install cmake ninja llvm@18

      - name: Build libbb-external.a
        working-directory: barretenberg/cpp
        run: |
          cmake --preset homebrew -DAVM=OFF
          cmake --build --preset homebrew --target bb-external -j$(sysctl -n hw.ncpu)

      - name: Package artifact
        run: |
          mkdir -p dist
          cp barretenberg/cpp/build/lib/libbb-external.a dist/
          tar -czvf barretenberg-rs-${{ matrix.target }}.tar.gz -C dist libbb-external.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: barretenberg-rs-${{ matrix.target }}
          path: barretenberg-rs-${{ matrix.target }}.tar.gz
          retention-days: 7

  build-ios:
    name: Build iOS
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - target: aarch64-apple-ios
            platform: OS64
          - target: aarch64-apple-ios-sim
            platform: SIMULATORARM64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          brew install cmake ninja

      - name: Download iOS toolchain
        run: |
          curl -fsSL -o ios.toolchain.cmake https://raw.githubusercontent.com/nicoroulet/ios-cmake/master/ios.toolchain.cmake

      - name: Build libbb-external.a
        working-directory: barretenberg/cpp
        run: |
          cmake -B build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../../ios.toolchain.cmake \
            -DPLATFORM=${{ matrix.platform }} \
            -DDEPLOYMENT_TARGET=15.0 \
            -DAVM=OFF \
            -DMOBILE=ON
          cmake --build build-ios --target bb-external -j$(sysctl -n hw.ncpu)

      - name: Package artifact
        run: |
          mkdir -p dist
          cp barretenberg/cpp/build-ios/lib/libbb-external.a dist/
          tar -czvf barretenberg-rs-${{ matrix.target }}.tar.gz -C dist libbb-external.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: barretenberg-rs-${{ matrix.target }}
          path: barretenberg-rs-${{ matrix.target }}.tar.gz
          retention-days: 7

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 9477386

      - name: Build libbb-external.a
        working-directory: barretenberg/cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          sdkmanager --install "ndk;26.1.10909125"

          cmake -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DAVM=OFF \
            -DMOBILE=ON
          cmake --build build-android --target bb-external -j$(nproc)

      - name: Package artifact
        run: |
          mkdir -p dist
          cp barretenberg/cpp/build-android/lib/libbb-external.a dist/
          tar -czvf barretenberg-rs-${{ matrix.target }}.tar.gz -C dist libbb-external.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: barretenberg-rs-${{ matrix.target }}
          path: barretenberg-rs-${{ matrix.target }}.tar.gz
          retention-days: 7

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_release }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: barretenberg-rs-v${{ inputs.version }}
          name: barretenberg-rs v${{ inputs.version }}
          body: |
            Pre-built static libraries for barretenberg-rs FFI backend.

            ## Supported Targets
            - `x86_64-unknown-linux-gnu`
            - `x86_64-apple-darwin`
            - `aarch64-apple-darwin`
            - `aarch64-apple-ios`
            - `aarch64-apple-ios-sim`
            - `aarch64-linux-android`
            - `x86_64-linux-android`

            ## Usage
            These libraries are automatically downloaded by `barretenberg-rs` when using the `ffi` feature.
            You can also manually set `BB_LIB_DIR` to point to a directory containing `libbb-external.a`.
          files: release/*.tar.gz
          fail_on_unmatched_files: true
