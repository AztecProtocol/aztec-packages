# Runs `build-images/bootstrap.sh deploy` for a branch: builds the CI build images (aztecprotocol/build,
# devbox, sysbox) on EC2 for amd64 and arm64, pushes them and the multi-arch manifests to Docker Hub,
# bakes new CI AMIs, and commits the new ci3/aws/ami_id_* back to that branch. Dispatch on next only:
#   gh workflow run publish-build-images.yml --ref next -f branch=<branch>
# The branch's own scripts run with the Docker Hub credentials and the CI AWS role, so only dispatch
# for a branch whose build-images/ and ci3/ changes have been reviewed.
# Existing tags are never overwritten unless allow_overwrite is set: CI AMIs cache the images by tag,
# so a replaced tag would not reach hosts that already have it. mode=amis-only re-bakes the AMIs for
# an already published tag (e.g. after the AMI step failed).
name: Publish build images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from and to commit the new AMI ids to"
        required: true
        type: string
      mode:
        description: "deploy: images + manifests + AMIs. amis-only: AMIs for an already published tag."
        required: true
        type: choice
        options:
          - deploy
          - amis-only
        default: deploy
      allow_overwrite:
        description: "Allow replacing a tag that already exists on Docker Hub (deploy mode)"
        required: false
        type: boolean
        default: false

permissions: {}

# Tags and AMI ids are shared state; never run two publishes at once.
concurrency:
  group: publish-build-images
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve branch
        id: sha
        env:
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format --branch "$BRANCH" >/dev/null; then
            echo "::error::Invalid branch name: $BRANCH"
            exit 1
          fi
          sha=$(git ls-remote "https://github.com/$REPO" "refs/heads/$BRANCH" | cut -f1)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Branch $BRANCH not found"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          path: src-ref
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            build-images
            ci3/aws

      - name: Read image tag
        id: tag
        run: |
          tag=$(sed -n 's/^version="\(.*\)"$/\1/p' src-ref/build-images/bootstrap.sh)
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exactly one version=\"X.Y\" line in build-images/bootstrap.sh, got: $tag"
            exit 1
          fi
          # ami_update.sh hardcodes the tags it caches in the AMI; they must match the published version.
          ami_tags=$(grep -oE 'aztecprotocol/(build|devbox):[^ "\\]+' src-ref/ci3/aws/ami_update.sh | cut -d: -f2 | sort -u)
          if [ "$ami_tags" != "$tag" ]; then
            echo "::error::ci3/aws/ami_update.sh caches tag(s) '$ami_tags' but build-images/bootstrap.sh has version $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ inputs.mode }}
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        run: |
          existing=()
          missing=()
          for target in build devbox sysbox; do
            for tag in "$TAG" "$TAG-amd64" "$TAG-arm64"; do
              status=$(curl -sS -o /dev/null -w '%{http_code}' \
                "https://hub.docker.com/v2/namespaces/aztecprotocol/repositories/$target/tags/$tag")
              case "$status" in
                200) existing+=("aztecprotocol/$target:$tag") ;;
                404) missing+=("aztecprotocol/$target:$tag") ;;
                *) echo "::error::Docker Hub returned HTTP $status for aztecprotocol/$target:$tag"; exit 1 ;;
              esac
            done
          done
          if [ "$MODE" = "amis-only" ]; then
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::amis-only needs published images, missing: ${missing[*]}"
              exit 1
            fi
          elif [ ${#existing[@]} -gt 0 ]; then
            if [ "$ALLOW_OVERWRITE" = "true" ]; then
              echo "::warning::Overwriting existing tags: ${existing[*]}"
            else
              echo "::error::Tags already exist on Docker Hub: ${existing[*]}. Bump version in build-images/bootstrap.sh, or set allow_overwrite."
              exit 1
            fi
          fi

      - name: Summary
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ steps.sha.outputs.sha }}
          TAG: ${{ steps.tag.outputs.tag }}
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo "### Build images ($MODE)"
            echo "Branch: \`$BRANCH\` at \`$SHA\`"
            echo
            for target in build devbox sysbox; do
              echo "- \`aztecprotocol/$target:$TAG\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: master
    # Matches the AWS session below; the EC2 helpers cannot clean up after the credentials expire.
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: publish-build-images-${{ github.run_id }}
          role-duration-seconds: 7200

      # The build and AMI scripts drive their instances over SSH (ci3/aws/build_instance_ssh_config).
      - name: Configure SSH key
        env:
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$BUILD_INSTANCE_SSH_KEY" | base64 --decode > ~/.ssh/build_instance_key
          chmod 600 ~/.ssh/build_instance_key

      - name: Deploy images and AMIs
        if: inputs.mode == 'deploy'
        env:
          BRANCH: ${{ inputs.branch }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          CI3_INSTANCE_PROFILE_NAME: ${{ secrets.CI3_INSTANCE_PROFILE_NAME }}
          AWS_SHUTDOWN_TIME: 90
        run: ./build-images/bootstrap.sh deploy

      - name: Update AMIs
        if: inputs.mode == 'amis-only'
        env:
          BRANCH: ${{ inputs.branch }}
          CI3_INSTANCE_PROFILE_NAME: ${{ secrets.CI3_INSTANCE_PROFILE_NAME }}
          AWS_SHUTDOWN_TIME: 90
        run: ./build-images/bootstrap.sh update_amis

      # Uploaded even on failure so a baked AMI is not lost when its sibling arch fails.
      - name: Upload AMI ids
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ami-ids
          path: |
            ci3/aws/ami_id_amd64
            ci3/aws/ami_id_arm64
          if-no-files-found: ignore

  # Separate from deploy so the bot token never shares a job with the target branch's scripts.
  commit-amis:
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download AMI ids
        uses: actions/download-artifact@v4
        with:
          name: ami-ids
          path: ami-ids

      - name: Validate AMI ids
        run: |
          for arch in amd64 arm64; do
            id=$(cat "ami-ids/ami_id_$arch")
            if [[ ! "$id" =~ ^ami-[0-9a-f]{8,17}$ ]]; then
              echo "::error::Invalid AMI id for $arch: $id"
              exit 1
            fi
            echo "- $arch: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: src-ref
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ci3/aws

      # A plain (non-force) push from the resolved commit is rejected if the branch moved meanwhile;
      # the AMI ids stay in the run's artifact and summary to commit by hand.
      - name: Commit and push AMI ids
        working-directory: src-ref
        env:
          BRANCH: ${{ inputs.branch }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cp ../ami-ids/ami_id_amd64 ../ami-ids/ami_id_arm64 ci3/aws/
          if git diff --quiet -- ci3/aws; then
            echo "AMI ids unchanged."
            exit 0
          fi
          git -c user.name=AztecBot -c user.email=tech@aztecprotocol.com \
            commit -m "chore: update CI AMIs for build image $TAG" -- ci3/aws/ami_id_amd64 ci3/aws/ami_id_arm64
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}" "HEAD:refs/heads/$BRANCH"
