name: Create Devnet

# Create a devnet branch from a nightly build.
# The branch push triggers devnet-deploys.yml, which handles
# tagging, CI3 builds, and deployment automatically.

on:
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Nightly tag to base devnet on (e.g., v4.0.0-nightly.20260209)"
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

concurrency:
  group: create-devnet
  cancel-in-progress: false

jobs:
  create-devnet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout at nightly tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.nightly_tag }}
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create devnet branch
        id: version
        run: spartan/scripts/create_devnet.ts "${{ inputs.nightly_tag }}"

      - name: Step summary
        run: |
          {
            echo "## Devnet Created"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Source nightly tag | \`${{ inputs.nightly_tag }}\` |"
            echo "| Devnet branch | \`${{ steps.version.outputs.branch }}\` |"
            echo "| Namespace | \`${{ steps.version.outputs.namespace }}\` |"
            echo ""
            echo "### What Happens Next"
            echo ""
            echo "The push to branch \`${{ steps.version.outputs.branch }}\` will automatically trigger:"
            echo "1. **Tag creation** — \`devnet-deploys.yml\` creates a patch tag"
            echo "2. **CI3 build** — Docker images are built from the tag"
            echo "3. **Deployment** — Network is deployed to namespace \`${{ steps.version.outputs.namespace }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
