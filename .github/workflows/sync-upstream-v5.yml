# Sync public-v5 to upstream v5 while preserving private automation.
#
# Uses AZTEC_BOT_GITHUB_TOKEN (PAT) because GITHUB_TOKEN cannot push
# commits that modify .github/workflows/ files.
name: Sync Upstream V5

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync public-v5
    runs-on: ubuntu-latest
    concurrency:
      group: sync-public-v5
      cancel-in-progress: false
    steps:
      - name: Checkout public-v5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: public-v5
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "AztecBot"
          git config user.email "tech@aztecprotocol.com"

      - name: Sync public-v5 with upstream
        run: ./scripts/merge-train/sync-public-v5.sh
