name: Nightly Spartan Benchmarks

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Nightly tag to use (e.g., 2.3.4-nightly.20251209). Leave empty to auto-detect."
        required: false
        type: string

concurrency:
  group: nightly-spartan-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-image:
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    outputs:
      nightly_tag: ${{ steps.nightly-tag.outputs.nightly_tag }}
      docker_image: ${{ steps.nightly-tag.outputs.docker_image }}
      source_ref: ${{ steps.nightly-tag.outputs.source_ref }}
      use_internal_docker_registry: ${{ steps.nightly-tag.outputs.use_internal_docker_registry }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.repository == 'AztecProtocol/aztec-packages-private' && github.event_name == 'schedule' && 'v5-next' || 'next' }}

      - name: Determine nightly tag
        id: nightly-tag
        run: |
          USE_INTERNAL_DOCKER_REGISTRY="${{ github.repository == 'AztecProtocol/aztec-packages-private' && 'true' || 'false' }}"

          if [[ -n "${{ inputs.nightly_tag }}" ]]; then
            nightly_tag="${{ inputs.nightly_tag }}"
          else
            current_version=$(jq -r '."."' .release-please-manifest.json)
            nightly_tag="${current_version}-nightly.$(date -u +%Y%m%d)"
          fi

          source_ref="v${nightly_tag}"

          if [[ "$USE_INTERNAL_DOCKER_REGISTRY" == "true" ]]; then
            docker_image=""
            image_label="internal/aztec:${nightly_tag}"
          else
            docker_image="aztecprotocol/aztec:${nightly_tag}"
            image_label="$docker_image"
          fi

          echo "nightly_tag=$nightly_tag" >> "$GITHUB_OUTPUT"
          echo "docker_image=$docker_image" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "use_internal_docker_registry=$USE_INTERNAL_DOCKER_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "Using nightly tag: $nightly_tag"
          echo "Using image: $image_label"
          echo "Using source ref: $source_ref"

      - name: Verify source git ref
        run: |
          set -euo pipefail
          source_ref="${{ steps.nightly-tag.outputs.source_ref }}"
          git fetch --depth 1 origin "refs/tags/${source_ref}:refs/tags/${source_ref}"
          source_sha=$(git rev-parse "${source_ref}^{}")
          echo "Nightly source commit: $source_sha"

      - name: Check if Docker image exists
        if: steps.nightly-tag.outputs.use_internal_docker_registry != 'true'
        run: |
          DOCKER_IMAGE="${{ steps.nightly-tag.outputs.docker_image }}"
          echo "Checking if Docker image exists: $DOCKER_IMAGE"
          if docker manifest inspect "$DOCKER_IMAGE" > /dev/null 2>&1; then
            echo "Docker image exists: $DOCKER_IMAGE"
          else
            echo "Docker image does not exist: $DOCKER_IMAGE"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # TPS benchmark (env tps-scenario, namespace nightly-bench)
  # ---------------------------------------------------------------------------
  deploy-bench-network:
    needs: select-image
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: tps-scenario
      namespace: nightly-bench
      semver: ${{ needs.select-image.outputs.nightly_tag }}
      ref: ${{ needs.select-image.outputs.source_ref }}
      use_internal_docker_registry: ${{ needs.select-image.outputs.use_internal_docker_registry == 'true' }}
      skip_notify_on_failure: true
    secrets: inherit

  wait-bench-l2-block:
    needs:
      - select-image
      - deploy-bench-network
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Wait for first L2 block
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NAMESPACE: nightly-bench
        run: |
          cd spartan
          ./bootstrap.sh wait_for_l2_block tps-scenario

  benchmark:
    needs:
      - select-image
      - wait-bench-l2-block
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Run benchmarks
        timeout-minutes: 240
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 240
          NO_SPOT: 1
          SKIP_NETWORK_DEPLOY: "1"
        run: |
          # Pass the arguments expected in ./bootstrap.sh ci-network-bench
          ./.github/ci3.sh network-bench tps-scenario nightly-bench "${{ needs.select-image.outputs.docker_image }}"

      - name: Download benchmarks
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if ./ci.sh gh-spartan-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> "$GITHUB_ENV"
          fi

      - name: Upload benchmarks
        if: always() && env.ENABLE_DEPLOY_BENCH == '1'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Spartan
          benchmark-data-dir-path: "bench/next"
          tool: "customSmallerIsBetter"
          output-file-path: ./bench-out/bench.json
          gh-repository: github.com/AztecProtocol/benchmark-page-data
          github-token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          auto-push: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          alert-threshold: "120%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 100

  cleanup-bench:
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-bench-network
      - wait-bench-l2-block
      - benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Cleanup network resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: ./.github/ci3.sh network-teardown tps-scenario nightly-bench

  notify-bench-failure:
    if: ${{ always() && failure() && github.event_name != 'workflow_dispatch' && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-bench-network
      - wait-bench-l2-block
      - benchmark
      - cleanup-bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          export CI=1
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify \
            "Nightly Spartan TPS benchmarks PASSED (nightly tag ${TAG}) :white_check_mark: <${RUN_URL}|View Run>" \
            "#alerts-next-scenario"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Nightly Spartan Benchmarks FAILED (nightly tag ${TAG}): <${RUN_URL}|View Run> (🤖)" \
            "Nightly Spartan benchmarks failed (nightly tag ${TAG}). CI run: ${RUN_URL}. Investigate the benchmark failure and identify the root cause." \
            --link "$RUN_URL"

  # ---------------------------------------------------------------------------
  # Proving benchmark (env prove-n-tps-fake, namespace prove-n-tps-fake)
  # ---------------------------------------------------------------------------
  deploy-proving-network:
    needs: select-image
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: prove-n-tps-fake
      namespace: prove-n-tps-fake
      semver: ${{ needs.select-image.outputs.nightly_tag }}
      ref: ${{ needs.select-image.outputs.source_ref }}
      use_internal_docker_registry: ${{ needs.select-image.outputs.use_internal_docker_registry == 'true' }}
      skip_notify_on_failure: true
    secrets: inherit

  wait-proving-l2-block:
    needs:
      - select-image
      - deploy-proving-network
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Wait for first L2 block
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NAMESPACE: prove-n-tps-fake
        run: |
          cd spartan
          ./bootstrap.sh wait_for_l2_block prove-n-tps-fake

  proving-benchmark:
    needs:
      - select-image
      - wait-proving-l2-block
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Run proving benchmarks
        timeout-minutes: 180
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 180
          NO_SPOT: 1
          SKIP_NETWORK_DEPLOY: "1"
        run: |
          ./.github/ci3.sh network-proving-bench prove-n-tps-fake prove-n-tps-fake "${{ needs.select-image.outputs.docker_image }}"

      - name: Download benchmarks
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if ./ci.sh gh-spartan-proving-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> "$GITHUB_ENV"
          fi

      - name: Upload benchmarks
        if: always() && env.ENABLE_DEPLOY_BENCH == '1'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Spartan
          benchmark-data-dir-path: "bench/next"
          tool: "customSmallerIsBetter"
          output-file-path: ./bench-out/bench.json
          github-token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          gh-repository: github.com/AztecProtocol/benchmark-page-data
          auto-push: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          alert-threshold: "120%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 100

  cleanup-proving:
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-proving-network
      - wait-proving-l2-block
      - proving-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Cleanup network resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: ./.github/ci3.sh network-teardown prove-n-tps-fake prove-n-tps-fake

  notify-proving-failure:
    if: ${{ always() && failure() && github.event_name != 'workflow_dispatch' && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-proving-network
      - wait-proving-l2-block
      - proving-benchmark
      - cleanup-proving
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          export CI=1
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify \
            "Nightly proving benchmarks passed (nightly tag ${TAG}) :white_check_mark: <${RUN_URL}|View Run>" \
            "#alerts-next-scenario"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Nightly Proving Benchmarks FAILED (nightly tag ${TAG}): <${RUN_URL}|View Run> (🤖)" \
            "Nightly proving benchmarks failed (nightly tag ${TAG}). CI run: ${RUN_URL}. Investigate the benchmark failure and identify the root cause." \
            --link "$RUN_URL"

  # ---------------------------------------------------------------------------
  # Block capacity benchmark (env block-capacity, namespace nightly-block-capacity)
  # ---------------------------------------------------------------------------
  deploy-block-capacity-network:
    needs: select-image
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: block-capacity
      namespace: nightly-block-capacity
      semver: ${{ needs.select-image.outputs.nightly_tag }}
      ref: ${{ needs.select-image.outputs.source_ref }}
      use_internal_docker_registry: ${{ needs.select-image.outputs.use_internal_docker_registry == 'true' }}
      skip_notify_on_failure: true
    secrets: inherit

  wait-block-capacity-l2-block:
    needs:
      - select-image
      - deploy-block-capacity-network
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Wait for first L2 block
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NAMESPACE: nightly-block-capacity
        run: |
          cd spartan
          ./bootstrap.sh wait_for_l2_block block-capacity

  block-capacity-benchmark:
    needs:
      - select-image
      - wait-block-capacity-l2-block
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Run block capacity benchmarks
        timeout-minutes: 240
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 240
          NO_SPOT: 1
          SKIP_NETWORK_DEPLOY: "1"
        run: |
          ./.github/ci3.sh network-block-capacity-bench block-capacity nightly-block-capacity "${{ needs.select-image.outputs.docker_image }}"

      - name: Download benchmarks
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if ./ci.sh gh-spartan-block-capacity-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> "$GITHUB_ENV"
          fi

      - name: Upload benchmarks
        if: always() && env.ENABLE_DEPLOY_BENCH == '1'
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Spartan
          benchmark-data-dir-path: "bench/next"
          tool: "customSmallerIsBetter"
          output-file-path: ./bench-out/bench.json
          gh-repository: github.com/AztecProtocol/benchmark-page-data
          github-token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          auto-push: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          alert-threshold: "120%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 100

  cleanup-block-capacity:
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-block-capacity-network
      - wait-block-capacity-l2-block
      - block-capacity-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Cleanup network resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: ./.github/ci3.sh network-teardown block-capacity nightly-block-capacity

  notify-block-capacity-failure:
    if: ${{ always() && failure() && github.event_name != 'workflow_dispatch' && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    needs:
      - select-image
      - deploy-block-capacity-network
      - wait-block-capacity-l2-block
      - block-capacity-benchmark
      - cleanup-block-capacity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.select-image.outputs.source_ref }}

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          export CI=1
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify \
            "Nightly block capacity benchmarks passed (nightly tag ${TAG}) :white_check_mark: <${RUN_URL}|View Run>" \
            "#alerts-next-scenario"

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.select-image.outputs.nightly_tag || 'unknown' }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Nightly Block Capacity Benchmarks FAILED (nightly tag ${TAG}): <${RUN_URL}|View Run> (🤖)" \
            "Nightly block capacity benchmarks failed (nightly tag ${TAG}). CI run: ${RUN_URL}. Investigate the benchmark failure and identify the root cause." \
            --link "$RUN_URL"

  status:
    runs-on: ubuntu-latest
    needs: [benchmark, proving-benchmark, block-capacity-benchmark]
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' || github.repository == 'AztecProtocol/aztec-packages-private') }}
    steps:
      - name: Check benchmark results
        run: |
          if [[ "${{ needs.benchmark.result }}" != "success" || "${{ needs.proving-benchmark.result }}" != "success" || "${{ needs.block-capacity-benchmark.result }}" != "success" ]]; then
            echo "One or more benchmark jobs failed"
            echo "benchmark: ${{ needs.benchmark.result }}"
            echo "proving-benchmark: ${{ needs.proving-benchmark.result }}"
            echo "block-capacity-benchmark: ${{ needs.block-capacity-benchmark.result }}"
            exit 1
          fi
          echo "All benchmark jobs succeeded"
