# Dispatches a release from a private fork of aztec-packages.
#
# Strategy: create a commit on the public repo whose .github/ci3.sh
# delegates to the private fork's ci3.sh. When the tag is pushed,
# ci3.yml triggers normally and the private fork handles the release.
name: Release (Fork)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v5.0.0)"
        required: true
      commit:
        description: "Commit SHA from the source repo"
        required: true
      source_repo:
        description: "Source repository (e.g. AztecProtocol/aztec-packages-private)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: master
    steps:
      # We need a workspace. Check out the private fork so the runner
      # has a git repo we can add remotes to.
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.commit }}
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      # Create a commit on a fork-release branch on the public repo.
      # The commit is based on public/next but replaces .github/ci3.sh
      # with a wrapper that clones the private fork and delegates to its ci3.sh.
      # This lets ci3.yml trigger normally on the tag and use the private fork's code.
      - name: Create wrapper commit and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          PRIVATE_COMMIT: ${{ inputs.commit }}
        run: |
          git config user.name "AztecBot"
          git config user.email "tech@aztecprotocol.com"

          # Set up the public repo as a remote.
          git remote add public "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch public next --depth=1

          # Branch off public/next for this release.
          RELEASE_BRANCH="fork-release/${TAG}"
          git checkout -b "$RELEASE_BRANCH" public/next

          # Write a ci3.sh wrapper that clones the private fork and delegates.
          # cd into the clone so ci3.sh and ci.sh resolve from the private fork.
          cat > .github/ci3.sh << 'WRAPPER_EOF'
          #!/usr/bin/env bash
          # Auto-generated by private-fork-release.yml. Do not edit.
          # Delegates to the private fork's ci3.sh so ci3.yml runs the fork's release.
          set -euo pipefail
          tmp=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/PRIVATE_REPO_PLACEHOLDER.git" "$tmp"
          git -C "$tmp" checkout PRIVATE_COMMIT_PLACEHOLDER
          export SOURCE_REPOSITORY="PRIVATE_REPO_PLACEHOLDER"
          cd "$tmp"
          exec "./.github/ci3.sh" "$@"
          WRAPPER_EOF

          sed -i "s|PRIVATE_REPO_PLACEHOLDER|${SOURCE_REPO}|g" .github/ci3.sh
          sed -i "s|PRIVATE_COMMIT_PLACEHOLDER|${PRIVATE_COMMIT}|g" .github/ci3.sh
          chmod +x .github/ci3.sh

          git add .github/ci3.sh
          git commit -m "chore: release ${TAG} from ${SOURCE_REPO}@${PRIVATE_COMMIT}"

          # Push the release branch (not next, so CI doesn't run on the branch).
          git push public "${RELEASE_BRANCH}"

          # Push the tag. AZTEC_BOT_GITHUB_TOKEN has tag-creation bypass permission.
          # ci3.yml will trigger on this tag and run our ci3.sh wrapper.
          git tag -a "${TAG}" -m "${TAG}"
          git push public "refs/tags/${TAG}"
