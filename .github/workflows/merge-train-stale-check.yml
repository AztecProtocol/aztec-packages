name: Merge-Train Stale Check

on:
  schedule:
    # Daily at 09:15 UTC — once per day, off the round-minute mark.
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  spartan:
    name: Check merge-train/spartan
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Run stale check
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: ./ci3/merge_train_stale_check merge-train/spartan '#team-alpha'

  spartan-v5:
    name: Check merge-train/spartan-v5
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Run stale check
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          BASE_BRANCH: v5-next
        run: ./ci3/merge_train_stale_check merge-train/spartan-v5 '#team-alpha'

