name: Nightly Debug Build

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-debug-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  debug-build:
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: next

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: nightly-debug-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Run debug build
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ./.github/ci3.sh barretenberg-debug

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export CI=1
          ./ci3/slack_notify_with_claudebox_kickoff "#honk-team" \
            "Nightly debug build FAILED: <${RUN_URL}|View Run> (🤖)" \
            "Nightly barretenberg debug build failed. CI run: ${RUN_URL}. Investigate the build failure, identify the root cause, and create a fix PR targeting next." \
            --link "$RUN_URL"
