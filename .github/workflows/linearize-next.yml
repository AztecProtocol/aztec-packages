name: Linearize Next Branch

on:
  push:
    branches:
      - next
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to linearize (default: 2000)'
        required: false
        default: '2000'

concurrency:
  group: linearize-next
  cancel-in-progress: true

jobs:
  linearize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: next
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run linearize script
        run: |
          chmod +x scripts/linearize-git-history
          COMMIT_COUNT="${{ github.event.inputs.commit_count || '2000' }}"
          scripts/linearize-git-history "$COMMIT_COUNT"

      - name: Push linearized branch
        run: |
          git push origin next-linear-git:next-linear --force
