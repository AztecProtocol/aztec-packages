name: Public v6 PR Body

on:
  push:
    branches:
      - v6
  workflow_dispatch:

concurrency:
  group: public-v6-pr-body
  cancel-in-progress: true

jobs:
  update-public-v6-pr-body:
    name: Update v6 to public-v6 PR body
    runs-on: ubuntu-latest
    if: github.repository == 'AztecProtocol/aztec-packages-private'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout automation from v6
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v6
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Update holding PR body
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BASE_BRANCH: public-v6
          HEAD_BRANCH: v6
        run: ./scripts/merge-train/update-public-next-pr-body.sh
