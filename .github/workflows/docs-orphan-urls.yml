name: Docs Orphan URL Check

# Catches pages removed without a redirect. Runs on PRs that touch docs/**.
# Compares the committed baseline (docs/snapshots/published-urls.txt) against
# the current build's routes plus netlify.toml redirect rules. Any URL in the
# baseline that no longer resolves and has no matching redirect fails the job.
#
# When a page is intentionally retired, update the snapshot in the same PR
# that adds the redirect.

on:
  pull_request:
    paths:
      - docs/docs-developers/**
      - docs/docs-operate/**
      - docs/docs-participate/**
      - docs/docs/**
      - docs/developer_versioned_docs/**
      - docs/network_versioned_docs/**
      - docs/netlify.toml
      - docs/snapshots/published-urls.txt
      - docs/scripts/check_orphaned_urls.sh
      - .github/workflows/docs-orphan-urls.yml

jobs:
  check-orphans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run orphan URL check
        env:
          FAIL_ON_ORPHAN: "1"
        run: |
          cd docs
          ./scripts/check_orphaned_urls.sh snapshots/published-urls.txt
