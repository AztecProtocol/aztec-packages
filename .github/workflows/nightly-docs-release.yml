name: Nightly Docs Release

on:
  schedule:
    # Run every night at 4:00 AM UTC, after nightly tags are created
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific nightly tag to use (e.g., v3.0.0-nightly.20241201)"
        required: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-nightly-tag:
    name: Check for new nightly tag
    runs-on: ubuntu-latest
    outputs:
      nightly-tag: ${{ steps.get_tag.outputs.tag }}
      should-run: ${{ steps.get_tag.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Get latest nightly tag
        id: get_tag
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            # Manual trigger with specific tag
            NIGHTLY_TAG="${{ github.event.inputs.tag }}"
            echo "Using manual tag: $NIGHTLY_TAG"
          else
            # Get today's nightly tag
            current_version=$(jq -r '."."' .release-please-manifest.json)
            NIGHTLY_TAG="v${current_version}-nightly.$(date -u +%Y%m%d)"
            echo "Expected nightly tag: $NIGHTLY_TAG"

            # Check if the tag exists
            if ! git tag -l | grep -q "^$NIGHTLY_TAG$"; then
              echo "Nightly tag $NIGHTLY_TAG does not exist yet. Skipping docs release."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Check if the GitHub release exists and is published
          if ! gh release view "$NIGHTLY_TAG" --json isDraft,name 2>/dev/null; then
            echo "GitHub release for $NIGHTLY_TAG does not exist. Skipping docs release."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if the release is a draft (not published)
          IS_DRAFT=$(gh release view "$NIGHTLY_TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "GitHub release for $NIGHTLY_TAG is a draft (not published). Skipping docs release."
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "GitHub release for $NIGHTLY_TAG is published."

          # Check if we already have docs for this nightly version
          # For multi-instance docs, check the developer-specific versioned docs directory
          DOCS_VERSION_DIR="docs/developer_versioned_docs/version-$NIGHTLY_TAG"
          BB_DOCS_VERSION_DIR="barretenberg/docs/versioned_docs/version-$NIGHTLY_TAG"

          if [ -d "$DOCS_VERSION_DIR" ] || [ -d "$BB_DOCS_VERSION_DIR" ]; then
            echo "Docs already exist for $NIGHTLY_TAG. Skipping."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "tag=$NIGHTLY_TAG" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Will create docs for: $NIGHTLY_TAG"
          fi

  create-nightly-docs:
    name: Create nightly documentation
    needs: check-nightly-tag
    if: needs.check-nightly-tag.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    env:
      NIGHTLY_TAG: ${{ needs.check-nightly-tag.outputs.nightly-tag }}

    steps:
      - name: Checkout at nightly tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.NIGHTLY_TAG }}
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Setup dependencies
        run: |
          sudo apt install -y --no-install-recommends doxygen
          corepack enable

      - name: Configure Git
        run: |
          git config --global user.name AztecBot
          git config --global user.email tech@aztecprotocol.com

      - name: Cleanup Aztec docs nightly versions
        working-directory: ./docs
        run: |
          ./scripts/cleanup_nightly_versions.sh

      - name: Install Noir toolchain
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: nightly

      - name: Generate Aztec.nr API documentation
        working-directory: ./docs
        run: |
          # Generate aztec-nr API docs for this version
          ./scripts/aztec_nr_docs_generation/generate_aztec_nr_docs.sh ${{ env.NIGHTLY_TAG }}
          echo "Generated Aztec.nr API docs for: ${{ env.NIGHTLY_TAG }}"

      - name: Download bb from GitHub release
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/bb-bin
          gh release download ${{ env.NIGHTLY_TAG }} \
            --pattern "barretenberg-amd64-linux.tar.gz" \
            --dir /tmp/bb-bin
          tar -xzf /tmp/bb-bin/barretenberg-amd64-linux.tar.gz -C /tmp/bb-bin
          chmod +x /tmp/bb-bin/bb
          echo "BB_PATH=/tmp/bb-bin" >> $GITHUB_ENV

      - name: Build noir packages
        run: |
          # Initialize noir submodule (required for yarn-project portal dependencies)
          git submodule update --init --recursive noir/noir-repo
          # Build noir JS packages (creates noir/packages/ directory needed by yarn-project)
          cd noir
          ./bootstrap.sh install_deps
          ./bootstrap.sh build_packages

      - name: Build aztec CLI
        working-directory: ./yarn-project
        run: |
          ./bootstrap.sh
          echo "AZTEC_CLI_PATH=$(pwd)/aztec/dest/bin" >> $GITHUB_ENV

      - name: Generate TypeScript API documentation
        working-directory: ./docs
        run: |
          # Generate TypeScript API docs for this version (requires yarn-project to be built)
          ./scripts/typescript_api_generation/generate_ts_api_docs.sh ${{ env.NIGHTLY_TAG }}
          echo "Generated TypeScript API docs for: ${{ env.NIGHTLY_TAG }}"

      - name: Generate CLI documentation
        working-directory: ./docs
        continue-on-error: true
        run: |
          # Add bb from release to PATH
          export PATH="${BB_PATH}:${PATH}"

          # Create wrapper for aztec CLI that runs the local build
          mkdir -p /tmp/cli-bin
          cat > /tmp/cli-bin/aztec << 'EOF'
          #!/bin/bash
          node "$AZTEC_CLI_PATH/index.js" "$@"
          EOF
          chmod +x /tmp/cli-bin/aztec
          export PATH="/tmp/cli-bin:${PATH}"

          # Generate Aztec CLI docs using binaries (continue-on-error handles failures)
          ./scripts/cli_reference_generation/generate_all_cli_docs.sh --force current
          echo "Aztec CLI documentation generation attempted for: ${{ env.NIGHTLY_TAG }}"

      - name: Generate BB CLI documentation
        working-directory: ./barretenberg/docs
        continue-on-error: true
        run: |
          # Add bb from release to PATH
          export PATH="${BB_PATH}:${PATH}"

          # Generate BB CLI docs
          ./scripts/generate_bb_cli_docs.sh --force current
          echo "BB CLI documentation generation attempted for: ${{ env.NIGHTLY_TAG }}"

      - name: Create Aztec nightly docs version (Developer docs only)
        working-directory: ./docs
        run: |
          # Set the commit tag and release type for version macros
          export COMMIT_TAG=${{ env.NIGHTLY_TAG }}
          export RELEASE_TYPE=nightly

          # Install dependencies
          yarn install

          # Build docs to ensure everything works
          COMMIT_TAG=${{ env.NIGHTLY_TAG }} RELEASE_TYPE=nightly yarn build

          # Create the versioned docs for Developer docs only
          # Network docs have separate versions for testnet/ignition releases
          yarn docusaurus docs:version:developer ${{ env.NIGHTLY_TAG }}

          echo "Created Aztec Developer docs version: ${{ env.NIGHTLY_TAG }}"

      - name: Update Aztec Docs developer_versions.json with new version
        working-directory: ./docs/scripts
        run: |
          ./update_docs_versions.sh developer

      - name: Cleanup Barretenberg docs nightly versions
        working-directory: ./barretenberg/docs
        run: |
          ./scripts/cleanup_nightly_versions.sh

      - name: Create Barretenberg nightly docs version
        working-directory: ./barretenberg/docs
        run: |
          # Set the commit tag for version macros
          export COMMIT_TAG=${{ env.NIGHTLY_TAG }}

          # Install dependencies
          yarn install

          # Build docs to ensure everything works
          yarn build

          # Create the versioned docs
          yarn docusaurus docs:version ${{ env.NIGHTLY_TAG }}

          echo "Created Barretenberg docs version: ${{ env.NIGHTLY_TAG }}"

      - name: Update Barretenberg docs versions.json with new version
        working-directory: ./barretenberg/docs/scripts
        run: |
          ./update_versions.sh

      - name: Commit new Aztec and Barretenberg Docs version
        run: |
          # Reset non-versioned CLI docs (only versioned copies should be committed)
          git checkout -- docs/docs-developers/docs/cli/*_cli_reference.md || true

          # Stash the docs changes
          git add .
          git stash push --staged -m "nightly docs for ${{ env.NIGHTLY_TAG }}"

          # Checkout the next branch
          git fetch origin next
          git checkout next

          # Apply the stashed changes and commit
          git stash pop
          git add .
          git commit -m "chore(docs): cut new aztec and bb docs version for tag ${{ env.NIGHTLY_TAG }}"
          git push origin next
