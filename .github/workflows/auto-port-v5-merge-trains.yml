name: Auto-label v5 merge-train PRs for forward-port

# Forward-port every PR that lands in a v5 merge-train to public `next` by
# default. We add the `port-to-next` label when the PR opens; backport.yml acts
# on it when the PR merges, cherry-picking that single PR onto port-to-next-
# staging (individual granularity keeps conflicts small). Labelling on open makes
# the intent visible for the PR's whole life and leaves an opt-out window: remove
# `port-to-next` before merge for v5-only work such as release-line artifacts.
#
# New release lines need their train pattern added below (e.g. merge-train/*-v6).
on:
  pull_request_target:
    types: [opened]
    branches:
      - 'merge-train/*-v5'

permissions: {}

jobs:
  label:
    name: Add port-to-next label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Labelling via the REST endpoint on the built-in token, rather than `gh pr
      # edit`: that command resolves PR metadata over GraphQL, which reads org
      # teams and so needs a personal token carrying `read:org`. `pull_request_target`
      # runs against the base repo, so GITHUB_TOKEN can write here. The label it
      # sets does not fire `labeled` events, which is fine — backport.yml only
      # ports once the PR is merged.
      - name: Add port-to-next label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -f "labels[]=port-to-next"
