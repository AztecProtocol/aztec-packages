name: Automatic backport/port action

on:
  pull_request_target:
    types: ["labeled", "closed"]

jobs:
  label_checker:
    name: Check labels
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.check.outputs.targets }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          sparse-checkout: scripts/backport_targets.sh
          sparse-checkout-cone-mode: false

      - id: check
        env:
          EVENT_ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          ADDED_LABEL: ${{ github.event.label.name }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "Labels: $LABELS_JSON"
          TARGETS=$(./scripts/backport_targets.sh)
          echo "Backport targets: $TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  backport:
    needs: [label_checker]
    name: Backport/port PR to ${{ matrix.target }}
    if: needs.label_checker.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.label_checker.outputs.targets) }}
    env:
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TARGET_BRANCH: ${{ matrix.target }}
      STAGING_BRANCH: backport-to-${{ matrix.target }}-staging
      STAGING_PR_TITLE: "chore: Accumulated backports to ${{ matrix.target }}"
      STAGING_PR_LABELS: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

      - name: Run backport script
        id: backport
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          # Kludge. We should write this in Python or not checkout history.
          # Bash has an ugly footgun with changing history while running the script.
          buffer_script=$(cat ./scripts/backport_to_staging.sh)
          set +e
          bash <(echo "$buffer_script") "$PR" "$TARGET_BRANCH"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Comment on original PR (success)
        if: steps.backport.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          RESULT: ${{ steps.backport.outputs.result }}
        run: |
          if [[ "$RESULT" == "already-present" ]]; then
            gh pr comment "$PR" --body "✅ Nothing to backport: this change is already in \`$TARGET_BRANCH\`."
            exit 0
          fi
          STAGING_PR=$(gh pr list --base "$TARGET_BRANCH" --head "$STAGING_BRANCH" --json number,url --jq '.[0]')
          STAGING_PR_NUMBER=$(echo "$STAGING_PR" | jq -r '.number')
          STAGING_PR_URL=$(echo "$STAGING_PR" | jq -r '.url')

          gh pr comment "$PR" --body \
            "✅ Backported to \`$TARGET_BRANCH\` via [$STAGING_BRANCH #$STAGING_PR_NUMBER]($STAGING_PR_URL). It lands in \`$TARGET_BRANCH\` when that PR merges."

      - name: "Notify #backports (conflict)"
        id: slack
        if: ${{ !cancelled() && steps.backport.outputs.exit_code == '3' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          STAGING_URL="$REPO_URL/tree/$STAGING_BRANCH"
          # Slack mrkdwn escaping for the free-text title.
          SAFE_TITLE=$(printf '%s' "$TITLE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          TEXT=$(cat <<EOF
          ⚠️ *Backport conflict:* <$PR_URL|$REPO#$PR $SAFE_TITLE> → \`$TARGET_BRANCH\` (author: <https://github.com/$AUTHOR|$AUTHOR>)
          ClaudeBox is resolving it and will post a PR into <$STAGING_URL|$STAGING_BRANCH> in this thread. *$AUTHOR*, please review and merge that PR.
          <$PR_URL|Manual resolution steps on the PR> · <$RUN_URL|Backport run> (🤖)
          EOF
          )
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            -d "$(jq -n --arg c "#backports" --arg t "$TEXT" '{channel:$c, text:$t, unfurl_links:false}')")
          echo "Slack response: $RESP"
          TS=$(echo "$RESP" | jq -r '.ts // empty')
          CHANNEL_ID=$(echo "$RESP" | jq -r '.channel // empty')

          LINK=""
          if [[ -n "$TS" && -n "$CHANNEL_ID" ]]; then
            LINK="https://aztecprotocol.slack.com/archives/$CHANNEL_ID/p${TS//./}"
          fi
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          echo "link=$LINK" >> "$GITHUB_OUTPUT"

      - name: Comment on original PR (conflict)
        if: ${{ !cancelled() && steps.backport.outputs.exit_code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SLACK_LINK: ${{ steps.slack.outputs.link }}
        run: |
          THREAD="#backports"
          if [[ -n "$SLACK_LINK" ]]; then THREAD="[#backports thread]($SLACK_LINK)"; fi
          STAGING_URL="$REPO_URL/tree/$STAGING_BRANCH"
          BODY=$(cat <<EOF
          ❌ **Backport to \`$TARGET_BRANCH\` needs a conflict resolution.** The automatic cherry-pick onto [\`$STAGING_BRANCH\`]($STAGING_URL) hit conflicts ([backport run]($RUN_URL)). Nothing is lost: this PR is still merged into its base, and \`$TARGET_BRANCH\` is untouched.

          **What happens next**
          1. ClaudeBox is resolving the conflicts. It opens a PR into \`$STAGING_BRANCH\` and posts the link in the $THREAD for this backport.
          2. @$AUTHOR: please review that PR (you know this change best) and merge it once CI is green.
          3. The change then reaches \`$TARGET_BRANCH\` with the accumulated backports PR ([open PRs into \`$TARGET_BRANCH\`]($REPO_URL/pulls?q=is%3Aopen+is%3Apr+base%3A$TARGET_BRANCH+head%3A$STAGING_BRANCH)).

          **Resolving it yourself instead** (if ClaudeBox's PR is wrong or never appears):
          \`\`\`bash
          git fetch origin $STAGING_BRANCH $MERGE_SHA
          git checkout -b backport-$PR-to-$TARGET_BRANCH origin/$STAGING_BRANCH
          git cherry-pick $MERGE_SHA   # add -m 1 if this is a merge commit
          # fix the conflicts, then:
          git add -A && git cherry-pick --continue
          git push origin HEAD
          \`\`\`
          Then open a PR with base \`$STAGING_BRANCH\`. Keep \`(#$PR)\` in the commit title so the staging PR lists it. Questions go in the $THREAD.
          EOF
          )
          gh pr comment "$PR" --body "$BODY"

      - name: Dispatch ClaudeBox (conflict)
        if: ${{ !cancelled() && steps.backport.outputs.exit_code == '3' }}
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LINK: ${{ steps.slack.outputs.link }}
          CHANNEL_ID: ${{ steps.slack.outputs.channel }}
          TS: ${{ steps.slack.outputs.ts }}
        run: |
          gh workflow run claudebox.yml \
            -f prompt="Backport $REPO PR #$PR ($PR_URL, \"$TITLE\", author $AUTHOR) to $TARGET_BRANCH (staging branch $STAGING_BRANCH). The automatic cherry-pick of merge commit $MERGE_SHA failed due to conflicts. Follow .claude/claudebox/backport.md to resolve conflicts and open a PR into $STAGING_BRANCH." \
            -f link="${LINK:-$PR_URL}" \
            -f target_ref="origin/$STAGING_BRANCH" \
            -f slack_channel="$CHANNEL_ID" \
            -f slack_thread_ts="$TS"

      # Anything other than a conflict (an API or fetch error, a push that kept losing races) is not
      # something ClaudeBox can resolve, so it goes to a human with the run log.
      - name: Report other failure
        if: ${{ !cancelled() && steps.backport.outcome == 'failure' && steps.backport.outputs.exit_code != '3' }}
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR" --body \
            "❌ Backport to \`$TARGET_BRANCH\` failed with an error, not a conflict ([backport run]($RUN_URL)). Re-run the failed job from that page; if it fails again, ask in #backports."
          SAFE_TITLE=$(printf '%s' "$TITLE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          TEXT="⚠️ *Backport error:* <$PR_URL|$REPO#$PR $SAFE_TITLE> → \`$TARGET_BRANCH\` (author: <https://github.com/$AUTHOR|$AUTHOR>). Not a conflict: check the <$RUN_URL|backport run> and re-run it. (🤖)"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-type: application/json" \
            -d "$(jq -n --arg c "#backports" --arg t "$TEXT" '{channel:$c, text:$t, unfurl_links:false}')"
