name: Build Fuzzing AVM Container

on:
  push:
    branches:
      - next
  workflow_dispatch:
    inputs:
      commit:
        description: "Git commit SHA to build (leave empty for latest)"
        required: false
        default: ""
jobs:
  build:
    if: github.repository == 'AztecProtocol/aztec-packages'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Free up disk space on runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          large-packages: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: container-builds/avm-fuzzing-container/src/
          push: true
          tags: |
            ghcr.io/aztecprotocol/avm-fuzzing-container:latest
            ghcr.io/aztecprotocol/avm-fuzzing-container:${{ github.sha }}
          build-args: |
            COMMIT=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.revision.branch=${{ github.ref_name }}
            com.aztec.visibility=public

      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Extract and attach fuzzer manifest
        run: |
          docker create --name manifest-extract ghcr.io/aztecprotocol/avm-fuzzing-container:${{ github.sha }}
          docker cp manifest-extract:/home/fuzzer/fuzzer_manifest.json ./fuzzer_manifest.json
          docker rm manifest-extract
          oras attach ghcr.io/aztecprotocol/avm-fuzzing-container@${{ steps.build.outputs.digest }} \
            --artifact-type application/vnd.contfuzzer.manifest+json \
            fuzzer_manifest.json

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v3.0.5'

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/aztecprotocol/avm-fuzzing-container@${{ steps.build.outputs.digest }}
