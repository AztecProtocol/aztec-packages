name: Merge Train Auto-Merge

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  auto-merge-inactive:
    name: Auto-merge inactive PRs
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check out the ci3 submodule
        # Only the ci3 submodule: `submodules: true` would also clone noir-repo and the
        # contract libraries. A no-op on refs from before ci3 became a submodule.
        run: if [ "$(git ls-files -s ci3 | cut -c1-6)" = 160000 ]; then git submodule update --init --depth 1 ci3; fi

      - name: Run auto-merge script (merge-train)
        run: |
          GH_TOKEN=${{ secrets.AZTEC_BOT_GITHUB_TOKEN }} \
          MERGE_TRAIN_GITHUB_TOKEN=${{ secrets.MERGE_TRAIN_GITHUB_TOKEN }} \
          ./scripts/merge-train/auto-merge.sh
