name: Merge Train Auto-Merge

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  auto-merge-inactive:
    name: Auto-merge inactive PRs
    if: ${{ github.event_name != 'schedule' || github.repository == 'aztec-labs-eng/aztec-node' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run auto-merge script (merge-train)
        run: |
          GH_TOKEN=${{ secrets.AZTEC_BOT_GITHUB_TOKEN }} \
          MERGE_TRAIN_GITHUB_TOKEN=${{ secrets.MERGE_TRAIN_GITHUB_TOKEN }} \
          ./scripts/merge-train/auto-merge.sh

      - name: Run auto-merge script (backport-train)
        run: |
          GH_TOKEN=${{ secrets.AZTEC_BOT_GITHUB_TOKEN }} \
          MERGE_TRAIN_GITHUB_TOKEN=${{ secrets.MERGE_TRAIN_GITHUB_TOKEN }} \
          BRANCH_PATTERN=backport-to- \
          MERGE_STRATEGY=merge \
          INACTIVITY_HOURS=8 \
          ./scripts/merge-train/auto-merge.sh

      - name: Run auto-merge script (port-to-main)
        run: |
          GH_TOKEN=${{ secrets.AZTEC_BOT_GITHUB_TOKEN }} \
          MERGE_TRAIN_GITHUB_TOKEN=${{ secrets.MERGE_TRAIN_GITHUB_TOKEN }} \
          BRANCH_PATTERN=port-to-main \
          MERGE_STRATEGY=merge \
          INACTIVITY_HOURS=8 \
          ./scripts/merge-train/auto-merge.sh
