# CI for Aztec Network Scenarios.
# Manually triggered to deploy and test a network.
# If test_set is empty, runs both sets in parallel.
name: Test Network Scenarios

on:
  workflow_dispatch:
    inputs:
      docker_image:
        description: Complete docker image to use (e.g., aztecprotocol/aztec:some-tag)
        required: true
        type: string
      namespace:
        description: Kubernetes namespace to use (will be sanitized for k8s naming)
        required: true
        type: string
      env_file:
        description: Network configuration to use (local, devnet, testnet, next-scenario, tps-scenario)
        required: false
        type: string
        default: next-scenario
      test_set:
        description: Test set to run (1, 2, or empty for both in parallel)
        required: false
        type: string
        default: ""

concurrency:
  group: test-network-scenarios-${{ inputs.namespace }}
  cancel-in-progress: true

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_set: ${{ fromJSON(inputs.test_set == '' && '["1","2"]' || format('["{0}"]', inputs.test_set)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Network Scenarios
        timeout-minutes: 350
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 360
          NO_SPOT: 1
        run: |
          namespace=$(echo "${{ inputs.namespace }}" | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
          echo "NAMESPACE=$namespace" >> $GITHUB_ENV
          # Run scenario tests for the selected set (matrix expands to 1 or 2).
          ./.github/ci3.sh network-scenarios "${{ inputs.env_file }}" "$namespace" "${{ inputs.docker_image }}" "${{ matrix.test_set }}"

      - name: Cleanup network resources
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: |
          ./.github/ci3.sh network-teardown "${{ inputs.env_file }}" "${NAMESPACE}-${{ matrix.test_set }}" || true

      - name: Notify Slack and dispatch ClaudeBox on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify_with_claudebox_kickoff "#alerts-next-scenario" \
            "Scenario Tests FAILED (set ${{ matrix.test_set }}, image ${{ inputs.docker_image }}, env ${{ inputs.env_file }}): <${RUN_URL}|View Run> (🤖)" \
            "Scenario tests failed (set ${{ matrix.test_set }}, image ${{ inputs.docker_image }}, env ${{ inputs.env_file }}). CI run: ${RUN_URL}. Investigate the scenario test failure and identify the root cause." \
            --link "$RUN_URL"
