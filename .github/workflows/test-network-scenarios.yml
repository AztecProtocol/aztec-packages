# CI for Aztec Network Scenarios.
# For PRs: add the ci-test-network-deploy label and ci3.yml will handle it.
# For manual runs or tagged releases: use triggers below.
#
name: Test Network Scenarios

on:
  workflow_run:
    workflows: ["CI3"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to run from
        required: true
        type: string
        default: next
      docker_image:
        description: Complete docker image to use (e.g., aztecprotocol/aztec:some-tag)
        required: true
        type: string
      namespace:
        description: Kubernetes namespace to use (will be sanitized for k8s naming)
        required: true
        type: string
      env_file:
        description: Environment file to use from spartan/environments/
        required: false
        type: string
        default: next-scenario.env

concurrency:
  group: test-network-scenarios-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || (github.event_name == 'workflow_dispatch' && inputs.ref) || github.sha }}
  cancel-in-progress: true

jobs:
  check-should-run:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check for semver tag
        id: check
        run: |
          git fetch --tags --force
          tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n1)
          if echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+' && ! echo "$tag" | grep -q 'commit'; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Found semver tag: $tag"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No semver tag found for head_sha: ${{ github.event.workflow_run.head_sha }}. Skipping."
          fi

  ci:
    needs: check-should-run
    if: |
      always() &&
      ((github.event_name == 'workflow_run' && needs.check-should-run.outputs.should_run == 'true') ||
      (github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
    steps:
      - name: Checkout (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine semver from tag
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force
          tag=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n1)
          semver="${tag#v}"
          echo "SEMVER=$semver" >> $GITHUB_ENV
          echo "AZTEC_DOCKER_IMAGE=aztecprotocol/aztec:${semver}" >> $GITHUB_ENV

      - name: Set env from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          namespace_id=$(echo "${{ inputs.namespace }}" | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)
          echo "NAMESPACE=$namespace_id" >> $GITHUB_ENV
          echo "AZTEC_DOCKER_IMAGE=${{ inputs.docker_image }}" >> $GITHUB_ENV
          echo "ENV_FILE=${{ inputs.env_file }}" >> $GITHUB_ENV

      - name: Run
        env:
          CI_INTERNAL: "1"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          AZTEC_DOCKER_IMAGE: ${{ env.AZTEC_DOCKER_IMAGE }}
          NAMESPACE: ${{ env.NAMESPACE }}
          ENV_FILE: ${{ env.ENV_FILE }}
        run: ./.github/ci3.sh "ci-test-network-deploy"

      - name: Download deploy benchmarks
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if ./ci.sh gh-deploy-bench; then
            echo "ENABLE_DEPLOY_BENCH=1" >> $GITHUB_ENV
          fi

      - name: Upload deploy benchmarks
        if: always() && env.ENABLE_DEPLOY_BENCH == '1'
        uses: benchmark-action/github-action-benchmark@4de1bed97a47495fc4c5404952da0499e31f5c29
        with:
          name: CI Benchmarks
          benchmark-data-dir-path: "bench/next"
          tool: "customSmallerIsBetter"
          output-file-path: ./bench-out/bench.json
          github-token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          auto-push: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          alert-threshold: "120%"
          comment-on-alert: false
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Notify Slack on failure
        if: failure() && github.event_name == 'workflow_run'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -n "${SLACK_BOT_TOKEN}" ]; then
            read -r -d '' data <<EOF || true
            {
              "channel": "#alerts-next-scenario",
              "text": "Scenario tests FAILED for *next-scenario* (version ${{ env.SEMVER }}): <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
            }
          EOF
            curl -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-type: application/json" \
              --data "$data"
          fi
