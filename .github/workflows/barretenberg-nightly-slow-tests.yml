name: Nightly Slow Tests

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-slow-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  slow-tests:
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: next
      - name: Check out the ci3 submodule
        # Only the ci3 submodule: `submodules: true` would also clone noir-repo and the
        # contract libraries. A no-op on refs from before ci3 became a submodule.
        run: if [ "$(git ls-files -s ci3 | cut -c1-6)" = 160000 ]; then git submodule update --init --depth 1 ci3; fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: nightly-slow-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Run slow tests
        timeout-minutes: 120
        env:
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          ./.github/ci3.sh barretenberg-nightly

      - name: Notify Slack on failure
        if: failure() && github.event_name != 'workflow_dispatch'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./ci3/slack_notify \
            "Nightly slow tests FAILED: <${RUN_URL}|View Run> (🤖)" \
            "#honk-team"
