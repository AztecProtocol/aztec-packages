name: Public V5 Auto-Pull

on:
  push:
    branches:
      - public-v5
  workflow_dispatch:

concurrency:
  group: public-v5-to-v5
  cancel-in-progress: false

jobs:
  merge-to-v5:
    name: Merge public-v5 to v5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public-v5 automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: public-v5
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name AztecBot
          git config user.email tech@aztecprotocol.com

      - name: Merge public-v5 into v5
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SOURCE_BRANCH: public-v5
          TARGET_BRANCH: v5
          CONFLICT_EXIT_CODE: 0
        run: ./scripts/merge-train/merge-public-v5.sh
