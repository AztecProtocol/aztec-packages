# Deploy staging-public after CI3 completes for a v4 release tag.
# Replaces the old polling-based approach that was brittle and could time out.
#
# Flow: v4 tag pushed → CI3 runs → CI3 completes → this workflow fires → deploy
name: Deploy to staging-public

on:
  workflow_run:
    workflows: ["CI3"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      semver:
        description: "Semver version (e.g., 4.1.0 or 4.1.0-rc.1)"
        required: true
        type: string
      source_tag:
        description: "Source tag override (defaults to v<semver>)"
        required: false
        type: string

concurrency:
  group: deploy-staging-public
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

jobs:
  determine-tag:
    # Only proceed for successful CI3 runs, or manual dispatch
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      semver: ${{ steps.resolve.outputs.semver }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
    steps:
      - name: Checkout at CI3 HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve tag from CI3 run
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SEMVER="${{ inputs.semver }}"
            TAG="${{ inputs.source_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${SEMVER}"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "semver=$SEMVER" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # workflow_run: the CI3 run was triggered by a tag push.
          # The tag already exists at head_sha — no polling needed.
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          echo "CI3 completed for branch/tag=$HEAD_BRANCH at $HEAD_SHA"

          git fetch --tags --force
          TAG=$(git tag --points-at "$HEAD_SHA" | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$" | sort -V | tail -n 1 || true)

          if [ -z "$TAG" ]; then
            echo "No semver tag found at $HEAD_SHA — skipping (not a release)"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SEMVER="${TAG#v}"
          MAJOR="${SEMVER%%.*}"

          # Only deploy v4 releases to staging-public
          if [[ "$MAJOR" != "4" ]]; then
            echo "Tag $TAG is not a v4 release (major=$MAJOR) — skipping"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found tag: $TAG (semver=$SEMVER)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "should_deploy=true" >> $GITHUB_OUTPUT

  deploy:
    needs: determine-tag
    if: needs.determine-tag.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy-network on next branch
        run: |
          echo "Triggering deploy-network for staging-public with semver=${{ needs.determine-tag.outputs.semver }}"
          gh workflow run deploy-network.yml \
            --repo "${{ github.repository }}" \
            --ref next \
            -f network=staging-public \
            -f semver="${{ needs.determine-tag.outputs.semver }}" \
            -f source_tag="${{ needs.determine-tag.outputs.tag }}"
