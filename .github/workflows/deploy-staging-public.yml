name: Deploy to staging public

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (v5.0.0 or any v5.0.0 prerelease). Leave empty to use today's 5.0.0 nightly tag."
        required: false
        type: string
      deploy_contracts:
        description: "Redeploy rollup contracts before deploying infra."
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-staging-public
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule') &&
      (github.event_name != 'schedule' ||
      github.repository == 'aztec-labs-eng/aztec-node')
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      semver: ${{ steps.resolve.outputs.semver }}
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: main
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Resolve nightly tag
        id: resolve
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            echo "Using manually specified tag: $TAG"
          else
            TAG="v5.0.0-nightly.$(date -u +%Y%m%d)"
            echo "Using today's nightly tag: $TAG"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "Error: nightly tag $TAG does not exist on origin"
              exit 1
            fi
            echo "Confirmed nightly tag $TAG exists on origin"
          fi

          SEMVER="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

  wait-for-ci3:
    needs: determine-tag
    if: ${{ github.event_name != 'schedule' || github.repository == 'aztec-labs-eng/aztec-node' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Wait for CI3
        run: spartan/scripts/wait_for_ci3.ts "${{ needs.determine-tag.outputs.tag }}"

  deploy:
    needs: [determine-tag, wait-for-ci3]
    if: ${{ github.event_name != 'schedule' || github.repository == 'aztec-labs-eng/aztec-node' }}
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: staging-public
      semver: ${{ needs.determine-tag.outputs.semver }}
      source_tag: ${{ needs.determine-tag.outputs.tag }}
      ref: main
      deploy_contracts: ${{ inputs.deploy_contracts == true }}
    secrets: inherit
