name: Bench Inclusion Point

# Reusable: runs ONE inclusion-sweep TPS point end-to-end — deploy a fresh
# network, wait for the first L2 block, run the bench point, then tear the
# network down (always). Called once per point (1/5/10 TPS) by
# nightly-bench-inclusion-sweep.yml, which chains the calls so only one network
# exists at a time.

on:
  workflow_call:
    inputs:
      tps:
        description: "Target TPS for this point"
        required: true
        type: string
      namespace:
        description: "k8s namespace for this point's network"
        required: true
        type: string
      network:
        description: "Network env name (environments/<network>.env)"
        required: false
        type: string
        default: bench-inclusion-sweep
      docker_image:
        description: "Full aztec docker image to deploy"
        required: true
        type: string
      source_ref:
        description: "Git ref to checkout for the bench/teardown scripts"
        required: true
        type: string
      sweep_id:
        description: "Shared sweep id so the dashboard groups the points"
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/deploy-network.yml
    with:
      network: ${{ inputs.network }}
      namespace: ${{ inputs.namespace }}
      aztec_docker_image: ${{ inputs.docker_image }}
      ref: ${{ inputs.source_ref }}
      notify_on_failure: false
    secrets: inherit

  wait:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Wait for first L2 block
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NAMESPACE: ${{ inputs.namespace }}
        run: cd spartan && ./bootstrap.sh wait_for_l2_block ${{ inputs.network }}

  bench:
    needs: wait
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - name: Run ${{ inputs.tps }} TPS inclusion point
        timeout-minutes: 120
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AWS_SHUTDOWN_TIME: 180
          NO_SPOT: 1
          SKIP_NETWORK_DEPLOY: "1"
          TARGET_TPS: ${{ inputs.tps }}
          BENCH_SWEEP_ID: ${{ inputs.sweep_id }}
          BENCH_SWEEP_LABEL: inclusion-sweep
        run: ./.github/ci3.sh network-inclusion-sweep ${{ inputs.network }} ${{ inputs.namespace }} "${{ inputs.docker_image }}"

  cleanup:
    if: always()
    needs: [deploy, wait, bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - name: Cleanup network resources
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          BUILD_INSTANCE_SSH_KEY: ${{ secrets.BUILD_INSTANCE_SSH_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          NO_SPOT: 1
        run: ./.github/ci3.sh network-teardown ${{ inputs.network }} ${{ inputs.namespace }}
