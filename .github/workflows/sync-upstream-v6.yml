# Mirror upstream aztec-packages:v6 onto public-v6, then merge it into the private v6.
#
# public-v6 is force-rewritten to exactly match upstream (it holds no private commits); the merge
# into v6 is a separate step, so private v6 = public v6 + private fixes. The sync scripts are taken
# from v6 itself. Uses AZTEC_BOT_GITHUB_TOKEN (PAT) because GITHUB_TOKEN cannot push commits that
# modify .github/workflows/.
name: Sync Upstream v6

on:
  # Dispatched by the public repo's "Notify Private Sync" workflow on pushes to upstream v6 once v6
  # is in its branch list. The 30-minute poll keeps v6 in sync without that dispatch; a run with
  # nothing new exits after two fetches.
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    name: Sync public-v6 and v6
    runs-on: ubuntu-latest
    if: github.repository == 'AztecProtocol/aztec-packages-private'
    concurrency:
      group: sync-public-v6
      cancel-in-progress: false
    steps:
      - name: Checkout automation from v6
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: v6
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "AztecBot"
          git config user.email "tech@aztecprotocol.com"

      - name: Force-sync public-v6 to upstream
        env:
          PUBLIC_BRANCH: public-v6
          UPSTREAM_BRANCH: v6
        run: ./scripts/merge-train/sync-public-next.sh

      - name: Merge public-v6 into v6
        env:
          GH_TOKEN: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
          SOURCE_BRANCH: public-v6
          TARGET_BRANCH: v6
          CONFLICT_EXIT_CODE: 1
        run: ./scripts/merge-train/merge-public-next.sh
