# Ensure multiple environments have all publisher keys and bot accounts funded
# This workflow checks and funds publisher keys and bot accounts for all environments
# including dynamically discovered devnet iterations.
name: Ensure Funded Environments

on:
  workflow_dispatch:
    inputs:
      low_watermark:
        description: "Minimum ETH balance"
        required: false
        type: string
        default: "0.5"
      high_watermark:
        description: "Target ETH balance when funding"
        required: false
        type: string
        default: "1.0"
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

concurrency:
  group: ensure-funded-environments
  cancel-in-progress: false # Don't cancel funding operations

jobs:
  discover:
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover active devnets
        id: discover
        run: spartan/scripts/get_active_devnets.ts

      - name: Build funding matrix
        id: build-matrix
        run: |
          # Static environments
          static='[
            {"environment":"staging"},
            {"environment":"next-net"},
            {"environment":"testnet"}
          ]'

          # Convert devnet namespaces to matrix entries
          devnets=$(echo '${{ steps.discover.outputs.devnets }}' \
            | jq -c '[.[] | {environment: "devnet", namespace: .}]')

          matrix=$(jq -c -n --argjson s "$static" --argjson d "$devnets" '{"include": ($s + $d)}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  fund:
    needs: discover
    if: ${{ github.event_name != 'schedule' || github.repository == 'AztecProtocol/aztec-packages' }}
    strategy:
      # we can only run one funding operation at a time because all jobs fund from the same address
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/ensure-funded-environment.yml
    with:
      environment: ${{ matrix.environment }}
      namespace: ${{ matrix.namespace }}
      low_watermark: ${{ inputs.low_watermark || '5.0' }}
      high_watermark: ${{ inputs.high_watermark || '10.0' }}
    secrets: inherit
