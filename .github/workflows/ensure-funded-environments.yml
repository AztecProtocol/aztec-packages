# Ensure multiple environments have all publisher keys and bot accounts funded
# This workflow checks and funds publisher keys and bot accounts for all
# environments still running against sepolia.
name: Ensure Funded Environments

on:
  workflow_dispatch:
    inputs:
      low_watermark:
        description: "Minimum ETH balance"
        required: false
        type: string
        default: "0.5"
      high_watermark:
        description: "Target ETH balance when funding"
        required: false
        type: string
        default: "1.0"
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

concurrency:
  group: ensure-funded-environments
  cancel-in-progress: false # Don't cancel funding operations

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Build funding matrix
        id: build-matrix
        run: |
          # Environments still running against sepolia
          static='[
            {"environment":"staging-public"},
            {"environment":"next-net"},
            {"environment":"testnet"}
          ]'

          matrix=$(jq -c -n --argjson s "$static" '{"include": $s}')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  fund:
    needs: build-matrix
    strategy:
      # we can only run one funding operation at a time because all jobs fund from the same address
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/ensure-funded-environment.yml
    with:
      environment: ${{ matrix.environment }}
      namespace: ${{ matrix.namespace }}
      low_watermark: ${{ inputs.low_watermark || '5.0' }}
      high_watermark: ${{ inputs.high_watermark || '10.0' }}
    secrets: inherit
