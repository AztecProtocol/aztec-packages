name: Merge-Train PR Body

on:
  push:
    branches:
      - 'merge-train/**'

jobs:
  update-pr-body:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AZTEC_BOT_GITHUB_TOKEN }}
      - name: Check out the ci3 submodule
        # Only the ci3 submodule: `submodules: true` would also clone noir-repo and the
        # contract libraries. A no-op on refs from before ci3 became a submodule.
        run: if [ "$(git ls-files -s ci3 | cut -c1-6)" = 160000 ]; then git submodule update --init --depth 1 ci3; fi

      - name: Update merge train PR body
        run: |
          GH_TOKEN=${{ secrets.AZTEC_BOT_GITHUB_TOKEN }} ./scripts/merge-train/update-pr-body.sh "$GITHUB_REF_NAME"
