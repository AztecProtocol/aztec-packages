<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barretenberg Benchmark Breakdown Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .subtitle {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #2c3e50;
      font-size: 0.9rem;
    }

    input, select {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
    }

    button {
      padding: 12px 24px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }

    button:hover {
      background: #2980b9;
    }

    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .chart-container {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 6px;
    }

    .chart-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #2c3e50;
      text-align: center;
    }

    .chart-wrapper {
      position: relative;
      height: 500px;
      margin: 0 auto;
    }

    .error {
      color: #e74c3c;
      padding: 15px;
      background: #fadbd8;
      border-radius: 4px;
      margin-top: 20px;
    }

    .info {
      color: #3498db;
      padding: 15px;
      background: #d6eaf8;
      border-radius: 4px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding: 20px;
      background: #ecf0f1;
      border-radius: 6px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Barretenberg Benchmark Breakdown Viewer</h1>
    <p class="subtitle">Visualize hierarchical benchmark data showing time spent in each component</p>

    <div class="controls">
      <div class="control-group">
        <label for="runtime">Runtime:</label>
        <select id="runtime">
          <option value="native">Native</option>
          <option value="wasm">Wasm</option>
        </select>
      </div>

      <div class="control-group">
        <label for="flow">Flow Name:</label>
        <input type="text" id="flow" placeholder="e.g., ecdsar1+transfer_0_recursions+sponsored_fpc"
               value="ecdsar1+transfer_0_recursions+sponsored_fpc" />
      </div>

      <div class="control-group">
        <button id="loadBtn">Load Latest from 'next'</button>
      </div>
    </div>

    <div id="message"></div>
    <div id="stats"></div>
    <div id="chartContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
    let currentChart = null;

    // GitHub configuration
    const GITHUB_OWNER = "AztecProtocol";
    const GITHUB_REPO = "aztec-packages";

    // Fetch the latest commit SHA for a branch
    async function getLatestCommitSha(branch) {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?sha=${branch}&per_page=1`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch commits for branch ${branch}`);
        }
        const commits = await response.json();
        if (commits.length === 0) {
          throw new Error(`No commits found for branch ${branch}`);
        }
        return commits[0].sha;
      } catch (error) {
        throw new Error(`Error fetching latest commit: ${error.message}`);
      }
    }

    // Generate nice colors for the pie chart
    function generateColors(count) {
      const colors = [
        '#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6',
        '#1abc9c', '#34495e', '#e67e22', '#95a5a6', '#d35400',
        '#c0392b', '#16a085', '#27ae60', '#2980b9', '#8e44ad',
        '#2c3e50', '#f1c40f', '#e84393', '#00b894', '#0984e3'
      ];

      if (count <= colors.length) {
        return colors.slice(0, count);
      }

      // Generate more colors if needed
      const additional = [];
      for (let i = colors.length; i < count; i++) {
        const hue = (i * 137.5) % 360; // Golden angle
        additional.push(`hsl(${hue}, 65%, 55%)`);
      }
      return [...colors, ...additional];
    }

    // Format large numbers with commas
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Load and visualize breakdown data
    async function loadBreakdown() {
      const branch = 'next'; // Always use next branch
      const runtime = document.getElementById('runtime').value;
      const flow = document.getElementById('flow').value.trim();
      const messageDiv = document.getElementById('message');
      const statsDiv = document.getElementById('stats');
      const chartContainer = document.getElementById('chartContainer');

      if (!flow) {
        messageDiv.innerHTML = '<div class="error">Please provide a flow name</div>';
        return;
      }

      // Clear previous state
      messageDiv.innerHTML = '<div class="loading">Fetching latest commit from ' + branch + '...</div>';
      statsDiv.innerHTML = '';
      chartContainer.innerHTML = '';
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }

      try {
        // Get the latest commit SHA for the selected branch
        const sha = await getLatestCommitSha(branch);
        const shortSha = sha.substring(0, 7);

        messageDiv.innerHTML = '<div class="loading">Loading benchmark data for commit ' + shortSha + '...</div>';

        // Try to fetch from GitHub raw (gh-pages branch stores the files)
        // Path: bench/barretenberg-breakdowns/<flow>/<runtime>-<sha>.json
        const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/gh-pages/bench/barretenberg-breakdowns/${flow}/${runtime}-${shortSha}.json`;

        // Fetch the data
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Failed to fetch data (${response.status}). The breakdown might not exist for this commit.`);
        }

        const data = await response.json();

        // Clear loading message
        messageDiv.innerHTML = '';

        // Filter to show only top-level components (no :: in the name means no parent)
        const topLevelComponents = {};

        for (const [name, value] of Object.entries(data)) {
          // Top-level components don't have "::" in their name
          if (!name.includes('::')) {
            topLevelComponents[name] = value;
          }
        }

        // Calculate total and prepare data for pie chart
        const entries = Object.entries(topLevelComponents);
        const total = entries.reduce((sum, [_, value]) => sum + value, 0);
        const allComponentCount = Object.keys(data).length;

        // Sort by value (descending) and calculate percentages
        const sorted = entries
          .map(([name, value]) => ({
            name,
            value,
            percentage: (value / total * 100).toFixed(2)
          }))
          .sort((a, b) => b.value - a.value);

        // Show statistics
        const topComponents = sorted.slice(0, 5);
        statsDiv.innerHTML = `
          <div class="stats">
            <div class="stat-item">
              <div class="stat-label">Total Operations</div>
              <div class="stat-value">${formatNumber(total)}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Top-Level Components</div>
              <div class="stat-value">${entries.length}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">All Components</div>
              <div class="stat-value">${allComponentCount}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Largest Component</div>
              <div class="stat-value">${topComponents[0].percentage}%</div>
            </div>
          </div>
        `;

        // Create pie chart
        chartContainer.innerHTML = `
          <div class="chart-container">
            <h2 class="chart-title">${branch} - ${runtime.toUpperCase()} - ${flow}</h2>
            <h3 style="text-align: center; color: #7f8c8d; font-size: 1rem; margin-bottom: 20px;">Top-Level Components (${shortSha})</h3>
            <div class="chart-wrapper">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        `;

        const ctx = document.getElementById('pieChart').getContext('2d');
        const colors = generateColors(sorted.length);

        currentChart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: sorted.map(item => item.name),
            datasets: [{
              data: sorted.map(item => item.value),
              backgroundColor: colors,
              borderColor: '#fff',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  boxWidth: 15,
                  padding: 10,
                  font: {
                    size: 11
                  },
                  generateLabels: function(chart) {
                    const data = chart.data;
                    return data.labels.map((label, i) => {
                      const value = data.datasets[0].data[i];
                      const percentage = sorted[i].percentage;
                      return {
                        text: `${label}: ${percentage}%`,
                        fillStyle: data.datasets[0].backgroundColor[i],
                        hidden: false,
                        index: i
                      };
                    });
                  }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const item = sorted[context.dataIndex];
                    return [
                      `${item.name}`,
                      `Value: ${formatNumber(item.value)}`,
                      `Percentage: ${item.percentage}%`
                    ];
                  }
                }
              }
            }
          }
        });

        messageDiv.innerHTML = `<div class="info">✓ Loaded breakdown for <strong>${branch}</strong> branch at commit <strong>${shortSha}</strong></div>`;

      } catch (error) {
        messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        console.error('Error loading breakdown:', error);
      }
    }

    // Event listeners
    document.getElementById('loadBtn').addEventListener('click', loadBreakdown);

    // Allow Enter key to trigger load
    ['flow'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadBreakdown();
      });
    });

    // Show info message on load
    document.getElementById('message').innerHTML = `
      <div class="info">
        Click "Load Latest from 'next'" to visualize benchmark data from the latest commit on the <strong>next</strong> branch.
        Data is fetched via <code>ci.aztec-labs.com</code>.
      </div>
    `;
  </script>
</body>
</html>
