<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barretenberg Benchmark Breakdown Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 30px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .subtitle {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 1rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 6px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      color: #2c3e50;
      font-size: 0.9rem;
    }

    input, select {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #3498db;
    }

    button {
      padding: 12px 24px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }

    button:hover {
      background: #2980b9;
    }

    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .chart-container {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border-radius: 6px;
    }

    .chart-title {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #2c3e50;
      text-align: center;
    }

    .chart-wrapper {
      position: relative;
      height: 600px;
      width: 100%;
      margin: 0 auto;
    }

    canvas {
      max-width: 100% !important;
      max-height: 100% !important;
    }

    .error {
      color: #e74c3c;
      padding: 15px;
      background: #fadbd8;
      border-radius: 4px;
      margin-top: 20px;
    }

    .info {
      color: #3498db;
      padding: 15px;
      background: #d6eaf8;
      border-radius: 4px;
      margin-top: 20px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #7f8c8d;
      font-size: 1.1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
      padding: 20px;
      background: #ecf0f1;
      border-radius: 6px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Barretenberg Benchmark Breakdown Viewer</h1>
    <p class="subtitle">Visualize hierarchical benchmark data showing time spent in each component</p>

    <div class="controls">
      <div class="control-group">
        <label for="level">Hierarchy Level:</label>
        <select id="level">
          <option value="root">Root (Level 0)</option>
          <option value="children">Children (Level 1)</option>
          <option value="grandchildren" selected>Grandchildren (Level 2)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="runtime">Runtime:</label>
        <select id="runtime">
          <option value="native">Native</option>
          <option value="wasm">Wasm</option>
        </select>
      </div>

      <div class="control-group">
        <label for="flow">Flow Name:</label>
        <select id="flow">
          <option value="ecdsar1+transfer_1_recursions+sponsored_fpc">ecdsar1+transfer_1_recursions+sponsored_fpc</option>
          <option value="ecdsar1+transfer_0_recursions+sponsored_fpc" selected>ecdsar1+transfer_0_recursions+sponsored_fpc</option>
          <option value="ecdsar1+token_bridge_claim_private+sponsored_fpc">ecdsar1+token_bridge_claim_private+sponsored_fpc</option>
          <option value="deploy_ecdsar1+sponsored_fpc">deploy_ecdsar1+sponsored_fpc</option>
          <option value="ecdsar1+transfer_1_recursions+private_fpc">ecdsar1+transfer_1_recursions+private_fpc</option>
          <option value="ecdsar1+amm_add_liquidity_1_recursions+sponsored_fpc">ecdsar1+amm_add_liquidity_1_recursions+sponsored_fpc</option>
          <option value="ecdsar1+deploy_tokenContract_with_registration+sponsored_fpc">ecdsar1+deploy_tokenContract_with_registration+sponsored_fpc</option>
          <option value="schnorr+deploy_tokenContract_with_registration+sponsored_fpc">schnorr+deploy_tokenContract_with_registration+sponsored_fpc</option>
          <option value="deploy_schnorr+sponsored_fpc">deploy_schnorr+sponsored_fpc</option>
          <option value="ecdsar1+transfer_0_recursions+private_fpc">ecdsar1+transfer_0_recursions+private_fpc</option>
        </select>
      </div>

      <div class="control-group">
        <label for="sha">Commit SHA (optional):</label>
        <input type="text" id="sha" placeholder="Leave empty for latest from 'next'" />
      </div>

      <div class="control-group">
        <button id="loadBtn">Load Breakdown</button>
      </div>
    </div>

    <div id="message"></div>
    <div id="stats"></div>
    <div id="chartContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
    let currentChart = null;

    // GitHub configuration
    const GITHUB_OWNER = "AztecProtocol";
    const GITHUB_REPO = "aztec-packages";

    // Fetch the latest commit SHA for a branch
    async function getLatestCommitSha(branch) {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/commits?sha=${branch}&per_page=1`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Failed to fetch commits for branch ${branch}`);
        }
        const commits = await response.json();
        if (commits.length === 0) {
          throw new Error(`No commits found for branch ${branch}`);
        }
        return commits[0].sha;
      } catch (error) {
        throw new Error(`Error fetching latest commit: ${error.message}`);
      }
    }

    // Generate nice colors for the pie chart
    function generateColors(count) {
      const colors = [
        '#3498db', '#e74c3c', '#2ecc71', '#f39c12', '#9b59b6',
        '#1abc9c', '#34495e', '#e67e22', '#95a5a6', '#d35400',
        '#c0392b', '#16a085', '#27ae60', '#2980b9', '#8e44ad',
        '#2c3e50', '#f1c40f', '#e84393', '#00b894', '#0984e3'
      ];

      if (count <= colors.length) {
        return colors.slice(0, count);
      }

      // Generate more colors if needed
      const additional = [];
      for (let i = colors.length; i < count; i++) {
        const hue = (i * 137.5) % 360; // Golden angle
        additional.push(`hsl(${hue}, 65%, 55%)`);
      }
      return [...colors, ...additional];
    }

    // Format large numbers with commas
    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }

    // Update URL with current parameters (only non-default values)
    function updateUrl(params) {
      const url = new URL(window.location);
      const defaults = {
        level: 'grandchildren',
        runtime: 'native',
        flow: 'ecdsar1+transfer_0_recursions+sponsored_fpc'
      };

      // Clear existing params
      url.search = '';

      // Add non-default parameters
      for (const [key, value] of Object.entries(params)) {
        if (value && value !== defaults[key]) {
          url.searchParams.set(key, value);
        }
      }

      // Update URL without reloading
      window.history.replaceState({}, '', url);
    }

    // Load and visualize breakdown data
    async function loadBreakdown() {
      const level = document.getElementById('level').value;
      const runtime = document.getElementById('runtime').value;
      const flow = document.getElementById('flow').value.trim();
      const manualSha = document.getElementById('sha').value.trim();
      const messageDiv = document.getElementById('message');
      const statsDiv = document.getElementById('stats');
      const chartContainer = document.getElementById('chartContainer');

      if (!flow) {
        messageDiv.innerHTML = '<div class="error">Please provide a flow name</div>';
        return;
      }

      // Update URL with current parameters
      updateUrl({
        level: level,
        runtime: runtime,
        flow: flow,
        sha: manualSha
      });

      // Clear previous state
      statsDiv.innerHTML = '';
      chartContainer.innerHTML = '';
      if (currentChart) {
        currentChart.destroy();
        currentChart = null;
      }

      try {
        let sha, shortSha, source;

        if (manualSha) {
          // Use manual SHA
          sha = manualSha.length === 7 ? manualSha : manualSha.substring(0, 40);
          shortSha = sha.substring(0, 7);
          source = 'manual SHA';
          messageDiv.innerHTML = '<div class="loading">Loading benchmark data for commit ' + shortSha + '...</div>';
        } else {
          // Fetch latest from next branch
          messageDiv.innerHTML = '<div class="loading">Fetching latest commit from next...</div>';
          sha = await getLatestCommitSha('next');
          shortSha = sha.substring(0, 7);
          source = 'next branch';
          messageDiv.innerHTML = '<div class="loading">Loading benchmark data for commit ' + shortSha + '...</div>';
        }

        messageDiv.innerHTML = '<div class="loading">Loading benchmark data for commit ' + shortSha + '...</div>';

        // Try to fetch from GitHub raw (gh-pages branch stores the files)
        // Path: bench/barretenberg-breakdowns/<flow>/<runtime>-<sha>.json
        const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/gh-pages/bench/barretenberg-breakdowns/${flow}/${runtime}-${shortSha}.json`;

        // Fetch the data
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`Failed to fetch data (${response.status}). The breakdown might not exist for this commit.`);
        }

        const data = await response.json();

        // Clear loading message
        messageDiv.innerHTML = '';

        // Build hierarchy based on selected level
        // Each component is an array of objects with {time, parent, count, etc.}
        const componentsToShow = {};

        // First, find all top-level components (parent is "_root") and get root total time
        const topLevelNames = [];
        let rootTotalTimeSec = 0;
        for (const [name, value] of Object.entries(data)) {
          const valueArray = Array.isArray(value) ? value : [value];
          const hasRootParent = valueArray.some(obj => obj.parent === "_root");
          if (hasRootParent) {
            topLevelNames.push(name);
            // Sum up the root component's time
            const totalTimeNs = valueArray.reduce((sum, obj) => sum + (obj.time || 0), 0);
            const totalTimeSec = totalTimeNs / 1000000000;
            rootTotalTimeSec += totalTimeSec;

            // If showing root level, add it to components
            if (level === 'root') {
              componentsToShow[name] = totalTimeSec;
            }
          }
        }

        let childNames = [];
        let displayedTimeSec = 0;

        if (level === 'children' || level === 'grandchildren') {
          // Find children of root (one level down)
          for (const [name, value] of Object.entries(data)) {
            const valueArray = Array.isArray(value) ? value : [value];
            const hasTopLevelParent = valueArray.some(obj => topLevelNames.includes(obj.parent));
            if (hasTopLevelParent) {
              childNames.push(name);

              if (level === 'children') {
                const totalTimeNs = valueArray.reduce((sum, obj) => sum + (obj.time || 0), 0);
                const totalTimeSec = totalTimeNs / 1000000000;
                componentsToShow[name] = totalTimeSec;
                displayedTimeSec += totalTimeSec;
              }
            }
          }
        }

        if (level === 'grandchildren') {
          // Show grandchildren (two levels down from root)
          for (const [name, value] of Object.entries(data)) {
            const valueArray = Array.isArray(value) ? value : [value];
            const hasChildParent = valueArray.some(obj => childNames.includes(obj.parent));
            if (hasChildParent) {
              const totalTimeNs = valueArray.reduce((sum, obj) => sum + (obj.time || 0), 0);
              const totalTimeSec = totalTimeNs / 1000000000;
              componentsToShow[name] = totalTimeSec;
              displayedTimeSec += totalTimeSec;
            }
          }
        } else if (level === 'children' || level === 'root') {
          displayedTimeSec = Object.values(componentsToShow).reduce((sum, val) => sum + val, 0);
        }

        // Add "Other" for missing time (only if not showing root level)
        if (level !== 'root') {
          const otherTimeSec = rootTotalTimeSec - displayedTimeSec;
          if (otherTimeSec > 0.01) { // Only show if significant (> 10ms)
            componentsToShow['Other'] = otherTimeSec;
          }
        }

        // Calculate total and prepare data for pie chart
        const entries = Object.entries(componentsToShow);
        const total = rootTotalTimeSec; // Use root total time for percentages
        const allComponentCount = Object.keys(data).length;

        // Sort by value (descending) and calculate percentages
        const sorted = entries
          .map(([name, value]) => ({
            name,
            value,
            percentage: (value / total * 100).toFixed(2)
          }))
          .sort((a, b) => b.value - a.value);

        // Show statistics
        const topComponents = sorted.slice(0, 5);
        const levelLabels = {
          'root': 'Root Components',
          'children': 'Child Components',
          'grandchildren': 'Grandchild Components'
        };
        statsDiv.innerHTML = `
          <div class="stats">
            <div class="stat-item">
              <div class="stat-label">Total Time</div>
              <div class="stat-value">${total.toFixed(2)} s</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">${levelLabels[level]}</div>
              <div class="stat-value">${entries.length}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">Largest Component</div>
              <div class="stat-value">${topComponents[0].percentage}%</div>
            </div>
          </div>
        `;

        // Create pie chart
        const levelTitles = {
          'root': 'Root Level',
          'children': 'Children Level (Level 1)',
          'grandchildren': 'Grandchildren Level (Level 2)'
        };
        chartContainer.innerHTML = `
          <div class="chart-container">
            <h2 class="chart-title">${runtime.toUpperCase()} - ${flow}</h2>
            <h3 style="text-align: center; color: #7f8c8d; font-size: 1rem; margin-bottom: 20px;">${levelTitles[level]} (${shortSha})</h3>
            <div class="chart-wrapper">
              <canvas id="pieChart"></canvas>
            </div>
          </div>
        `;

        const ctx = document.getElementById('pieChart').getContext('2d');
        const colors = generateColors(sorted.length);

        currentChart = new Chart(ctx, {
          type: 'pie',
          data: {
            labels: sorted.map(item => item.name),
            datasets: [{
              data: sorted.map(item => item.value),
              backgroundColor: colors,
              borderColor: '#fff',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: {
                  boxWidth: 15,
                  padding: 10,
                  font: {
                    size: 11
                  },
                  generateLabels: function(chart) {
                    const data = chart.data;
                    return data.labels.map((label, i) => {
                      const value = data.datasets[0].data[i];
                      const percentage = sorted[i].percentage;
                      return {
                        text: `${label}: ${percentage}%`,
                        fillStyle: data.datasets[0].backgroundColor[i],
                        hidden: false,
                        index: i
                      };
                    });
                  }
                }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const item = sorted[context.dataIndex];
                    return [
                      `${item.name}`,
                      `Time: ${item.value.toFixed(2)} s`,
                      `Percentage: ${item.percentage}%`
                    ];
                  }
                }
              }
            }
          }
        });

        messageDiv.innerHTML = `<div class="info">✓ Loaded breakdown from <strong>${source}</strong> at commit <strong>${shortSha}</strong></div>`;

      } catch (error) {
        messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
        console.error('Error loading breakdown:', error);
      }
    }

    // Get URL query parameter
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Event listeners
    document.getElementById('loadBtn').addEventListener('click', loadBreakdown);

    // Allow Enter key to trigger load
    ['flow', 'sha'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadBreakdown();
      });
    });

    // Initialize from URL query parameters on page load
    window.addEventListener('DOMContentLoaded', () => {
      const levelParam = getQueryParam('level');
      const runtimeParam = getQueryParam('runtime');
      const flowParam = getQueryParam('flow');
      const shaParam = getQueryParam('sha');

      // Set form values from URL parameters
      if (levelParam) {
        document.getElementById('level').value = levelParam;
      }
      if (runtimeParam) {
        document.getElementById('runtime').value = runtimeParam;
      }
      if (flowParam) {
        document.getElementById('flow').value = flowParam;
      }
      if (shaParam) {
        document.getElementById('sha').value = shaParam;
      }

      // Auto-load if any parameters are present
      if (levelParam || runtimeParam || flowParam || shaParam) {
        loadBreakdown();
      } else {
        // Show info message on load
        document.getElementById('message').innerHTML = `
          <div class="info">
            Leave SHA empty to load the latest commit from <strong>next</strong>, or enter a specific commit SHA for testing.
            Data is fetched from the gh-pages branch via GitHub raw URLs.
          </div>
        `;
      }
    });
  </script>
</body>
</html>
